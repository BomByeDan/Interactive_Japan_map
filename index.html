            for (const [entryId, markerNames] of Object.entries(markerNamesByEntry)) {
                const isSelected = entryId === selectedEntryId;
                const isHighlighted = highlighted.has(entryId);

                for (const markerName of markerNames) {
                    const marker = window[markerName];
                    if (!marker) continue;

                    // Tier-based stacking, with the selected entry on top of all.
                    const baseZ = Math.round(
                        (TIER_SCALE[markerTiers[markerName]] ?? 1.0) * 100
                    );
                    marker.setZIndexOffset(isSelected ? baseZ + 10000 : baseZ);

                    const el = marker.getElement();
                    if (!el) continue;

                    el.classList.toggle("highlight-marker", isHighlighted);
                    el.classList.toggle("selected-marker", isSelected);

                    if (isSelected) {
                        el.style.setProperty("filter", GLOW_SELECTED, "important");
                    } else if (isHighlighted) {
                        el.style.setProperty("filter", GLOW_HIGHLIGHT, "important");
                    } else {
                        el.style.removeProperty("filter");
                    }
                }
            }
        }
        const entriesById = {};
        for (const entry of entries) {
            entriesById[entry.id] = entry;
        }

        map.whenReady(function () {
            Object.entries(markerTiers).forEach(function ([markerName, tier]) {
                const marker = window[markerName];
                if (!marker) {
                    return;
                }

                const scale = TIER_SCALE[tier] ?? 1.0;
                if (scale === 1.0) {
                    return;  // nothing to change
                }

                // The pin's tip (the point that sits on the coordinate).
                const anchor =
                    (marker.options.icon && marker.options.icon.options.iconAnchor) ||
                    [17, 42];

                // Leaflet rewrites the icon's transform on every pan/zoom,
                // so we wrap its position update and add our scale() each time.
                const originalSetPos = marker._setPos;
                marker._setPos = function (pos) {
                    originalSetPos.call(this, pos);
                    if (this._icon) {
                        this._icon.style.transformOrigin =
                            anchor[0] + "px " + anchor[1] + "px";
                        this._icon.style.transform += " scale(" + scale + ")";
                    }
                };

                // Apply it right now, then keep bigger tiers above smaller ones.
                marker.update();
                marker.setZIndexOffset(Math.round(scale * 100));

                // Lift the popup so it doesn't overlap a scaled-up pin.
                const popup = marker.getPopup();
                if (popup) {
                    popup.options.offset = L.point(0, 7 - anchor[1] * (scale - 1));
                }
            });
            applyMarkerGlows(null);
        });
        function refreshMap(fitEntryId) {
            window.setTimeout(function () {
                map.invalidateSize();

                if (fitEntryId && markerNamesByEntry[fitEntryId]) {
                    const latLngs = [];

                    for (const markerName of markerNamesByEntry[fitEntryId]) {
                        const marker = window[markerName];
                        if (marker) {
                            latLngs.push(marker.getLatLng());
                        }
                    }

                    if (latLngs.length === 1) {
                        map.setView(latLngs[0], Math.max(map.getZoom(), 13));
                    } else if (latLngs.length > 1) {
                        map.fitBounds(L.latLngBounds(latLngs), {
                            padding: [35, 35],
                            maxZoom: 14
                        });
                    }
                }
            }, 350);
        }
        // Removes a 4-digit year and tidies the leftover separators,
        // e.g. "14.3.2026" -> "14.3", "2026-03-14" -> "03-14", "March 14, 2026" -> "March 14"
        function stripYear(text) {
            return String(text || "")
                .replace(/(19|20)\d{2}/g, "")
                .replace(/\s+/g, " ")
                .replace(/^[\s,./-]+|[\s,./-]+$/g, "")
                .trim();
        }                        
        function makeEntryButton(entry) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "entry-button";
            if (entry.highlight === true) {
                button.classList.add("highlight-card");
            }
            const style = categoryStyles[entry.category] || {
                background: "#f3f4f6"
            };

            button.style.setProperty("--category-bg", style.background);

            button.dataset.entryId = entry.id;

            const header = document.createElement("div");
            header.className = "entry-header";

            const name = document.createElement("strong");
            name.className = "entry-title";
            name.textContent = entry.name || "Untitled place";

            const meta = document.createElement("div");
            meta.className = "entry-meta";
            const metaParts = [];
            const shortDate = stripYear(entry.date);
            if (shortDate) metaParts.push(shortDate);
            const tier = (entry.tier || "").trim();
            if (tier) metaParts.push("Tier: " + tier);
            meta.textContent = metaParts.join(" · ");

            header.append(name, meta);

            const abstract = document.createElement("small");
            abstract.textContent = entry.abstract || "";

            button.append(header, abstract);
            return button;
        }

        function fillEntryList(container, matchingEntries, emptyMessage) {
            container.replaceChildren();

            if (matchingEntries.length === 0) {
                const message = document.createElement("p");
                message.className = "placeholder";
                message.textContent = emptyMessage;
                container.appendChild(message);
                return;
            }

            for (const entry of matchingEntries) {
                container.appendChild(makeEntryButton(entry));
            }
        }

        function renderSidebar() {
            // The tier filter has priority; the category filter then narrows
            // down only the entries that passed the tier filter.
            const tierEntries = entriesForSelectedTier().filter(entryVisibleByDate);
            const selectedCategory = categoryFilter.value;

            const shownEntries = selectedCategory === "__all__"
                ? tierEntries
                : tierEntries.filter(entry =>
                    (entry.category || "Uncategorized") === selectedCategory
                );

            fillEntryList(
                document.getElementById("category-entries"),
                shownEntries,
                "No entries match this tier and category."
            );

            // Highlights stay independent of both filters.
            const highlightedEntries = entries.filter(
                entry => entry.highlight === true && entryVisibleByDate(entry)
            );

            fillEntryList(
                document.getElementById("highlight-entries"),
                highlightedEntries,
                "No highlighted entries yet."
            );
        }
        let activeMediaItems = [];
        let activeMediaIndex = 0;
        let mediaLoadNumber = 0;
        let currentMediaFolderUrl = '';

        function renderMediaItem() {
            const stage = document.getElementById("media-stage");
            const caption = document.getElementById("media-caption");
            const counter = document.getElementById("media-counter");
            const previousButton = document.getElementById("media-prev");
            const nextButton = document.getElementById("media-next");

            stage.replaceChildren();

            if (activeMediaItems.length === 0) {
                const empty = document.createElement("div");
                empty.className = "media-placeholder";
                empty.textContent = "No media items added yet.";
                stage.appendChild(empty);

                caption.textContent = "";
                counter.textContent = "0 / 0";
                previousButton.disabled = true;
                nextButton.disabled = true;
                return;
            }

            const item = activeMediaItems[activeMediaIndex];

            const frame = document.createElement('iframe');
            frame.className = 'media-frame';
            frame.src = item.previewUrl;
            frame.title = item.title || 'Drive media preview';
            frame.allow = 'autoplay; encrypted-media';
            frame.allowFullscreen = true;
            stage.appendChild(frame);
            caption.textContent = item.caption || item.title || "";
            counter.textContent =
                `${activeMediaIndex + 1} / ${activeMediaItems.length}`;

            const hasMultiple = activeMediaItems.length > 1;
            previousButton.disabled = !hasMultiple;
            nextButton.disabled = !hasMultiple;
            }

            function moveMedia(direction) {
                if (activeMediaItems.length < 2) {
                    return;
                }

                activeMediaIndex =
                    (activeMediaIndex + direction + activeMediaItems.length)
                    % activeMediaItems.length;

                renderMediaItem();
            }

            document.getElementById("media-prev").addEventListener("click", function () {
                moveMedia(-1);
            });

            document.getElementById("media-next").addEventListener("click", function () {
                moveMedia(1);
            });

            // Swipe/drag navigation. Skip this for videos so it doesn't interfere
            // with the video player's controls.
            let swipeStartX = null;

            document.getElementById("media-stage").addEventListener("pointerdown", function (event) {
                const currentItem = activeMediaItems[activeMediaIndex];

                if (currentItem && currentItem.type !== "video") {
                    swipeStartX = event.clientX;
                }
            });

            document.getElementById("media-stage").addEventListener("pointerup", function (event) {
                if (swipeStartX === null) {
                    return;
                }

                const distance = event.clientX - swipeStartX;
                swipeStartX = null;

                if (Math.abs(distance) > 50) {
                    moveMedia(distance < 0 ? 1 : -1);
                }
            });
        async function listDriveMedia(folderUrlString) {
            const folderUrl = new URL(folderUrlString);

            const folderMatch = folderUrl.pathname.match(/\/folders\/([^/]+)/);
            const folderId = folderMatch
                ? folderMatch[1]
                : folderUrl.searchParams.get("id");

            if (!folderId) {
                throw new Error("Could not find a folder ID in this entry's Drive link.");
            }

            // Some Drive sharing links include a resource key.
            const resourceKey =
                folderUrl.searchParams.get("resourcekey") ||
                folderUrl.searchParams.get("resourceKey");

            let pageToken = "";
            const files = [];

            do {
                const params = new URLSearchParams({
                    q: `'${folderId}' in parents and trashed = false`,
                    pageSize: "1000",
                    orderBy: "name",
                    fields: "nextPageToken,files(id,name,mimeType,thumbnailLink,webViewLink,resourceKey)",
                    key: driveApiKey,
                    supportsAllDrives: "true",
                    includeItemsFromAllDrives: "true"
                });

                if (pageToken) {
                    params.set("pageToken", pageToken);
                }

                const headers = resourceKey
                    ? { "X-Goog-Drive-Resource-Keys": `${folderId}/${resourceKey}` }
                    : {};

                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?${params}`,
                    { headers }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Drive API error (${response.status}): ${errorText}`);
                }

                const result = await response.json();
                files.push(...(result.files || []));
                pageToken = result.nextPageToken || "";
            } while (pageToken);

            return files
                .filter(file =>
                    file.mimeType &&
                    (file.mimeType.startsWith("image/") ||
                     file.mimeType.startsWith("video/"))
                )
                .map(file => ({
                    id: file.id,
                    title: file.name,
                    type: file.mimeType.startsWith("video/") ? "video" : "image",
                    src: file.thumbnailLink || "",
                    previewUrl: `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/preview`,
                    fileUrl: file.webViewLink ||
                        `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/view`
                }));
        }
        async function loadEntryMedia(entry) {
            const thisLoad = ++mediaLoadNumber;
            const stage = document.getElementById("media-stage");

            activeMediaItems = [];
            activeMediaIndex = 0;
            currentMediaFolderUrl = entry.media || "";

            stage.textContent = "Loading media…";
            renderMediaItem();

            if (!currentMediaFolderUrl) {
                stage.textContent = "No Drive folder link is set for this entry.";
                renderMediaItem();
                return;
            }

            try {
                const files = await listDriveMedia(currentMediaFolderUrl);

                // Ignore an earlier request if the user opened another entry meanwhile.
                if (thisLoad !== mediaLoadNumber) return;

                activeMediaItems = files;
                activeMediaIndex = 0;

                if (files.length === 0) {
                    stage.textContent = "No viewable photos or videos found in this folder.";
                }

                renderMediaItem();
            } catch (error) {
                if (thisLoad !== mediaLoadNumber) return;

                console.error("Could not load Drive media:", error);
                stage.textContent =
                    "Could not load this folder’s media. Check the folder access and browser Console.";
                renderMediaItem();
            }
        }
        window.showEntry = function (entryId) {
            const entry = entriesById[entryId];
            if (!entry) {
                return;
            }

            document.body.classList.add("expanded");
            document.getElementById("overview").hidden = true;
            document.getElementById("details").hidden = false;

            document.getElementById("detail-name").textContent = entry.name || "";
            document.getElementById("detail-date").textContent = entry.date || "";
            document.getElementById("detail-abstract").textContent =
                entry.abstract || "";
            document.getElementById("detail-memo").textContent = entry.memo || "";

            const mediaLink = document.getElementById("media-link");
            loadEntryMedia(entry);
            mediaLink.href = entry.media || "#";
            mediaLink.textContent = "Open media folder in Google Drive";

            refreshMap(entryId);
            applyMarkerGlows(entryId);
        };

        window.showOverview = function () {
            document.body.classList.remove("expanded");
            document.getElementById("details").hidden = true;
            document.getElementById("overview").hidden = false;

            refreshMap(null);
            applyMarkerGlows(null);
        };

        const tierFilter = document.getElementById("tier-filter");
        const categoryFilter = document.getElementById("category-filter");

        function tierOf(entry) {
            return (entry.tier || "").trim().toUpperCase();
        }

        function entriesForSelectedTier() {
            const selectedTier = tierFilter.value;
            return selectedTier === "__all__"
                ? entries
                : entries.filter(entry => tierOf(entry) === selectedTier);
        }

        // Tier dropdown: S, A, B, C, D first, any other tier names after.
        const preferredTierOrder = ["S", "A", "B", "C", "D"];
        const tierNames = [...new Set(
            entries.map(tierOf).filter(name => name !== "")
        )].sort((a, b) => {
            const aIndex = preferredTierOrder.indexOf(a);
            const bIndex = preferredTierOrder.indexOf(b);
            if (aIndex !== -1 || bIndex !== -1) {
                if (aIndex === -1) return 1;
                if (bIndex === -1) return -1;
                return aIndex - bIndex;
            }
            return a.localeCompare(b);
        });

        const allTiersOption = document.createElement("option");
        allTiersOption.value = "__all__";
        allTiersOption.textContent = "All tiers";
        tierFilter.appendChild(allTiersOption);

        for (const tierName of tierNames) {
            const count = entries.filter(entry => tierOf(entry) === tierName).length;
            const option = document.createElement("option");
            option.value = tierName;
            option.textContent = `Tier ${tierName} (${count})`;
            tierFilter.appendChild(option);
        }

        // Category dropdown: rebuilt whenever the tier changes, so it only
        // offers categories that exist within the selected tier.
        function rebuildCategoryOptions() {
            const previous = categoryFilter.value || "__all__";

            const categories = [...new Set(
                entriesForSelectedTier().map(entry => entry.category || "Uncategorized")
            )].sort((a, b) => a.localeCompare(b));

            categoryFilter.replaceChildren();

            const allOption = document.createElement("option");
            allOption.value = "__all__";
            allOption.textContent = "All categories";
            categoryFilter.appendChild(allOption);

            for (const category of categories) {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            }

            // Keep the previous category if it still exists in this tier.
            categoryFilter.value =
                previous !== "__all__" && categories.includes(previous)
                    ? previous
                    : "__all__";
        }

        tierFilter.addEventListener("change", function () {
            rebuildCategoryOptions();
            renderSidebar();
        });
        categoryFilter.addEventListener("change", renderSidebar);

        rebuildCategoryOptions();

        // One handler supports sidebar entries and marker pop-up buttons.
        document.addEventListener("click", function (event) {
            const target = event.target;
            if (!(target instanceof Element)) {
                return;
            }

            const button = target.closest("[data-entry-id]");
            if (button) {
                window.showEntry(button.dataset.entryId);
            }
        });

        // ---------- Timeline slider + play button ----------
        const PLAY_INTERVAL_MS = 1000;   // time between steps while playing

        const timelineBar = document.getElementById("timeline");
        const slider = document.getElementById("timeline-slider");
        const playButton = document.getElementById("timeline-play");
        const dateLabel = document.getElementById("timeline-date");
        const countLabel = document.getElementById("timeline-count");

        const dayNumbers = entries
            .map(entry => entry.date_ts)
            .filter(day => Number.isFinite(day));
        const distinctDays = [...new Set(dayNumbers)].sort((a, b) => a - b);

        // Only show the bar if there are at least two different dates.
        if (distinctDays.length >= 2) {
            const minDay = distinctDays[0];
            const maxDay = distinctDays[distinctDays.length - 1];
            const entryShown = {};
            for (const entry of entries) entryShown[entry.id] = true;

            function formatDay(day) {
                return new Date(day * 86400000).toLocaleDateString("en-GB", {
                    day: "numeric", month: "short", timeZone: "UTC"
                });
            }

            function applyDateLimit(day) {
                dateLimit = day;
                let changed = false;

                for (const entry of entries) {
                    const show = entryVisibleByDate(entry);
                    if (entryShown[entry.id] === show) continue;
                    entryShown[entry.id] = show;
                    changed = true;

                    for (const markerName of markerNamesByEntry[entry.id] || []) {
                        const marker = window[markerName];
                        if (!marker) continue;
                        const el = marker.getElement();
                        if (el) el.classList.toggle("date-hidden", !show);

                        // The pin's shadow is a separate element, so hide it too.
                        if (marker._shadow) {
                            marker._shadow.classList.toggle("date-hidden", !show);
                        }
                        if (!show) {
                            marker.closePopup();
                            marker.closeTooltip();
                        }
                    }

                    for (const lineName of lineNamesByEntry[entry.id] || []) {
                        const line = window[lineName];
                        if (!line) continue;
                        if (show) line.addTo(map); else map.removeLayer(line);
                    }
                }

                dateLabel.textContent = formatDay(day);
                const shown = entries.filter(entryVisibleByDate).length;
                countLabel.textContent = `${shown} / ${entries.length} entries`;

                if (changed) renderSidebar();
            }

            function setDay(day) {
                slider.value = day;
                applyDateLimit(day);
            }

            let playTimer = null;

            function stopPlaying() {
                if (playTimer) {
                    clearInterval(playTimer);
                    playTimer = null;
                }
                playButton.innerHTML = "&#9654;";
                playButton.setAttribute("aria-label", "Play timeline");
            }

            function startPlaying() {
                // Restart from the first date if the slider is already at the end.
                if (Number(slider.value) >= maxDay) {
                    setDay(minDay);
                }
                playButton.innerHTML = "&#10074;&#10074;";
                playButton.setAttribute("aria-label", "Pause timeline");

                playTimer = setInterval(function () {
                    const current = Number(slider.value);
                    const next = distinctDays.find(day => day > current);
                    if (next === undefined) {
                        stopPlaying();
                        return;
                    }
                    setDay(next);
                    if (next >= maxDay) stopPlaying();
                }, PLAY_INTERVAL_MS);
            }

            playButton.addEventListener("click", function () {
                if (playTimer) stopPlaying(); else startPlaying();
            });

            // Dragging the slider by hand pauses playback.
            slider.addEventListener("input", function () {
                stopPlaying();
                applyDateLimit(Number(slider.value));
            });

            slider.min = minDay;
            slider.max = maxDay;
            slider.value = maxDay;
            applyDateLimit(maxDay);   // starts with everything visible
            timelineBar.hidden = false;
        }

        // Populate the lists when the page loads.
        renderSidebar();
    })();
    
</script>
</html>

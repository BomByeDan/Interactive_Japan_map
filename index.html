curry place, which ended up being absolutely perfect. Soup curry is really a soup. I ordered one where there was some chicken, mushrooms, molten cheese and many vegetables. They also offered 0-20 level of spice, where 0-3 was labelled for begginers, so I chose level 4. Oh mama... That was about 90% of my spice tolerance which got better (I think) throughout the Japan trip. I finished it, but there were some tears. Taste wise (what I could taste behind the spice) it was also really really good. And because I was really hungry, I also ordered a \"addictive salty cabbage\", which really was just salty cabbage, which was fine, but I wouldn't give the addictive label.\n\nIn the first full day the weather was quite bad, so I switched my daily plans. I started by going to Hokkaido shrine, which is the biggest shrine in Hokkaido, and it was quite pretty. They had one of the bigger rope bundles that I've seen during my Japan travels, the main temple area was renovated and neat. I grabbed my goshuin and continued. Then I couldn't resist the call of the neighboring hill, so I climbed it. It was like 250 height meters to go up, and majority of the path was lined with little buddha statues. The hill and shrine are right next to a zoological garden, so maybe they call for friends because I've seen a lot of squirells, many different types of birds, snails, some bugs (some surprisingly big), and also a deer.  The view from the top was very gray because Sapporo isn't the most exciting city to look at from above during the day, and the weather was meh.\n\nThen I continued to another place, this one was a chocolate factory, which should have had some nice theme park to walk through and yummy snacks. When I got there, it really hits you, how much kýč (too cute in a sense) it is. Many statues, some moving, mini cottages, photo spot every 5 meters, some paid ones. All of it styled to like a fantasy/Harry Potter England. The inside of the main building had a big shop, where I, in the end, resisted all temptations, and bought only a choco puff and caramel cube at the café. The choco puff was what would you expect - hard shell with lots of choco cream inside. The caramel cube was just cube of dough with caramel glazing on top, so it was quite dry. \n\nAfter this I went to the Sapporo Beer museum. Sapporo brewery is the oldest in Japan, because it didn't seem like a good idea to the Japanese people to make beer on the main islands, also because the main islands are too hot for that. But after Hokkaido was claimed properly by the Japanese after 1850s, there have been some areas with wild hops around the future Sapporo city. So some Japanese people were sent to Europe to learn how to brew beer from the experts (in Germany...) These guys then went back to Japan and promised the government that they will deliver first purely Japanese batch to Kyoto/Tokyo in 3 years. They almost made it, but the first shipments either exploded, or gone bad because the beer wasn't pasterized and Kyoto and Tokyo were too hot. So they started to put corks and secured it with wires, and the beer crates were put inside crates with ice. Special ice houses were then built around Tokyo and Kyoto, where ice was sold as well as beer. Japanese ppl first didn't have enough money to enjoy the beer because it was very expensive, but with time it was more and more successful also between foreign visitors. Then many rebrands and brand revivals were done to finally secure Sapporo beer as one of the 3 biggest breweries in Japan. What is also interesting is, that because Hokkaido ppl are quite proud of this brand, there's some sort of exclusivity for Hokkaido ppl with Sapporo beer. That is because there is a Sapporo Classic kind, that is sold only on Hokkaido and you can't get it anywhere else, not even in special Sapporo beer bars e.g. in Tokyo. At the end of the visit I ordered Beer tasting set, where I kinda struggled to recognize the differences between 2 of the 3 Beer types. And then moved over to the restaurant to eat another local speciality: Genghis Khan. It is a lamb meat, which is somehow cured to give it special aroma and taste. As a treat I ordered also lamb meat special gyoza, which were really good, and another small beer. This time some special limited edition, but apart from a bit richer taste, the difference wasn't big. But it was one of the restaurants, where there's a teppan in the middle of the table and you're preparing the food on your own. I enjoyed it this time, but it's not my favourite restaurant concept.\n\nAfter this I moved over to a bit remote space called Moerenuma park. There was almost nobody there, but it's a big green area with a manmade hill in the middle and weird glass pyramid and big wide pipe triangle. It gave nice views of the Sapporo panorama from the other side of the city and at the edge of a little forest area on the side of the hill I even saw a fox! Then it was already getting dark, so I headed over to the middle of Sapporo. I was looking to find a good place for miso ramen, and I found out about this Ramen street, which is a tiny street, where there are like 10 different ramen shops and almost all of them are showing off some kind of awards and have people lining up for them. I selected one randomly and got a \"full flavor miso ramen\" which they recommended. It was nice, especially the noodles and soup, but other parts of it were not that excellent. \n\nThe second day I started by going to the Hill of the Buddha, which is probably the most famous Sapporo sight. It is a huge complex which serves as a cemetery. It has many replicas of various well-known monuments that were connected with funeral rites from around the world. They advert their Moai statues the most, but there's also some statues of Egyptian gods, a big 1:1 Stonehenge replica, and some other smaller things. The main cemetery complex is a bit further away and there are some big statues too, but it's closed for tourists. The Buddha in the hill can be seen from almost anywhere in the area by seeing the top part of his head rising from the green hill. There's lavender planted on the hill, but now in September it was too late to see it bloom. To reach the Buddha, you need to go around a big pool of water and then go through a tunnel. When you finally see the big boy, he really is very big. There are some other smaller ones in the walls around him, and there are many kinds of drums and gongs and bells that the praying ppl can sound. Overall it's a very very interesting space.\n\nAfter the Hill of the buddha, I moved a couple of stops towards the middle of the city and went to the Sapporo Art Park. That was a really good stop. First I went inside its Art museum, where absolutely phenomenal works were displayed. Big carved animals or their heads including a killer whale. Wonderful photos of wild horses. Wood carvings of fantasy/anime goat/horse things. Little pingpong sized glass balls with different shapes and colors inside forming flower blooms. Woven cloths showing a bit abstract whales. Etc. Then I went over to some European style cottage inside the park, where when I collected the relevant stamp, the old couple who were in charge of the house went absolutely crazy over my collection of stamps. That was very heartwarming. Then the main part of the park waited for me. This part was a like 2/3 of the park area and it was just a network of paths around the surrounding hilly/foresty area with many many weird statues shown on along the paths. Among my favourites are the cube boy, yellow sitting-standing clan, and the cone of echoes. I really enjoyed my time there. \n\nAfter this it was time to go do the mainstream Sapporo stuff, so I started at the \"old clock tower\" which is the only surviving wooden building from the time of Sapporo establishment in the middle of the city thanks to the people's need for telling the time. In the building they had some info about the history of Sapporo and the different people from US helping the local people start up everything. I was approached by a very nice museum guide who shared some stories with me, and also recommended a place where to get icecream afterwards. So I did, and omg, it was probably the creamiest and most tasty milk icecream I've ever had. Also huge! \n\nThen I went to the brick building, which is the original seat of the Hokkaido government. But didn't go inside. Then I went to the TV tower, where I went inside and even bought ticket to go to the top, which was nice, but again, Sapporo isn't the nicest city to look at, and the tower isn't that tall to be this pricey. But yeah, I would probably regret not getting up there. What was exciting is that I took the stairs down, which are just metal stairs going through the outside, so that made my brain imagine all weird scenarios how it could become very dangerous. I ended the day again with ramen, this time in the highest floor of one mall in the city center, where there were like 6 ramen shops which kinda shared the eating place. Again I picked one randomly and got a spicy miso ramen with a small portion of fried rice. This time egg, meat, and soup were excellent. The other things (noodles, vegetables, fried rice) were not as good.\nOverall my stay in Sapporo was quite successful, the best part were the Hill of the Buddha and Art Parks.", "highlight": false, "tier": "A", "sort_order": 38, "points": [{"latitude": 43.05443488614274, "longitude": 141.30782498365647, "marker_label": "Hokkaido temple", "marker_order": 1}, {"latitude": 43.123441673271046, "longitude": 141.42677849641115, "marker_label": "Moerenuma park", "marker_order": 2}, {"latitude": 42.92065379477952, "longitude": 141.36276693947474, "marker_label": "Hill of the Buddha", "marker_order": 3}, {"latitude": 43.06125360738695, "longitude": 141.35647824132758, "marker_label": "Sapporo TV Tower", "marker_order": 4}], "mediaItems": []}, {"id": "E039", "name": "Asahidake Onsen", "date": "06/09/2026", "date_ts": 20702, "category": "Hike", "abstract": "The mountain stay. Living in a mountain onsen hotel, climbing a beautiful mountain and meeting Saja there. Gorgeous couple of days.", "media": "https://drive.google.com/drive/folders/1lv_6ysZeJS8LdlcVx3tC-39MY78MKjA9?usp=drive_link", "memo": "The second stop on my Hokkaido trip was the Asahidake onsen. The most stressful part about it was getting there and having somewhere to stay, because the accommodation which I was trying to book there had a very weird style of communication and it didn't fill me with confidence. The first part of the trip was taking a train to Asahikawa, where I got about 45 minutes to figure out how to pay for, and how to find the bus going to the Asahidake onsen village, which went only 3 times a day. On the Sapporo train platform I noticed some people wearing hiking gear and having hiking backpacks. Among them the only other non-japanese person - a very pretty girl. She also appeared at the bus stop, and like 2 mins before the bus was leaving another non-japanese person ran over, this time a guy and asked me if the bus goes to Asahidake and how can he pay for it. In the end both this guy and the girl got off the bus one stop sooner than me and I made my way to the accommodation. It was a very nice mountain hut and my reservation was active (thank god).\n\nI was sent to a room for 3 people, but I was there alone so I could spread a bit more. There was still some time before dinner which was served at 6, so I went to check out the visitor center near the ropeway station. The visitor center was really nice, there were many different infographics and descriptions about different paths below and up the mountain with recent sightings of bears and also a room with info movies. I asked the center lady which day would she recommend for doing the big hike I planned out of the two I stayed, because the forecast didn't look too good. She recommended going up the next day as it should be okay until afternoon, when a front with a heavy rain should come. \n\nAt the dinner, which was really really good, there were only 5 guests. An european pair, who didn't interact, and 2 japanese men. One older and one younger. The older asked me where I'm coming from and if I am on my own. Then we talked a bit more and he mentioned that the other Japanese guy has a bottle of saké that he wants to share, and they invited me too. So after the dinner we sat down on one big sofa in chill area, and drank sake from coffee mugs while talking. The older man was a profesor of English language at one of Tokyo's universities, and even though he was already quite drunk, he was able to translate our conversations to the younger man who knew almost no english. We talked about my perception of english knowledge among Japanese people, about middle and eastern Europe, about the balkan war... Interesting evening. After that I went to the onsen in the hotel (as there were no other facilities than a sink to wash myself), which consisted of bigger inside pool, and smaller outside pool. The inside pool was too hot, because it's summer (according to the older japanese guy), but the outside pool was just right to relax a bit.\n\nAfter some more overthinking and triple checking the forecast, I rushed at the breakfast (served at 7:30) to start the hike as soon as possible, and I arrived to the ropeway station just in time to catch the cablecar going up at 8 am. Because the planned path was supposed to take between 5 and 7 hours depending on my tempo, and the rain was supposed to come around 3 pm, I was trying to maintain a quick tempo going up. The mountain is called Asahidake in Japanese, but the local tribes (Ainu) that lived there before Japanese took over called it Kamuy-Mintara (The Playground of the Gods) and is 2291 meters high, which makes it the highest in Hokkaido. After starting from the top of the ropeway at 1650 meters +-, I didn't stop at the area under the main mountain with many volcanic lakes and some vents. On the very steep way up I was trying to match tempo of this teenager who wore only a hoodie and shorts, eventhough it was like 5 degrees and very very windy towards the top. The views were amazing, the front that was coming was visible as a thick blanket of clouds slowly making its way through other mountaintops. Above us a very high thick layer of clouds was blocking the sun, and the visibility to the distance was obstructed by mist, but still, like 50km area around was clearly visible. On the way I overtook some other climbers, and when I finally reached the top, both the girl and the guy from the bus were there. So we finally talked a bit and found out we share the next bit of the hike. We kept talking, stopping just to survive the very steep and slippery descent on the other side of the mountain. The guy is an US army medic, who's in Japan the second month now, and the girl is just visiting for about a month. They asked me about some experiences with Japanese and so on, it was nice.\n\nThe views were getting even better on the other side of the mountain. The color of the surrounding rock was changing from black to white to brown to yellow-ish, and the lower we were the more patches of grass and low bushes appeared. We were also given a very nice look on a huge crater that is a result of a big explosion about 30 000 years ago, through which some shiny streams of water were flowing. When my path split from the other guys, I had to get to a valley of Nakadake river. This river was very stinky with sulfur, but its valley was beautiful with some very dramatic stone sceneries. A very nice bonus was the opportunity to dip my feet into a small pool of the volcanic water. It was so very stinky and very hot. I wouldn't be able to dip more than the feet in there. I shared this experience with two american girls who were very typically american loud about it with many omagaaaads and I caaaan'ts. \n\nThe path after this onsen part led through a plateau which was covered by long grass, short bushes, and occassional bunch of flowers everywhere, which made some of my favourite views of rocks overgrown with these in the green/yellow sea. Slowly I made my way back to the ropeway area, where I still had time to explore the volcanic lakes and vents before needing to head back down. The lakes were beautiful, some had poetic names (husband and wife), and the vents further up the mountain were doing their best to show how much steam they can generate. My favourite part of this area was manmade though. There was a lovely hut made of stone, where it seemed like nothing really is, and indeed, inside there was just an empty area with benches on the side as the hut should serve as emergency shelter in the case of sudden weather change. But there were also like 5 signs to not poop there. I would be really interested to know how many people pooped in there and left before they put up the signs. Was it one? 5? More? After getting to the ropeway I got some local beer and bought a badge to commemorate my climb. Then I made my way back to the hotel and onsen again.\n\nThe second day everything above like halfway of the ropeway was covered in clouds and in the night there really was a heavy rain. So I just tried to walk through all available hiking paths around the village. It should have added up to like 7 hours of hiking, so I started a bit later than the day before so I would reach the halfway - the ropeway station and the only available food serving place around - around lunchtime. First I reached this path that should have taken me to a swamp area, and it was very weird at the start, because there's been just perfect asphalt path in the middle of the forest with nothing around it and on it. What is the purpose? Some running or biking practice? Or a base for crosscountry skiing in the winter so it's easier to maintain? Weird... Then the path changed to quite wide path covered in wooden flakes which really helped to get rid of the worst of the humidity. The path was quite monotonous until it reached the swamp area. There a green and yellow swamp grass covered quite a big area and it resulted in some nice views. The rest of this hiking Path was very uneventful and I reached the tourist center after like 1.5 hours and not 3 as was promised. So I read everything in the center and watched one of the info movies about the creation of the mountain range. Then it was already around 12 so I got lunch at the ropeway station and chilled for a while. \n\nThe path I chose for the afternoon was not maintained very well so it was quite adventurous. There were a lot of slippery stones and low hanging branches which were catching my head or clothes, and it was quite treacherous with two river crosses, where one of them was by a very wet and half-rotten log \"bridge\". But at least it was interesting in this way, because the viewpoints didn't deliver pretty views because of the weather. After this, I got back to the hotel quite soon, so I could enjoy the onsen once more properly and watch some movies.", "highlight": true, "tier": "S", "sort_order": 39, "points": [{"latitude": 43.649337698650854, "longitude": 142.79471044920848, "marker_label": "Asahidake onsen hotel", "marker_order": 1}, {"latitude": 43.664064286424264, "longitude": 142.85442152395444, "marker_label": "Asahidake mountain", "marker_order": 2}, {"latitude": 43.68198158974034, "longitude": 142.86102163004398, "marker_label": "Nakadake onsen", "marker_order": 3}], "mediaItems": []}, {"id": "E040", "name": "Biei", "date": "09/09/2026", "date_ts": 20705, "category": "Town", "abstract": "Agriculture center of Hokkaido with a pretty art place, biking struggles, and the most blue lake you can find", "media": "https://drive.google.com/drive/folders/1JqxjkenQF6z2yrG9wN52KN8nIsMyCF7Q?usp=drive_link", "memo": "After leaving Asahidake onsen area I spent some time in Asahikawa by just walking around their shopping street and park before my next train came. There were quite a lot of statues on the pedestrian area, and as always in public spaces, it was mostly of young naked, or half naked girls. The park I got to was really nice with a lake, many flowers, some pictoresque bridge, and a very small observatory on a mini hill in the middle of the park. The size of the observatory was about the same as in Lošov, maybe smaller.\n\nAfter I got to Biei, I got to the accommodation I booked there, and it was absolutely adorable. A small house, where the front is brunch café and they rent a couple of rooms as a hotel. The whole house smelled like lavender and other herbs, everything was in this rustic european-like style. The owner even gave me a drink and homemade matcha dorimochi as a welcome along with bike map. I was wondering if I should try to visit the places around there on foot, but during my walk in the evening I found a nice bike rental shop that was open even on weekdays and the rent for electric bike was 3000 yen for the full day, so I got it the next morning.\n\nThe bike was the style of grandma's bike with low frame and huge basket in the front. The electro boost took me some time to get used to, but after a while it was okay. First I sent the first batch of postcards, then I went to a random park. In this park there were some decorative buildings, an observation tower (which I climbed of course), and a very fast and very wet slide. Then I continued to the main part of the trip. Biei (and Furano, town a bit further to the south) is known for having these rolling hills of crops, flowers and herbs with many different colors and a bunch of lavender fields. Being it September, the main colors were green, brown, and yellow. Majority of the fields had corn, potatoes, or onions, and many fields had tractors on them doing some work. The bike maps also mentioned that there are many famous trees around. But famous trees for Japanese people, as these trees appear in some ads on TV, or in some romantic movies, so I wasn't really looking out for them.\n\nAfter biking around to reach some observation points, I noticed some arrows pointing to a place called Takushinkan. I quickly looked at Google maps, and decided to check it out. It is a small and very cute photography gallery, which was built by some photographer and is currently run by his grandson. There were very nice photos inside, they had a small café where I got a very good squirrel shaped cookie and a \"lavender haskap berry milk\" which was also really really good. Then they had a little birch alley planted by the original photographer, so I walked through it before heading off. \n\nThe next stop was the Shirogane Blue Pond, which all the bike maps showed as the place to get to. Took me a while to get to a nice bike path towards there and then thank god for having the e-bike. The path was really nice, but toward the lake and onsen further behind it, it was a constant low incline, so the bike stopped immediately after I stopped pedalling for a while. But yeah... I was wondering a bit where are all the tourists, because I haven't seen many around Biei. But I found them all at the Blue Pond. And yeah, the pond is blue alright... It is a very azure blue color like the sky on a very bright day, almost reaching green. It is caused by a very much elevated content of aluminium in the water coming from the volcano formation, where the river which feeds the pond sources from. Of course there is a gift shop/café, where everything sold is azure blue. From typical merch like T-shirts, pins, badges, across ice cream and lemonade, up to meat buns and beer. I got the ice cream and beer before continuing towards the onsen.\n\nAfter reaching the onsen, I found out it's just a spread out hotel complex. Like there wasn't almost anything else than parking spots and hotels. The thing to see there was a waterfall, which is quite interesting, because the water comes out from between a sandwich of bedrock on the bottom, and newer volcanic rock on the top. Next to the waterfall there was a covered staircase towards what seemed a nice viewpoint, so I climbed it, but found myself at a big parking place again instead, this time with at least some decent views. On the way back towards my bike I found a food truck selling croquettes, so I got a pork one and a corn one. The corn one was very good. Even as it was just a bunch of corn in deepfried pocket, it was yummy.\n\nOn the way back towards the town, I stopped at another waterfall. This time it was a bit more classic cascade of small waterfalls coming down some rocks. This time the path towards it was lined with many buddha statues big and small. And the surrounding forest looked also very calm. Then it was just about enjoying the slight incline of the bike path from the better side and enjoying the views around with a nice weather. I also stopped at some glorified road rest area. There was a restaurant, Montblanc shop, and some stuff in towards a forest nearby. Some weird statues or totems or something, and a couple of cornhole game sets. I threw some until I got bored and continued on the way towards the town. The approximately 4 people I met on the way all had a slightly surprised look when they saw a random european guy on grandma's bike rolling downhill towards them... \n\nAfter getting back to the town, I visited their small museum, where there should have been some mention about the Ainu people of that area, but there wasn't much. It was mostly about how the area developed after the Japanese came to do business in the 19th century. Then I biked towards the town's shrine, which was quite nice and they had a path with colorful windchimes that were ringing nicely. I had time to visit another place or two, but I was already too tired to do it, so I just returned the bike and went to chill for a bit. I found out that I've done about 60 kms on the bike that day, so I'm really glad I didn't try to do it on foot. I ended the Biei stay by visiting a local-sourced restaurant and got a really nice burger there.", "highlight": false, "tier": "B", "sort_order": 40, "points": [{"latitude": 43.591400150950854, "longitude": 142.46226015288025, "marker_label": "Biei", "marker_order": 1}, {"latitude": 43.493598303080624, "longitude": 142.61425731251052, "marker_label": "Aoiike - Blue Pond", "marker_order": 2}], "mediaItems": []}, {"id": "E041", "name": "Kushiro", "date": "11/09/2026", "date_ts": 20707, "category": "Museum", "abstract": "South end of Hokkaido, marshlands, and surprise festival with great fireworks", "media": "https://drive.google.com/drive/folders/1dP3qKtBhY6pntruSiZwNmVGJKbLun0Xw?usp=drive_link", "memo": "The longest transit of my trip around Hokkaido was from Biei towards Kushiro. First I needed to get a train from Biei to Asahikawa, then from Asahikawa to Sapporo, and then a long train towards Kushiro. Thankfully, everything went smoothly and the biggest problem was how to kill time in Sapporo before the Kushiro train. In the end I got sushi at Sushiro and then I endured crowds at food stalls in the middle of the town to get some melon icecream. The hotel I had in Kushiro was probably the worst of the trip. I needed to book it on a different site than Booking to also not overpay too much for the quality, which wasn't high. It was nothing horrible, but everything was visibly already quite old, the room was tiny, and the bathroom even tinyer. To get something nice for food I found a nice-looking curry soup place on google and went there. It was really nice, but I was the only one there for the whole time I spent there, so it was a bit awkward. But the soup curry was really good and not as blazing hot as the one I got in Sapporo.\n\nIn the morning I woke up quite early on my own, so I could enjoy the hotel breakfast, which was quite minimalistic, but there were hard-boiled eggs and mini sausages, so I was happy. Then I went towards some lookout place with a small lighthouse near the Kushiro port. The path that Google suggested to me took me through roads which probably weren't travelled by a tourist ever. It was quite beat-down district with houses which were half-empty, or not well-kept, and the few people I saw there were obviously quite surprised to see me there. Nevertheless the lighthouse area was quite nice, they even had one of the binocular things that usually cost some money working for free. After enjoying some time looking at birds hanging around ships in the port through the binoculars I made my way back towards the town center to catch a bus towards the marshland national park.\n\nIf there's one thing that I learned on this Japan and Hokkaido trip, it's that majority of AI tourist plans are somehow flawed. For me the AI devised plan is too short usually. I was triple-checking with Gemini about the plan for the marshlands and he made me believe that I need to choose between area 1 or area 2 and that I should spend like 4 hours in one or the other by walking around the wooden walkways there. Following his suggestion, I went to the further area called On'nenai, because I was promised better chance to see some nice birds there. After getting there I found out that the bigger wooden walkway loop is for 75 minutes at most, so I was looking around the visitor center to figure out what to do other than that, and found out there's a path to the other area (area 1) which follows a former railroad, which is not there anymore, but the solid mound on which the tracks were still can be used to walk towards there, and that it should take about 90-120 minutes to get there like this. Perfect.\n\nThe wooden walkway loop delivered views and some trivia about the marshlands, like that the small puddles that can be seen around the path can be these very deep (3-4 meters deep) gaps, where their bottom is covered in bones of animals that fell into it and couldn't get out afterwards. Also that the valley which is now one big marshland was underwater after the last ice age ended and it's getting drier and drier since then. I've seen also quite a lot of bugs, especially dragonflies, grasshoppers and butterflies, but unfortunately very few birds, and no big ones. I blame other tourists that were there, because some of them literally yelled at each other for some reason. When I turned to the former railroad path, I found myself absolutely alone on the path. Being it railroad path, it was very straight, so I could see quite far both in front of me and behind me, and there was literally noone except me. That brought me more bugs and at least some small birds to see, more calmness and serenity to feel, but also a bit more stress from louder marshland/forest sounds as it is an active bear area and there were some quite fresh paths through the high grass around the path made by some big animal. But overall I really liked this path, also because I saw probably the biggest butterfly/moth of my life there. It was black with some blue marks on it's body and it had at least 10cm wingspan and made a lot of noise flapping its wings to get from one flower to another. \n\nAfter a while I reached the other area, that was simply named \"Kushiro marshlands observatory\" and its wooden walkways. These were built more uphill on a ridge in the surrounding forest. And it was less recently maintained, so some of the boards were missing, moving, or rotten. Sometimes the whole platform moved, so it was a bit worrying. The main thing for this part was an overview of the marshlands from a bit higher elevation and to see the sea of green/brown down below you was quite something. I still had quite a lot of time to spare, so I also went towards what was archeological site of that area. What I found was a clearing, where dugout huts of the Ainu, or the people before them were built to show how the people lived. Again there was absolutely no one there except one keeper, who looked really happy that someone found their way towards there and ran to his toolshed to give me a paper guide with more info when he saw me. The huts are made by digging a hole in the ground and then covering that hole with a roof made of straws. Inside, there's a rectangular fireplace in the middle and otherwise nothing much. Then I walked the rest of the way towards the observatory tower. And because I still had like 50 minutes until the bus back to the town, I paid to go to the roof. Inside there was a small area with some taxidermy of animals of the marshlands and some info about it. The view from the top was nice, but nothing new when compared to the things I saw from the paths around. \n\nAfter coming back to the town, I showered at the hotel and waited for the right time to go out again to watch sunset from this bridge, which should be like THE sunset watching spot. The bridge was absolutely full of people trying to do the same as me. I scooched between one family and some girls in kimono and waited for the show trying not to burn my eyes by watching the sun go down. The girls in kimono were approached by an older guy with a big camera who started talking to them and making photos of them, which was a bit weird, but ok. Only then it occurred to me that there might be a special reason why there are so many people and food trucks on the river bank and why all the hotels were so fricking expensive. And truly, the most important festival for Kushiro was just starting that day. So I also found out that if I wait like an hour, I'll also see a fireworks show launched from a ship in the river right in front of me. So I went to the food trucks, selected one where sandwiches were sold, and oh boy... That poor guy inside was absolutely not ready for the high-pace and high demand of that event. It took like 40 minutes to get my sandwich, eventhough I started like 5th in the queue. By the time I got the sando, the queue increased like 10 times behind me. I doubt the people at the back were able to enjoy their sandwich before or during the fireworks... But it was good, that's for sure. Then I got some garlic shrimps and a sausage at one other food truck with much smaller queue, and a highball at drink stall. Then I walked to the bridge to get a nice spot for the fireworks, but we were turned away from there by security guards, so I continued on the other river bank towards the mouth of the river and found a decent enough spot. And the fireworks were nice! They had some explosions that looked like a smiley face, some that looked like hearts, otherwise classic stuff. The highlight was that they launched the biggest fireworks shell of Japan from further away in the sea. That was a big explosion indeed, but circular with a lot of after explosions. No crazy shapes. After the firework show ended I rushed back to the hotel because I was already quite cold.\n\nThe next morning I had time until 2 pm before my train towards the next stop, so I could go visit the Kushiro city museum. The worst decision about it was to actually walk there with my suitcase and backpack, as it was 40 minutes mostly uphill and at the end I was absolutely drenched in sweat. The museum itself was nice, they had a floor dedicated to nature of the Kushiro area with many bones and taxidermy animals, then a floor with technology of people that came to Kushiro starting with the hunters/gatherers, and ending with the world wars. And in the top floor, they had an exposition dedicated to the Ainu people, so I finally got to know something more coherent about them. The Ainu people probably came to be as a mix between Okhostk people from the north of Hokkaido and by including some aspects they learned from the Honshu Japanese people. They still remained hunters and gatherers, but actively traded with the Japanese to obtain metalwork and weapons, or luxury goods. They believed that there's a mirror spirit world that works almost the same as ours, but that the gods reside in the Spirit world, and humans here. But these gods' spirits visited our world in form of large animals - bears, killer whales, and one type of owls, which were easily domesticated and then worked as guards for the house where they nested. Also, they made clothes from furs and skins of land animals of course, but also from fish skins and e.g. tree bark fabric. They were very skilled woodcarvers, figured out a special type of harpoon to hook the prey better, and other interesting stuff. The descendants of Ainu are now trying to revive their culture, language and customs, as they were only recently officially acknowledeged as aboriginal population of Hokkaido by the Japanese government. They are also trying to get back bones of their ancestors from university archives, where many of them are because of Japanese scholars wanted to study the differences between Ainu and Japanese ppl. \nTo end the Kushiro part, I took a bus back towards the city center, where I got a lunch. Then I went to see the main festival ground, found out it's an agriculture festival with people looking at tractors, eating local potatoes, and watching dance and sing shows at the stage, and went to the train station.", "highlight": false, "tier": "A", "sort_order": 41, "points": [{"latitude": 42.9848853938774, "longitude": 144.38191819191093, "marker_label": "Kushiro", "marker_order": 1}, {"latitude": 43.110712519533585, "longitude": 144.32712068945793, "marker_label": "On'nenai marshlands woodwalk", "marker_order": 2}, {"latitude": 42.981106685860176, "longitude": 144.38553001691162, "marker_label": "Nusamai bridge", "marker_order": 3}, {"latitude": 42.97475626715972, "longitude": 144.4035501873438, "marker_label": "Kushiro city museum", "marker_order": 4}], "mediaItems": []}, {"id": "E042", "name": "Kawayu Onsen", "date": "13/09/2026", "date_ts": 20709, "category": "Hike", "abstract": "The luxury onsen stay in the middle of nowhere. A lot of walking for less exciting stuff to see, but very high end life", "media": "https://drive.google.com/drive/folders/1CKlee3w6gkaHA8Y_gHbv5M4a-LxQSNaZ?usp=drive_link", "memo": "Next stop on my journey was at Kawayu Onsen, which is a little onsen village in the middle of the way between Kushiro and Abashiri. It is also between two big lakes, Kussharo lake and Mashu lake. To get there without a car, one must to take one of 4 trains that go through there in a day. So it's a bit hard to get there, and the accommodation options were not many, so I treated myself to the most expensive stay of my trip in this village. I stayed at an onsen hotel, almost exactly in the middle of the village. It was quite fancy from the first impression, and I also got both dinner and breakfast there. Both of these were in a form of buffet, which was great. Many options, if I should highlight one thing - sushi. The sushi I tried there was probably the most smooth out of any I tried. I didn't have the courage to try to eat the super big crab legs that were there too, because I would probably spend at least 30 minutes only trying to eat one of those. The onsen in this onsen hotel was really good. Two big inside pools with hot water, one outside. Sauna, and cold water pool too. Strong sulfur smell though. But what told me that the hotel is fancy the most was, that there was a chill room with free alcohol opened from 3 to 10 pm everyday. I chilled there at least for a while both evenings I was there, it was a nice space.\n\nA bit harder quest was to figure out the plan for hiking on the full day. The AI friends let me down again, because they suggested only almost impossible plans that either involved 3 hour public transport with long waits in between, or car, or teleportation, or stopping time. In the end I turned to Mapy.cz and planned a trek that would take me about 5 Hours to complete. So I started going that way, the first part was in a forest, where there wasn't much to see except the forest. The bad thing was that everything was extremely wet because of a big rain in the night. So only after this first kilometer everything under my knees was already wet. Then I entered this mainstream path towards the mount Iō, which is a very active volcano. After like kilometer on it I should have turned away from it and circle around one of the surrounding hills, but the path wasn't maintained at all and was very overgrown. Because of this, and the obvious fact that nobody would go through there I didn't want to push through to risk getting injured somewhere on the way and never getting out of there. So I continued towards the volcano. There were some super nice info stations on the way explaining some things about the changes in the environment that are observable on the way towards the volcano. Basically the vegetation changes the same way as if you would climb a mountain, but instead on the vertical axis due to the height, on the horizontal axis due to the distance towards the volcano. So first you start with the lush forest with bamboo grass, and oaks (used for whiskey barrels), then you see pine forest, then the taller pine dies out and labrador tea takes over (it smells really nice, when you squeeze the thick leaves), and at the end of the vegetation part, only some grass, bunches of labrador tea, lichen and moss is left before only barren rock wastelend is left near the volcano. The volcano is not really high, but the vents go all the way down to the foot of the mountain, so as visitors, you can really touch the vents, inhale the sulfur steam and see the bright yellow rocks from up close. Of course nothing of this is advised... The sulfur was mined for some time after Japanese ppl developed Hokkaido. First they sent the Ainu people to do it, but they were not used to such work, so there were a lot of (even fatal) accidents and cave ins, and the production wasn't very high. So they sent prisoners do it instead. The production increased, but if the people didn't die from some accidents, they died of murder, because they got crazy from inhaling the sulfur steam all the time and it messed up their brains. The \"best\" case was just some illness of either lung system, or neural system. After couple of years, it was left to profesionals, but the sulphur demand lowered not long after, so they closed the mine.\n\nThen I figured I could just walk quickly back towards the onsen village and then follow the road towards the Kussharo lake, so I did. The way there was quite boring, because it was cloudy, sometimes rainy, and I was walking quickly on a asphalt sidewalk next to a road. When I reached what I thought would be a little village on the shore of the lake with some benches and so on to chill, I found out it's just a cluster of private cottages, weird closed hotels and abandoned warehouses. A bit further I found a path towards the lake shore at least so I went there. A perfectly situated tree waited for me there, with one big branch in a good position to sit on and eat some snacks I brought. The lake was calm, again, I didn't see a single human, but I was blessed with at least some birds going around there. After a while the sun started to slowly break through the clouds, so I skipped stones for a while, but it took too long, so I decided to go back to the hotel. But! On the way to the road I found a start of a short trail around one of the mini peninsulas there, which promised a huge tree, hilltop, and sandy beach views of the lake, so I went for it. My ass was quite clenched because of the lack of humans, and sounds of things from the forest, but on the way on the trail I saw just some more birds. I don't know if I found the huge tree, I found some huge tree, but no idea if that was THE huge tree. The hilltop had some benches, but all rotten and damp. But the sandy beach lake view was perfect. The sun got through the clouds so the lake shimmered in the light, more birds were seen, some views of the surrounding hills were amazing, and the best thing of it all, the gaps in the clouds created a mountain-shaped window to clear skies. On the first look it seemed like a big mountain far away, but it really was just a gap in the clouds in a perfect mountain shape. So a mountain made of the sky. The closest thing to a celestial sign I've seen so far probably. If my grandgrandgrand...-father saw that, he would move to the mountains in search of a new life for sure.\n\nThe way back to the hotel was interesting in a way, because the shining sun made a lot of bugs crawl out, so I saw A LOT of them. Mainly grasshoppers again, but also many shiny bois, some armored bois, one levitating leaf, a crawling green boi, then a deer got really interested in me, so I could look at it staring at me from only like 10 meters away, and many many moths and butterflies were racing around me. Towards the end, I was pretty tired, but I think the views were quite worth it. In the onsen village I found also a museum dedicated to some sumo wrestler from the 90s, but I wasn't interested enough to go in, as it seemed that it showed mainly photos and some aprons from his competitions, along with his trophies. I ended the day with a very nice onsen bath, nice dinner (this time without overeating), and some movie.", "highlight": false, "tier": "B", "sort_order": 42, "points": [{"latitude": 43.63688647685264, "longitude": 144.43899961623, "marker_label": "Kawayu Onsen hotel", "marker_order": 1}, {"latitude": 43.61109058137906, "longitude": 144.43906722066592, "marker_label": "Mount Io", "marker_order": 2}, {"latitude": 43.645575194935475, "longitude": 144.38142568253951, "marker_label": "Lake Kussharo hike path", "marker_order": 3}], "mediaItems": []}, {"id": "E043", "name": "Abashiri", "date": "15/09/2026", "date_ts": 20711, "category": "Museum", "abstract": "The north edge of Hokkaido, where I visited mainly the prison museum, but then also all other museums available due to no really inspiring things to do in the nature around there.", "media": "https://drive.google.com/drive/folders/1MmrQu5wZkFyJIvw4MSyNU22eAlmbA_TO?usp=drive_link", "memo": "The last proper stop on the eastern part of Hokkaido was Abashiri. It's a town on the northern coast of Hokkaido, and it was recommended to me mainly because of its prison museum. \n\nThe travel from Kawayu onsen to Abashiri was quite easy and not very long, so I had quite a lot of time before check in at the hotel when I got there. I didn't want to just sit in some cafe or on some bench in a park (if there would be any), so I looked what other options are there. The town is quite small, but I found that quite close to the city center is a Shell mound museum, so I went there. The museum was dedicated to archeological digs that have been found on that site. According to the museum, it was there, that the first complete archeological survey aimed at the civilization later called the Okhostk people was done. It is called Shell mound museum, because easily the most interesting part of the dig is this thick layer of bones and shells. Originally I thought that this has some ceremonial purpose, but no. The people just discarded all solid waste to one place and in the end a mound of the waste from their food and crafts was created. The archeologists love that, because they can approximate the diet and some customs and how it changed with the changing seasons. Another interesting thing was that the Okhostk people buried their dead in fetal position and with their head placed in an urn. That enabled these urns to be more easily preserved, so some knowledge could be gained also from the decorations of the urns throughout the ages. The last thing was that the houses of these people were quite big and there was always an altar made of animal skulls. In the biggest house, this was around 9 bear skulls positioned in a pyramid shape as the center piece and many deer, fox, wolves skulls around.\n\nAfter the museum it was actually quite hard to find some place to get lunch, because the town really wasn't big and many places were closed around lunch time. In the end I got decent ramen at a random ramen place. After checking in at the hotel I enjoyed onsen that was available in the hotel (to my pleasant surprise) and chilled for a bit. Then I wanted to go see the sunset to the shore to one viewpoint, but I timed it wrong and arrived only after sunset and also the viewpoint didn't seem accessible for common people.\n\nAnyways the next day was dedicated to museums! First I went to the prison museum, but the path I chose to go there was not good. It was just 40 minutes of walking on a small sidewalk next to a normal road. After I reached the museum, I could start exploring and reading about it. In the end it was a bit different than I expected it to be. The prison was established along with like 4 other prisons at the end of the 19th century as a part of a plan how to develop Hokkaido quickly to defend it against expanding Russian empire. Also nobody from mainland Japan really wanted to go there to battle against the wilderness. And by having a lot of political prisoners from the ranks of samurais that didn't want to switch back to empire after being okay with shogunate, they had a lot of prisoners to send there to work on the things nobody wanted to do. So the Abashiri prison was built very quickly and 1200 prisoners were transferred there. Their main task was to build a road from Asahikawa to Abashiri as quickly as possible. Another large prison was already working in Asahikawa, so when they started the road construction, they made it a competition between the two prisons. That meant that they were really really quick and built hundreds of km of the road in just a couple months, but also that around 200 prisoners and tens of guards from the Abashiri prison died working in the harsh conditions. The museum showed quite a lot of the tools and how the sheds they slept in during the construction looked like. Later the Abashiri prison became a test facility for various agriculture improvements and the prisoners were forced to work hard on the fields growing various crops. This became very successful, and Abashiri prison started producing enough food to feed themselves and many other prisons around Hokkaido. The prisoners that were later freed after their sentence ended could stay in Hokkaido and start their own farms contributing to the development of the whole island. The main building of the prison is constructed in a way that it has a guard position in the middle and then 5 long halls spread from there with the prison cells made in a way that the wooden bars are rotated in a way that the prison cell inside isn't visible from the front, but from certain angle, which also protects the privacy of the prisoners in opposing cells. Additionally there were some stories about half-successful escapes, some long serving legend prisoner, showrooms of how the court looks like, how the prison onsen looks like, kitchen, meal room, etc etc. In total it was quite interesting, but way less hardcore prison than I anticipated. \n\nAfter this I got on a bus going more uphill, where a couple more museums were and also a nice view of the area. The first museum of the two on the hill wasn't really a museum, but maybe like a gallery of drift ice. There were some explanations how drift ice is formed, how is it possible that it travels all the way down to Abashiri, even though it's the same longitude as norther Italy. Explanations of the unique fauna and flora that is dependent on the existence of the drift ice, and of course many photos and videos of the beauty of the white/azure/green ice that can be seen in Abashiri. A nice addition was like almost 3D cinema with a 15 minute spot showing the different animals and so on from the scuba diver's point of views. In the last room, they kept some of the ice in constant -15°C, where you could enter and mess around and make photos for a while. The views from the top of the building were really nice, so I was glad I could be there.\n \nThen I moved to the other museum on the hill, which was the museum of northern people. So a museum showcasing the similarities and differences between civilizations living around polar regions and how they adapted to that life. So there were items and videos from all different civilizations starting from Inuits, across eskimos, north norwegian people, people from siberia, and of course Okhostk and Ainu people. The best part about this museum was, that they had a little screen with authentic videos from either recreations or proper people of these civilisations when they were visited with someone with a camera a long time ago. Otherwise the items on display were also quite interesting and it's very interesting, that the people have so many similar customs even though they didn't and couldn't meet in last like 10 000 years. Like all the shamans, drum dances, musical instruments are quite similar. As well as their hunting methods. Very nice museum indeed!\n\nJust below the museum there was a big park. And in the park I found parkgolf. Something between golf and minigolf. 30-60 m long holes with a big hard plastic ball and wooden club. It cost only 350 yen to borrow the stuff needed, but I had just an hour before the lady closed the place down. There were 4 9-hole courses, so I was rushing to try as many holes as possible, which probably cost me some better score, but after the first two holes I could usually play a bogey or a par, with an occassional birdie here and there. Very good fun for very small prize! Just a bit lonely as I was there completely alone on the whole parkgolf area. After this I didn't want to miss the sunset for the second time, so I speed-walked to the shore, and almost made it in time this time. It was at least in a way that the sun wasn't visible anymore, but there was still light and the clouds were really pretty as well as the colors of the sea and sky. However the other place I chose to see this from was occupied by mosquitoes, so I couldn't enjoy the show until the end, and I ran away from the mosquitoes. I ended the evening at a yakiniku place, where I got some almost wagyu, and set of local beers, and 3 kinds of kimchi. The beers were interesting, but nothing too special. There was a lager, stout, white ale, and some special blue beer. Out of those the white ale was the best, the blue beer tasted a bit like radler, but with very very weak fruit component, so nothing groundbreaking.", "highlight": false, "tier": "A", "sort_order": 43, "points": [{"latitude": 44.02482994295242, "longitude": 144.2692837087311, "marker_label": "Shell mound museum", "marker_order": 1}, {"latitude": 43.99543128483504, "longitude": 144.22993250918103, "marker_label": "Abashiri prison museum", "marker_order": 2}, {"latitude": 43.99688326107161, "longitude": 144.23974934860752, "marker_label": "Museum of Northern peoples", "marker_order": 3}], "mediaItems": []}, {"id": "E044", "name": "Noboribetsu Onsen", "date": "17/09/2026", "date_ts": 20713, "category": "Hike", "abstract": "A short pitstop in Sapporo to do modern stuff. Then the most mainstream onsen in Hokkaido with huge onsen and very lonesome hike. And bears!", "media": "https://drive.google.com/drive/folders/1x_GnJZwdWOgamDCaLf6RtmFUd6bM3z9n?usp=drive_link", "memo": "After leaving Abashiri with a long train going 5.5 hours to Sapporo, I stopped in Sapporo for one night mainly to watch the Odyssey in an IMAX cinema. So I grabbed lunch, went to a laundrymat, checked in at my hotel, got a haircut, got some dinner, and then made my way to the cinema. The cinema was nice, but I don't know if I was just very tired, or if they had the sound system set up in some wrong way, but I couldn't understand many conversations, especially when there was some background noise like waves, battle, some fire or whatever. There were really many moments where there were Japanese subtitles for things I had almost no idea were coherent speech.\n\nAnyways, the next morning I made my way to the Noboribetsu onsen. After getting there and walking through the town I realized how very touristy the place is. I had a lucky hand in choosing the hotel, as I chose a cheaper smaller sister of the main big hotel on the site of the original onsen guesthouse from the 19th century. They are very proud of that legacy and they built a huge hotel there with the biggest bath complex available in the area, to which I got complimentary access by staying in the sister hotel. The onsen complex had like 10 pools with 3 different sources on the main floor, with one large pool ending with huge windows overlooking the hell valley - the valley with active vents and springs from the nearby volcano. Then there was also a normal swimming pool, where I didn't go, because I didn't want to deal with wet swimsuit. And under the main floor there was a floor with outside area, where there were 3 pools and a bar, and inside there was sauna, and steam sauna, cold pool, whirpool (bubbles), couple of hot pools, waterfall area for massaging yourself with the falling water, and a walking pools with hot and cold water. I've spent a lot of time there especially on the full day after my hike. In the evening of the first day I went to check out the wooden walkway path to the hell valley which was nicely illuminated with lanterns, but otherwise not very interesting as you can't really see the things that make the hissing and gurgling sounds and only are sometimes slapped in the face by the sulphur steam. \n\nFor the second day I've planned to hike around the mainstream paths around the onsen town and the hell valley, find all demon statues in the town, and then go on a larger hiking loop towards one lake, which I couldn't find any info at the info centers, but it was clearly marked on my map app, and on Google street view I could find also the starting point with info board and a map. And end the day in a bear park, which was also the only place I could see this almost perfectly round caldera lake from. The walk around the mainstream path was full of very slow walkers with zero spatial awareness and suddenly stopping to make a photo of something, which made me continuously anxious and angry. Another metric for how touristy the place is got obvious on the mainstream hiking trails. There were big trash bins on the trail's resting places. I don't think I've ever seen this many trash bins on such a small place in Japan outside train stations. And I finished the largest mainstream loop which took me to see a black water lake, and natural footbath in like 1.5 hours. The footbath was nice, but compared to the one in Asahidake and all the inside pools, it was pretty cold, so I didn't spent much time there. I decided to go to the bear park now before the longer hike because of fear of not having enough time and energy to enjoy it afterwards.\n\nThe bear park ticket was so expensive... But they had bear cubs! Duck race! Squirrels! And also big bears, one of which did this \"athletic show\" where they hid some treats on various places and he needed to showcase some climbing, standing up, opening of stuff with his paw to get them. Impressive and a bit scary when you realize how big and smart they are. The bear cubs were very cute, they played around and after the athletic show they gave some salmons to the pool in their enclosure, so we could see how they were trying to hunt them and then some arguments between couple of the cubs were visible, sometimes paws were thrown at each other, and many growls and probably bad names were yelled at each other. They also had a little Ainu village with a couple of huts that showcased how would an Ainu house look like with some items inside. The big bears in their enclosures were just chilling. And waiting when somebody throws a treat at them to get it, some of them did some mild tricks like waving, or some poses. Overall I spent more time than I thought I would there. But towards the end I had very very low desire to read some explanations and so on.\n\nThen it was time to do the larger hiking loop. The starting point was at the side of a road, but the road was closed due to falling rocks. It looked like it's mainly for cars, but also nobody on foot entered the road. Except me. So starting from there, I haven't seen any other human until I returned to another road on the other side of the hiking loop. When I reached the starting point of the hiking trail, it looked a bit beaten down, but still good, there were no signs that it would be closed, so I continued. The trail was like 50/50 obvious and hidden, and the more hidden it became the more I was afraid of the loud forest noises. But when I managed to see the source, it was always a deer. One of the critical points was this bridge that was covered in moss, and had couple of the planks broken from rotting away. There was a middle beam to which the planks were secured, so I tried to walk on top of it and I'm glad I did, because one or two of the planks broke under my foot. There were so many places with climbing over fallen trees and squeezing through bamboo grass... And every 10 meters I got hit with some cobweb to my face, which quite often produced a lot of these small spiders that were crawling over me. To get them off I really needed to squeeze them and throw them away. I really hope they weren't ticks and I haven't missed any. But I would say that my onsen time afterwards would kill them in any case. But yeah, the lake I reached in the end was quite worth it. It really looked almost magical. Just this deep green color with the sky reflecting in it, nothing to disturb it. Ethereal. With some backtracking from the lake I reached a road for loggers, so the return to civilization was a bit easier, and my cortisol levels slowly decreased. \n\nAs I said, then I spent a lot of time in the onsen complex and then got a ramen at some local shop. It was fine, nothing special, but expensive because of the location. Then I went out for this animatronic demon show really near my hotel, which was quite fun to see even though it lasted less than 5 minutes.", "highlight": false, "tier": "B", "sort_order": 44, "points": [{"latitude": 42.494721433296505, "longitude": 141.14381328530814, "marker_label": "Noboribetsu Onsen hotel", "marker_order": 1}, {"latitude": 42.497646821062915, "longitude": 141.14867250887798, "marker_label": "The hell valley", "marker_order": 2}, {"latitude": 42.51791048143581, "longitude": 141.12240426851247, "marker_label": "Tachibana lake", "marker_order": 3}], "mediaItems": []}, {"id": "E045", "name": "Hakodate and departure", "date": "20/09/2026", "date_ts": 20716, "category": "Town", "abstract": "The last half-stop in Hokkaido, surprisingly nice people, and last days in Tokyo", "media": "https://drive.google.com/drive/folders/1OzN6xiXMTB1POTmbr8bdo0yRI-6jsWeg?usp=drive_link", "memo": "Well that's it. End of my Hokkaido trip, and with it also the end of my Japanese time. Hopefully just the first Japanese time in my life. Getting from Noboribetsu Onsen to Hakodate was straightforward enough. Just a bus and a train. On the platform for the train, an older Japanese couple was waiting behind me and asked me if I'm american. I told them that I'm from Cz, and they did the almost typical Japanese \"Ooooo, checo desu kaa? Eeee!!!!\" and then asked me for a photo. I first thought they want a couple photo on the platform, but no, they wanted a photo with me, even switched to have photo with both of them. Cute moment.\n\nAfter arriving to Hakodate I had like 2.5 hours to spare before the check-in time at the accommodation, but I was already feeling very mentally tired, so I haven't really figured out a good plan other than getting lunch and sitting there long enough until the checkin. The accommodation I booked for the one night in Hakodate was this typical Japanese guesthouse (ryokan). It was led by two ladies - mother and daughter. The daughter could have had like 40-50 years, the mother like 70-80 probably. They couldn't speak english, so all communication was with the younger lady via google translator. With the place being a ryokan, there were some nuances. The main door could be opened only by one of the two ladies, there was only one guest bathroom in the house and if you wanted to take a bath, and not only a shower, you needed to book a time at least 1 hour ahead for the ladies to prepare it. Also, as a welcome gift, they let us choose one of their good luck charms made by joining and painting 2 shells together. In the rooms, which were a bit larger than I expected, there was only a table with this chair without legs, a small TV, and a futon on tatami floor. Everything was clean and nice smelling, and the lady proudly told us that the place is keeping the same aesthetics for 69 years since it was first opened by the mother of the older lady. Of course some modern additions were done (high tech toilet, WiFi (which didn't work), the TV, AC, and so on).\n\nAnyways I told myself to walk at least for a bit around the town. I walked to the bay area and walked along the coast, which took me to these red brick warehouses, and area with some European style churches, and an island park. With coming evening, the lights made it a quite nice view, but it was quite crowded. In the park, the middle part was just couple of opened spaces for chilling and sports, but there were some skater boys and gals, and a lot of dog walkers at that time. After returning back towards the town, I stopped for dinner at one shop from \"Happy Pierot\" burger joints. There were like 10 of those in Hakodate, and I've seen 3 and all of them had people lining up for it. So I joined the line. After a while a Japanese guy behind me asked if I'm a tourist, and if I want to share table with him, so we both get served sooner and not take up too much space by ourselves. So I agreed, and we talked, he even ended up paying for the dinner after giving me recommendations to try their milkshake and chicken burger set menu. He was a ship manager of around my age, so he said he needs to communicate in English at work, that's why his English was one of the better ones for Japanese people. Nice experience and the milkshake was really good, even though the burger wasn't anything super special. After returning to the ryokan I ordered the shower time, and chilled. I had a long shinkansen ride towards typhoon the next day.\n\nThe shinkansen ride was, as always, super smooth. Even though the typhoon was just approaching Tokyo area, the shinkansen didn't care at all and we got to Tokyo on time. I immediately went to meet up with Mentor to pick up my big luggage from him. Then I checked in, asked about the luggage transport service, and went to buy last proper souvenirs. Then I reorganized the suitcases for the last time. The next day I planned to go close my bank account, find and buy wasabi, and snacks. Then meet Mentor for a while, then get lunch with Saja, the girl from the top of Asahidake mountain, and spend some time with her, and then finish packing the luggages. I started with the bank, but as it was public holiday, it was closed. I moved towards the supermarket for the wasabi and calculated my items carefully to spend my japanese bank account exactly to 0 yen, so I can close the bank account online. Which I calculated correctly, but forgot that the consumer tax is added only at the counter, so with some juggling of the items around, I was left with 3 yen on my bank account. Then I got a good idea to ask how much a plastic bag costs. 3 yen, perfect. So I bought that too. But too soon afterwards, so because of some scam policy, that 2 payments at one place under 5 minutes are suspicious, the 3 yen payment as of now (in the plane to Luxembourg) hasn't been updated on the bank account... So I can't close the account yet.\n\nOther parts of my plan went nicely. We met for a while with Mentor, then I ran to meet up with Saja, we got curry, then I showed her how crazy Japanese people are at Taito stations, then we walked towards Ueno park, and I enjoyed the time, so I hope she did too. The packing went perfectly, because with a limit 23+32 kgs with paying one fee for overweight luggage, I got my suitcases to 22.4 and 31.2 kg, so the weight and also space was used to the maximum capacity. Then I dropped the suitcases at the reception and went for the last Ramen in Tokyo. Got a black sesame garlic oil one, which didn't rank in top 3 soup kinds of Ramen I tried. It was still really really good, but not on the level of spicy miso ramen, or mazesoba ramen.\n\nOn the day of flying away from Tokyo, I hunted some last snack packs to fill up the remaining space in my backpack. Met up for tenpura lunch with Mentor, hugged him at least 3 times for being such a good friend to me in Tokyo and went to the airport. Since then everything goes smooth. Just ladies at immigration office counter were absolutely bored of their job and didn't make the process too easy for me.", "highlight": false, "tier": "B", "sort_order": 45, "points": [{"latitude": 41.770667807002155, "longitude": 140.72792861947875, "marker_label": "Hakodate ryokan stay", "marker_order": 1}, {"latitude": 41.77321588358701, "longitude": 140.721895771647, "marker_label": "Hakodate port", "marker_order": 2}, {"latitude": 41.770794535083354, "longitude": 140.713884124036, "marker_label": "Midori no Shima", "marker_order": 3}], "mediaItems": []}, {"id": "E046", "name": "Random Events", "date": "23/09/2026", "date_ts": 20719, "category": "Town", "abstract": "A collection of small but important events throughout the time in Japan", "media": "https://drive.google.com/drive/folders/1-F6RfBUk5-8MvvHdV9GRmmZ0n4OtHtOL?usp=drive_link", "memo": "Taito visit 1\nI finally got around to visit the Taito arcade center. The Akihabara branch I went to had 5 floors. First 3 are crane games, then 1 floor general arcades, and last floor music arcades. I ended up playing the racing sim game, fighter plane old school game, boxing bag game (3rd hardest punch of the day), and at the music level I played drums (badly), danced (until it became buggy), and played guitar hero (where I wasn't too good due to my selection of songs and already being overwhelmed. On the way out I saw an almost ready to fall big Charizard plushie, but I got baited and after like 6 tries I gave up...\n\nFootball events\nI am trying to go to football event at least once a week. It's played on a rooftop of one elementary school in a modern part of Tokyo, the field is like a third bigger than in LIST football, and the level varies between LIST level and absolute bonkers... Like I've played football against a Copa Italiana 2x times winner with Napoli, who had a 87 rated FIFA card in FIFA 19, because he was in the best squad of the Europa League season. \n\nUniversity of Tokyo student festival\nThere was a student festival, which was like a glorified open doors day, where many many students were showing off their labs and works and also made a lot of stands with various foods. I ended up walking through the event to get something to taste, which was a taiwanese pork bun, really good and really hot. And a random skewer of meat, which was fine. The students were trying to advertise their stands quite aggressively, so I was overwhelmed soon after not having a good sleep the day before.\n\nFireworks festival\nAfter full Enoshima and Kamakura day I rushed over to Adachi to meet the European squad and watch fireworks together. After one fumble when switching trains I was able to see just around half of the one hour programme, but it was very pretty and we had fun watching it and talking in the meantime\n\nCeitec ppl visit\nAt the start of June, Pavel, prof. Kaiser, and Tomáš were making their Japanese tour of visits and after them being delayed by a taifun, we met up for a beer in a cool izakaya area under the tracks of JR line near Yurakuchō station. It feels like a one huge izakaya, but it's actually split into several sections with different owners and menus. It was nice to enjoy some Czech discussions and humor in a surprisingly equal level with them. \n\nIndie rock concert\nThe European squad was called up to one indie rock concert in Shibuya's O-Nest, which is a small club-like club on the top floor of one random Shibuya building. There were 2 bands playing - RuKu (ルク) and Helsinki Lambda Club. RuKu were cute japanese girls which were the reason why TJ suggested to go there, as the bass player is comfy enough to do also super cute funny faces during the songs. But man the guys... Absolutely non-chalant family looking ppl - lead singer - dad, solo guitar - son, bass guitar - weird uncle, drums - cool uncle. And the absolute bangers they played made me instantly add them to my playlist on Spotify. Unfortunately the girls I couldn't find there.\n\nIkebukuro evening of fun \nThe European squad decided it's time to go have some fun on a random wednesday evening. What we decided to do was to get food, spend a little time in the Tokyo's largest gacha shop, and then go try some baseball games. We all took turn at betting, where every one of us was quite bad (I hit normally only like 2/20 balls) with the speed between 90-110 km/h. Then we tried also the throws, where all the guys were completely horrible and I was the only one throwing a decent game, where I cleared 13/16 targets and hit a 100km/h throw. After that we went to Taito, where I had the most fun racing against TJ and 2 random Japanese guys and then piano-tiles like music game, and the drum game with Mentor and zombie killing game with Mentor.\nWent back to the gacha place couple of days later and won a Charmander from a Crane game after like 1500 yen input!\n\nCzech pub with colleagues\nWe finally did the czech pub trip with my colleagues. The place is quite small, but nice. A lot of czech random items from Jágr jersey to many different books and pictures. We ordered almost everything on the menu, Hikaru tried Becherovka with me and the poor guy said \"uuu, very hot\" and went all red in his face... But yeah, we had fried cheese, svíčková, filled dumplings with cabbage, segedín, španělský ptáček and medovník. Couple of beers of course. Many of the food items were quite close to the original, and the guys needed to withstand my rambling about Czech topics.\n\nOgikubo BPump and Nakano broadway with Mentor\nAlright so we finally got to the BPump in Ogikubo with Mentor to see the gym, where some Japanese national team climbers train. And it had Area of like 1.5 floors of Akihabara BPump, the walls were higher, and yeah... if we thought the grading at Akihabara is harsh, here it was one level harsher. I was trying mainly yellow tapes and only climbed like 30% of them. There was only one red that seemed I have a chance at climbing. Mentor struggled a lot too, and it looked like he is very disappointed about it, so I did my best to calm him down.\nThen we went to Nakano Broadway, which should be this place where anime lovers would find everything they dream of. But man... I don't think I encountered more scam place. Normal crane games had the crane set up to open a bit at the top. Then there were double gambling crane games, where you try to get a ticket out with the crane and the ticket can have no win on it. Then machines, where you buy a huge gacha and only one in like 25 has some prize in it. Or machines where you pay 1000 yen for a random Pokémon card. There should be a chance for a Gen1 shiny Pikachu card, but like majority of the cards are like weedle... Then there were some shops that looked legit with some nice stock, but with very high prices. Or shops with hentai only things including gachapons for used panties and various sex toys. The whole vibe of the place was not good for me, probably my least favourite experience so far.", "highlight": false, "tier": "C", "sort_order": 46, "points": [{"latitude": 35.70034852460857, "longitude": 139.7716540815179, "marker_label": "Taito station Akihabara", "marker_order": 1}, {"latitude": 35.658672599916464, "longitude": 139.695289996857, "marker_label": "Shibuya O-Nest", "marker_order": 2}, {"latitude": 35.7093345894189, "longitude": 139.6656953121986, "marker_label": "Nakano Broadway", "marker_order": 3}], "mediaItems": []}];

        function renderMediaItem() {

                `${activeMediaIndex + 1} / ${activeMediaItems.length}`;

            previousButton.disabled = !hasMultiple;

        async function listDriveMedia(folderUrlString) {
            const folderUrl = new URL(folderUrlString);

            const folderMatch = folderUrl.pathname.match(/\/folders\/([^/]+)/);
            const folderId = folderMatch
                ? folderMatch[1]
                : folderUrl.searchParams.get("id");

            if (!folderId) {
                throw new Error("Could not find a folder ID in this entry's Drive link.");
            }

            // Some Drive sharing links include a resource key.
            const resourceKey =
                folderUrl.searchParams.get("resourcekey") ||
                folderUrl.searchParams.get("resourceKey");

            let pageToken = "";
            const files = [];

            do {
                const params = new URLSearchParams({
                    q: `'${folderId}' in parents and trashed = false`,
                    pageSize: "1000",
                    orderBy: "name",
                    fields: "nextPageToken,files(id,name,mimeType,thumbnailLink,webViewLink,resourceKey)",
                    key: driveApiKey,
                    supportsAllDrives: "true",
                    includeItemsFromAllDrives: "true"
                });

                if (pageToken) {
                    params.set("pageToken", pageToken);
                }

                const headers = resourceKey
                    ? { "X-Goog-Drive-Resource-Keys": `${folderId}/${resourceKey}` }
                    : {};

                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?${params}`,
                    { headers }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Drive API error (${response.status}): ${errorText}`);
                }

                const result = await response.json();
                files.push(...(result.files || []));
                pageToken = result.nextPageToken || "";
            } while (pageToken);

            return files
                .filter(file =>
                    file.mimeType &&
                    (file.mimeType.startsWith("image/") ||
                     file.mimeType.startsWith("video/"))
                )
                .map(file => ({
                    id: file.id,
                    title: file.name,
                    type: file.mimeType.startsWith("video/") ? "video" : "image",
                    src: file.thumbnailLink || "",
                    previewUrl: `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/preview`,
                    fileUrl: file.webViewLink ||
                        `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/view`
                }));
        }

                activeMediaIndex = 0;

                renderMediaItem();

        // ---------- Timeline slider + play button ----------
        const PLAY_INTERVAL_MS = 1000;   // time between steps while playing

        const timelineBar = document.getElementById("timeline");
        const slider = document.getElementById("timeline-slider");

        const dateLabel = document.getElementById("timeline-date");
        const countLabel = document.getElementById("timeline-count");

        const dayNumbers = entries

            function applyDateLimit(day) {

                for (const entry of entries) {
                    const show = entryVisibleByDate(entry);
                    if (entryShown[entry.id] === show) continue;

                    for (const markerName of markerNamesByEntry[entry.id] || []) {

        document.addEventListener("keydown", function (event) {
            if (!mediaPlayer.classList.contains("fullscreen")) return;
            if (event.key === "Escape") setMediaFullscreen(false);
            if (event.key === "ArrowLeft") moveMedia(-1);
            if (event.key === "ArrowRight") moveMedia(1);
        });

        function applyViewMode() {
            const mobile = isMobileMode();
            document.body.classList.toggle("mobile", mobile);
            if (!mobile) {
                document.body.classList.remove("panel-open");
                setMediaFullscreen(false);
            }
            updateToggleButton();
            // let Leaflet notice that the map changed size
            setTimeout(function () { map.invalidateSize(); }, 50);
            setTimeout(function () { map.invalidateSize(); }, 400);
        }

        portraitQuery.addEventListener("change", applyViewMode);
        applyViewMode();        
        // Populate the lists when the page loads.
        renderSidebar();
    })();
    
</script>
</html>

<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "News Cycle", sans-serif;
        color: #202a35;
    }

    .folium-map {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 66.666vw !important;
        height: 100vh !important;
        transition: width 0.3s ease;
        z-index: 1;
    }

    #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 33.333vw;
        height: 100vh;
        box-sizing: border-box;
        overflow-y: auto;
        padding: 24px;
        background-color: #fbfaf7;
        background-image: radial-gradient(
            circle,
            rgba(20, 91, 115, 0.07) 1px,
            transparent 1px
        );
        background-size: 18px 18px;
        border-left: 1px solid #d7dee6;
        z-index: 1000;
        transition: width 0.3s ease;
    }

    body.expanded .folium-map {
        width: 33.333vw !important;
    }

    body.expanded #sidebar {
        width: 66.666vw;
    }

    h1 {
        margin: 0 0 12px;
        font-size: 25px;
        line-height: 1.2;
    }

    h2 {
        margin: 24px 0 10px;
        font-size: 18px;
    }

    .intro, .placeholder, .entry-button small,
    .media-section p {
        color: #526171;
        line-height: 1.5;
    }

    .entry-list {
        display: grid;
        gap: 15px;
    }

    .entry-button {
        display: block;
        width: 100%;
        padding: 10px;
        text-align: left;
        border: 1px solid #d7dee6;
        border-radius: 8px;
        background: var(--category-bg, #f3f4f6);
        cursor: pointer;
    }

    .entry-button:hover {
        filter: brightness(0.96);
        border-color: #145b73;
    }

    .entry-button strong,
    .entry-button span,
    .entry-button small {
        margin-top: 5px;
        display: block;
    }

    .entry-button span {
        margin-top: 4px;
        font-size: 13px;
        color: #526171;
    }

    .entry-button small {
        margin-top: 6px;
        font-size: 13px;
    }

    #back-button {
        margin-bottom: 20px;
        padding: 8px 12px;
        cursor: pointer;
    }

    .detail-date {
        color: #526171;
    }

    .detail-abstract {
        font-size: 18px;
        line-height: 1.5;
    }

    .memo-section,
    .media-section {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #e1e6e9;
        border-radius: 10px;
        padding: 16px;
    }

    #detail-memo {
        white-space: pre-wrap;
        line-height: 1.6;
    }

    #media-link {
        display: inline-block;
        margin: 6px 0 20px;
        color: #145b73;
        font-weight: bold;
    }

    @media (max-width: 800px) {
        .folium-map,
        body.expanded .folium-map {
            width: 50vw !important;
        }

        #sidebar,
        body.expanded #sidebar {
            width: 50vw;
            padding: 16px;
        }
    }
    .tier-group {
        margin: 12px 0 18px;
    }

    .tier-heading {
        margin: 0 0 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #eef2f5;
        font-size: 15px;
    }
    .category-label {
        display: block;
        margin: 18px 0 6px;
        font-weight: bold;
    }

    #category-filter {
        width: 100%;
        padding: 10px;
        border: 1px solid #d7dee6;
        border-radius: 6px;
        background: #fff;
        font: inherit;
    }

    .sidebar-section {
        margin-top: 30px;
        border-top: 1px solid #d7dee6;
        padding-top: 15px;
    }

    .sidebar-section > summary,
    .tier-group > summary {
        cursor: pointer;
        font-weight: bold;
        font-size: 18px;
        padding: 6px 0;
    }

    .sidebar-section > summary {
        font-size: 18px;
    }

    .tier-group {
        margin: 8px 0;
    }

    .tier-group > .entry-list {
        margin: 6px 0 12px;
    }

    .placeholder {
        color: #526171;
    }
    h1, h2, h3,
    .sidebar-section > summary,
    .tier-group > summary {
        font-family: "News Cycle", sans-serif;
        font-weight: 700;
    }
    /* More space between the category selector and Journal entries */
    #category-filter {
        margin-bottom: 14px;
    }

    /* More space between section headings and the cards below them */
    .sidebar-section > summary {
        margin-bottom: 12px;
    }

    /* Keep space between Journal entries heading and its cards */
    #category-entries {
        margin-top: 12px;
    }
    .entry-button.highlight-card {
        border: 3px solid #ff1f1f;
    }
    .leaflet-marker-icon.highlight-marker {
        filter:
            drop-shadow(0 0 2px #ff1f1f)
            drop-shadow(0 0 3px #ff1f1f) !important;
    }
    #back-button,
    .expand-entry {
        appearance: none;
        border: 1px solid #145b73;
        border-radius: 8px;
        background: #145b73;
        color: #fff;
        padding: 9px 14px;
        font: inherit;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
        transition: background-color 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
    }

    #back-button:hover,
    .expand-entry:hover {
        background: #0e4659;
        border-color: #0e4659;
    }

    #back-button:active,
    .expand-entry:active {
        transform: translateY(1px);
    }

    #back-button:focus-visible,
    .expand-entry:focus-visible {
        outline: 3px solid #8ecad8;
        outline-offset: 2px;
    }
    .leaflet-popup-content {
        margin: 0 !important;
    }

    .leaflet-popup-content-wrapper {
        padding: 0;
        overflow: hidden;
    }

    .journal-popup {
        width: 250px;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 8px;
        color: #202a35;
        background-color: var(--popup-bg, #f3f4f6);
        background-image: radial-gradient(
            circle,
            rgba(20, 91, 115, 0.07) 1px,
            transparent 1px
        );
        background-size: 16px 16px;
    }
    .media-viewer {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 42px;
        align-items: center;
        gap: 10px;
    }

    .media-stage {
        width: min(100%, 65vh);     /* never taller than ~65% of the window */
        aspect-ratio: 1 / 1;        /* square */
        justify-self: center;       /* keep it centred between the arrows */
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid #d7dee6;
        border-radius: 10px;
        background: #eef2f5;
        touch-action: pan-y;
    }

    .media-content {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #202a35;
    }

    .media-placeholder {
        padding: 24px;
        color: #526171;
        text-align: center;
    }

    .media-arrow {
        width: 40px;
        height: 40px;
        border: 1px solid #d7dee6;
        border-radius: 50%;
        background: #fff;
        color: #145b73;
        font: inherit;
        font-size: 20px;
        cursor: pointer;
    }

    .media-arrow:hover:not(:disabled) {
        background: #eef6f8;
    }

    .media-arrow:disabled {
        opacity: 0.4;
        cursor: default;
    }

    .media-caption-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 8px 2px;
        color: #526171;
        font-size: 14px;
    }
    .media-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #202a35;}
    /* Compact entry cards */
    .entry-list {
        gap: 8px;
    }

    .entry-button {
        padding: 7px 10px;
    }

    .entry-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 10px;
    }

    .entry-button .entry-title {
        margin: 0;
        font-size: 15px;
        line-height: 1.25;
    }

    .entry-meta {
        flex-shrink: 0;
        white-space: nowrap;
        font-size: 12px;
        color: #526171;
    }

    .entry-button small {
        margin-top: 3px;
        font-size: 12.5px;
        line-height: 1.3;
        /* show at most 2 lines of the abstract */
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    #tier-filter {
        width: 100%;
        padding: 10px;
        border: 1px solid #d7dee6;
        border-radius: 6px;
        background: #fff;
        font: inherit;
    }
    /* Timeline bar at the bottom of the map */
    #timeline {
        position: fixed;
        left: 16px;
        bottom: 34px;               /* clears the map attribution text */
        width: calc(66.666vw - 32px);
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 14px;
        background: rgba(251, 250, 247, 0.96);
        border: 1px solid #d7dee6;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 900;
        transition: width 0.3s ease;
    }

    #timeline[hidden] {
        display: none;
    }

    body.expanded #timeline {
        width: calc(33.333vw - 32px);
    }

    @media (max-width: 800px) {
        #timeline,
        body.expanded #timeline {
            width: calc(50vw - 32px);
        }
    }

    #timeline-play {
        width: 36px;
        height: 36px;
        flex-shrink: 0;
        padding: 0;
        border: 1px solid #145b73;
        border-radius: 50%;
        background: #145b73;
        color: #fff;
        font-size: 14px;
        line-height: 1;
        cursor: pointer;
    }

    #timeline-play:hover {
        background: #0e4659;
    }

    #timeline-slider {
        flex: 1;
        min-width: 60px;
        accent-color: #145b73;
        cursor: pointer;
    }

    #timeline-info {
        flex-shrink: 0;
        text-align: right;
        font-size: 13px;
        line-height: 1.25;
        color: #526171;
    }

    #timeline-date {
        display: block;
        font-size: 16px;
        color: #202a35;
    }

    .date-hidden {
        display: none !important;
    }

        display: inline-block;

        border: 1px solid #145b73;

        font: inherit;
        font-weight: 700;
        line-height: 1.2;
        text-decoration: none;

    }

    .map-link-button:hover {
        background: #0e4659;
        border-color: #0e4659;
    }

    .map-link-button:focus-visible {
        outline: 3px solid #8ecad8;
        outline-offset: 2px;
    }

    (function () {
        const map = map_08b13ec27fad9524e52382032a4c022d;
        const entries = [{"id": "E001", "name": "Travel and first exploration", "date": "01/04/2026", "date_ts": 20544, "category": "Town", "abstract": "The journey and first impressions", "media": "https://drive.google.com/drive/folders/1eSK81GvL0bTEKP4tbbplqcJ9hgdaX4bQ?usp=sharing", "memo": "I was lucky to catch a flight from Lux to Helsinky on an anniversary of Lux-Fin connections - free Cinnamon rolls at the airport, free champagne in the plane \n\nThe long flight was quite uncomfortable, the economy seat was fine, but 13:30 h is a lot in full plane...\n\nArrival process took more than an hour, I got some panic throughout the process, but in the end getting a Suica card and getting to Hongo campus was quite smooth.\n\nHongo campus is really nice - almost european looking old buildings, park in the middle with a very nice lake and Japanese stories vibes at night", "highlight": false, "tier": "B", "sort_order": 1, "points": [{"latitude": 49.629157, "longitude": 6.212543, "marker_label": "Lux airport", "marker_order": 1}, {"latitude": 60.318464, "longitude": 24.968599, "marker_label": "Hel airport", "marker_order": 2}, {"latitude": 35.549912, "longitude": 139.778787, "marker_label": "Haneda airport", "marker_order": 3}, {"latitude": 35.711381, "longitude": 139.763187, "marker_label": "Hongo campus", "marker_order": 4}], "mediaItems": []}, {"id": "E002", "name": "Tokyo Dome and Ueno park", "date": "03/04/2026", "date_ts": 20546, "category": "Town", "abstract": "A stroll around Tokyo Dome and Ueno park to hunt some blooming sakura trees", "media": "https://drive.google.com/drive/folders/1OUUdvOopRZXDmT_eBocGxd7yBQD0MYYG?usp=sharing", "memo": "After unsuccessful registration attempt at the municipality, a walk through the streets of Tokyo and around Tokyo Dome. Didn't want to pay for a small garden entry as I had no cash at the time.\n\nUeno park is one of the spots for sakura trees, so the path was packed with ppl trying to get the best photo. The temple looks nice, but didn't spend too much time around as my main quest was to get sushi.\n\nSushiro is the franchise to go for to get fast sushi, I was told... But waiting to get a table took like 15-20 minutes... But man, it was worth it, everything (except crab paste) was super yummy!", "highlight": false, "tier": "B", "sort_order": 2, "points": [{"latitude": 35.706336, "longitude": 139.751763, "marker_label": "Tokyo Dome", "marker_order": 1}, {"latitude": 35.715348, "longitude": 139.773259, "marker_label": "Ueno park", "marker_order": 2}], "mediaItems": []}, {"id": "E003", "name": "First full energy day", "date": "04/04/2026", "date_ts": 20547, "category": "Museum", "abstract": "Dedicated sakura garden visit and Tokyo National museum visit", "media": "https://drive.google.com/drive/folders/1dlj7ZAytT_gZ76DI-eYt9DjFJ8Lo8BMw?usp=sharing", "memo": "The sakura season is on, so let's go see the Sakuras in some nice garden. My weather app is telling me Sunday will be horrible, so let's do it on Saturday! \n\nSo I went, Shinjuku gardens should have like gazzilion different types of Sakuras, so it seemed like a good place. In the end, the most beautiful part was the Japanese garden. For some parts it was too soon to be pretty, as the plants and trees were only waking up from the winter. After like the first 30 minutes it started raining...\n\nAkihabara is very famous anime spot, which is not something I am really into... So I didn't put much attention to it. During the day it probably doesn't feel like it should...\n\nBut oh boy the Curry place... Tiny, maybe 15 spots max, like 2 spots left, I got a beef curry and it was great! But no option to select your spice level, and the default was like 9/10 of my spice tolerance... I'll need to come back some day to try again!\n\nStill the whole afternoon to spend, so with the bad weather I went to the national museum of Tokyo. Consisting of like 4 buildings, it's a big place to explore. One exposition was about old wooden masks and the festivals they were used for, then general Japanese crafts and items from start of civilisation until like 1800s.\n\nOne building was for East Asia expedition of some Japanese explorer/archeologist who wanted to find the origins of the imported buddhism, so items from China/India/even Iran/Egypt were displayed.\n\nNice addition was a \"fortune telling\" section where goat/sheep bones dices gave me good fortune! And a super nice gift shop, where I will need to go back some day.", "highlight": true, "tier": "A", "sort_order": 3, "points": [{"latitude": 35.685768, "longitude": 139.71018, "marker_label": "Shinjuku Goyen Garden", "marker_order": 1}, {"latitude": 35.699957, "longitude": 139.771384, "marker_label": "Akihabara", "marker_order": 2}], "mediaItems": []}, {"id": "E004", "name": "First bouldering sunday", "date": "05/04/2026", "date_ts": 20548, "category": "Town", "abstract": "Start of my bouldering journey and hidden gem shrine", "media": "https://drive.google.com/drive/folders/1oBDGQsBHW-gd_mqnfUjj2PJ4iE2adjbC?usp=sharing", "memo": "Boulderiiiing! Yeah, chose the most european style looking place, where there are 4 floors of boulders of all levels. However the legends were true... Japanese grading system and climbers are on different level. From my V3-V4 in Lux I struggle to do at least some V2-V3s... In french grading the best I did was 5+, but it also shows that my level should be 6B in Lux, which I'm not sure about...\n\nThen I visited Matsuya for the first time and it was great! The food is yummy, the chopsticks are the right thickness, ordering screens are there, so perfect for me.\n\nIn the afternoon a small walk from campus away there is the Nezu shrine, which is super gorgeous. Just walking around and smiling and trying to not offend any deities.", "highlight": false, "tier": "B", "sort_order": 4, "points": [{"latitude": 35.700241, "longitude": 139.767988, "marker_label": "BPump Akihabara", "marker_order": 1}, {"latitude": 35.720624, "longitude": 139.760898, "marker_label": "Nezu Shrine", "marker_order": 2}], "mediaItems": []}, {"id": "E005", "name": "Nikkou with colleagues", "date": "11/04/2026", "date_ts": 20554, "category": "Town", "abstract": "Visit of Nikkou with colleagues. Place where first Shoguns are buried and enshrined, the most decorated buildings in Japan", "media": "https://drive.google.com/drive/folders/1Q5XbigLOzAoGrpqzzJlawsRl8JAiq_2b?usp=drive_link", "memo": "Sugita-san invited everyone to go to Nikkó as it should be beautiful this time of the year, so 7 students, Yuichiro with his wife, visiting professor from US and her son and me went to Nikkó. \n\nThe weather was super nice, the crowds were not big and both student girls and Hikaru were talking to me quite a lot, so that was super nice. The temples should be one of the most decorated temples in Japan as it is the final resting place of quite a few very important Shoguns. \n\nThere is the original no hear no see no speak monkey trio and also unique good luck catto above one gate. In the biggest temple, super amazing thing is a roaring dragon. There is a big painting of a dragon on the ceiling of the main room of the temple, and if you clap, or hit the praying sticks together under it's mouth, there's a very hearable echo \"the dragon roars\". If the sticks are hit together anywhere else in the room, there is no echo.\n\nIn another temple a little outside the main group, there is an original painting of a lion from 1600s, armor of the shogun who is buried there from when he was 15 with a fly head helmet (as it sees everywhere around), and very decorated ceiling with many little dragons with 2 varieties - going up to heaven with a wishing stone, and returning back already without wishing stone. \n\nOverall, the amount of lanterns and cute little things is super nice, the nature around with HUGE trees is great, but I hope to explore more with Kači and Walid next weekend.\n\nOn the way back we stopped near the Kita-Senju train station, where we found the MOST Japanese looking street I've seen so far. It really seems like that's the real place where young japanese ppl go out. We ended up in a taiwanese bar, where there was a little bit of karaoke and we had some drinks with Sugita-san and couple of the other students.", "highlight": false, "tier": "A", "sort_order": 5, "points": [{"latitude": 36.761784, "longitude": 139.599226, "marker_label": "Nikko area", "marker_order": 1}, {"latitude": 35.749472, "longitude": 139.804176, "marker_label": "Kita-Senju bar street", "marker_order": 2}], "mediaItems": []}, {"id": "E006", "name": "Seafront sunday", "date": "12/04/2026", "date_ts": 20555, "category": "Town", "abstract": "Seafront exploration with aquarium visit and walk around Tokyo station", "media": "https://drive.google.com/drive/folders/18J3wOF-L0LHgMCgv0Ed4_uO2VHm7cV-D?usp=drive_link", "memo": "I really wanted to see the sea, smell the salty air, so I asked Hikaru for suggestions and he suggested this park. It is apparently a very popular place for families and young lovera, because so many japanese children I've never seen in my life before. And a LOT of young couples on a date there.\n\nIt is also a bird watching place, so there were a lot of bird watching huts and old japanese ppl with huge cameras. It was nice to walk around and at least hear the different birds eventhough I haven't seen many of them. The beach area has a big BBQ place, where ppl were bringing tents and camping stuff to do their own BBQ party. \n\nAdditionally there is an aquarium with apparently one of the biggest tuna fishes in captivity. And boy they were HUGE. A lot of different displays of different kinds of sealife including hammerhead sharks and penguins. I bought a little sea pancake plushie and a little magnetic tuna. \n\nOn the way back I walked around the Tokyo main station area and the amount of ppl and the size of the place is scary. Will need to explore it better so I know where to go when the shinkansen time comes. On the way back home I stopped in random Izakaya, which was looking modern with tablet ordering system and got chicken skewer menu, which was nice.", "highlight": false, "tier": "B", "sort_order": 6, "points": [{"latitude": 35.642786, "longitude": 139.86002, "marker_label": "Kasai Rinkai park", "marker_order": 1}], "mediaItems": []}, {"id": "E007", "name": "TeamLab Planets with Kaci and Walid", "date": "17/04/2026", "date_ts": 20560, "category": "Museum", "abstract": "One of the most instagram friendly places visit with Kaci and Walid", "media": "https://drive.google.com/drive/folders/1arWdO23jSEYXa0hO5z5yYFvuCs64IMuf?usp=drive_link", "memo": "Kači and Walid arrived for a weekend in Tokyo and I joined their plans for Friday evening. First of all we met to get some food and we found a place with really good Ramen with beef. The owner spoke enough English to accommodate us and the gyoza were excellent!\n\nAfterwards we made our way to TeamLab Planets, which is the most instagram friendly place built to be instagram friendly place I've been to. Big lines of tourists from different areas around there. The experience inside was really good looking, but bizarre in many ways. In the Water part, the first corridor was to be walked barefoot uphill in a stream of water probably just to clean everyone's feet before the next parts... An employee whose only job was to hand little towel to everyone to dry their feet might have one of the worst jobs out there.\n\nThen a various combination of either sensory or aestheticly pleasing rooms followed with big lines towards anything notable.\n\nI'm not sure I would go there on my own, but with Kači and Walid it was a nice experience.", "highlight": false, "tier": "B", "sort_order": 7, "points": [{"latitude": 35.649608, "longitude": 139.790289, "marker_label": "TeamLab Planets", "marker_order": 1}], "mediaItems": []}, {"id": "E008", "name": "Kaci and Walid weekend", "date": "18/04/2026", "date_ts": 20561, "category": "Town", "abstract": "Weekend of timing blunders and substitute programs including meeting not only Kaci and Walid, but also Vaness and Honza", "media": "https://drive.google.com/drive/folders/1Vsk8fl2zpYmb_LFJzE_E1lDipoQ6CioB?usp=drive_link", "memo": "A weekend full of timing blunders (meeting up on Saturday, train miss on Sunday) still brought a lot to be remembered. \n\nOn Saturday we went through the fish market at Tsukiji, where we (mostly I) were overwhelmed with the amount of tourists and little shops selling all kinds of foods and goods. We tasted some local tuna sashimi, wagyu yakitori, fish cake corn dog, some mitarashi dango (sweet soy bean balls dipped in sweet soy sauce), some other sashimi kinds... Don't know if it was to appeal more to the tourists or if it's the default, but the amount of yelling vendors and customer hunters was too much for me.\n\nThen we moved to the Tsukishima street area, where we were able to find a teppanyaki restaurant called Kondō, where we had the luck of being served by the most kind girl yet. The food making is on you, as you'll get just a bowl of stuff and there's a hot plate in front of you. We were assisted by the kind girl to make 3 different kinds of foods, all very tasty. The worst choice of that place was a tomato beer... Which tasted just like when you wash your pasta sauce can with water and drink it. The restaurant is not to blame, I would not expect it to taste otherwise. To add to the cuteness, the girl ran out to wish us a nice day when we were leaving and we met a very old man with a very old and Věry big turtle with a little hat.\n\nIn the afternoon I met with Vaness and Honza and they very much matched my feelings about Japan so far, so we chilled in the Shinjuku Gyoen Gardens together and then went towards the tourist Area of Shinjuku with all the shops and bars and... Ppl...\n\nThe amount of ppl was just overwhelming but we were approached by a Young Japanese man who wants to improve his english and I might meet up with him one of these days. In the end we made our way to the Metropolitan Goverment building, where there was a video show projected on the building façade with Godzilla and Pokemon. Great time there!\n\nOn Sunday we ended up just meeting for sushiro with Kači and Walid after missing our train to Nikkó. Instead I finally bought a notebook for eki stamps and started collecting them! As well as dedicated Goshuin notebook to collect them.", "highlight": false, "tier": "C", "sort_order": 8, "points": [{"latitude": 35.665258, "longitude": 139.770423, "marker_label": "Tsukiji market", "marker_order": 1}, {"latitude": 35.690247, "longitude": 139.691429, "marker_label": "Tokyo Metropolitan Government building", "marker_order": 2}, {"latitude": 35.691005, "longitude": 139.704887, "marker_label": "Shinjuku", "marker_order": 3}], "mediaItems": []}, {"id": "E009", "name": "Nikko with Wendy and Luci", "date": "27/04/2026", "date_ts": 20570, "category": "Town", "abstract": "Wendy and Luci arrived to Japan and we went to see Nikko and the nature above it", "media": "https://drive.google.com/drive/folders/1TSK-U7WevoCU8ZprRvRUJ830jjcoeoFC?usp=drive_link", "memo": "The quest was clear - see the rest of what the Nikkó area has to offer. Mainly the nature above the city itself. After (this time) successfully boarding the train to Nikkó and getting there, we boarded a bus heading up to the Chuzenji lake. \n\nAfter a 45 minute bus ride which consisted of an intense 10+ hairpin climb we got to see the lake. It is a very nice lake. With the mountains around, it creates a very nice piece of nature. We chose to walk to the British and Italian embassy villas a bit further along the lake coast. Well, those guys can pick a nice place to build an embassy villa. The area is also very popular for fishermen as we met and saw a lot of them. \n\nAfter heading back to the bus path, we went to check the Kegon waterfalls, which were a bit underwhelming, but it just might be because of the sunny period. So we made our way back to the temples. We got off the bus a bit earlier than needed which allowed us to explore a little hidden shrine and a christian church closeby. \n\nThen the temple visit, where I got 3 separate Goshuin. One of them was made by an old lady on the spot, which is absolutely impressive. The calligraphy part takes her like 30 seconds and all movements and strokes are perfect. With enough time to spare we made our way slowly to the train station to get back. \n\nBut it wouldn't be a trip to Nikkó without a fuckup... So because of me misreading the info emails, we missed our intended train by 10 minutes... Needed to wait an hour for the next. To end the day we went to the super japanese street near Kita-senju station in Tokyo, where we ended up in Hidakaya to get some ramen. The girls accidently ordered breakfast cold ramen which really wasn't good... I ordered some other one which was at least hot, but not really good... So the day ended on a bit sour note. And this might have been the first unpleasant food place experience in Japan", "highlight": false, "tier": "A", "sort_order": 9, "points": [{"latitude": 36.739526, "longitude": 139.501831, "marker_label": "Nikko nature", "marker_order": 1}], "mediaItems": []}, {"id": "E010", "name": "Hiroshima and Itsukushima visit", "date": "29/04/2026", "date_ts": 20572, "category": "Town", "abstract": "The start of week with Wendy and Luci, first proper stop in Hiroshima and on Itsukushima island - the floating Torii gate shrine, and evening visit of Fushimi Inari Taisha", "media": "https://drive.google.com/drive/folders/1Lxu0xW7gyccTQITJX7AmshUWztwcPpWf?usp=drive_link", "memo": "After arriving to Kyoto to meet the girls, the next day we boarded another shinkansen in the morning to get to Hiroshima. The first thing on the list there was the floating temple at the Itsukushima island.\n\nYou need to get there by a small traject, which was fun with how excited were the Japanese kids about it. The whole island feels like it should be worth a full day trip. By visiting the floating gate and walking around the town near there we did not have time to properly explore the whole island, but the pieces we've seen were very nice. In addition to all the sights, there were some more or less polite deers just hanging around the place.\n\nOn the way back to the trajects I got at least grilled scallops, which were really good. Like way better than I expected, because they almost fell apart in the mouth as opposed to the slimy chewy form I expected. The hardcore seafood taste came only after a while, but did not spoil the experience.\n\nAfter leaving Itsukushima, we made our way to the middle of Hiroshima to see the famous atom dome. The story is as shivering as ever. Even just reading the info near the dome you can't help but feel some shame, because of the heritage. It is a beautiful place in its own way and I am not surprised they are trying to keep it there in the current state. Near there, there's also a tall building, where anybody can go to one of the top floors and do a origami crane and add it to the thousands and thousands others that are in a huge glass compartment spanning most of the floors. \n\nThen we wanted to get food at a famous ramen fastfood, but after waiting 20 minutes for our numbers to get called, we were allowed to go in, but asked to wait in another approx 20 minute line to order. Which was too much for us, so we left for another place. I got big pork schnitzel plate, which I was happy with, but girls were not happy with their chicken ones. We were not really lucky for the food places with the girls...\n\nAfter the food we went to the Hiroshima castle, which looks really nice, has some option to look inside the outer wall structures for free. A lot of koi carps in the moat. On the way back to the station we even met the peace origami crane monument. With still some time left, we could also explore several shrines near the train station out of which some were really nice and calming.\n\nAfter returning from Hiroshima, there was still one place to go to. The Fushimi Inari Taisha temple. It is famous for its seemingly neverending lines of red shrine gates. Apparently during the evening, some parts are even nicer as they are illuminated by lanterns. So we went to check it out.\n\nTo walk through the endless gates is really a nice experience. In the darkness it made me feel even more calm than it would in the day. By no small part thanks to the reduced number of people at that time. My phone camera is not good enough to really capture how pretty some of the parts are. \n\nThis place is definitely worth another visit as the temple site continues all the way to the top of the hill it's at. But as we had so much plans that day, we did not want to climb all the way to the top. I am quite curious if there's some nice view of Kyoto from the top.", "highlight": true, "tier": "S", "sort_order": 10, "points": [{"latitude": 34.275049, "longitude": 132.305763, "marker_label": "Itsukushima", "marker_order": 1}, {"latitude": 34.396334, "longitude": 132.453881, "marker_label": "Hiroshima Atomic Bomb Dome", "marker_order": 2}, {"latitude": 34.968186, "longitude": 135.779445, "marker_label": "Fushimi Inari Taisha", "marker_order": 3}], "mediaItems": []}, {"id": "E011", "name": "First full Kyoto day", "date": "30/04/2026", "date_ts": 20573, "category": "Town", "abstract": "Full Kyoto day of not good weather filled with bamboo, gold villa, and famous neighborhoods exploration", "media": "https://drive.google.com/drive/folders/1VsIoCmxZA__ENjIVJlIYMJAc4xwSgKie?usp=drive_link", "memo": "The first full day in Kyoto was dedicated to visiting the Bamboo forest area and surroundings in the North of Kyoto. The weather wasn't the best, but the big bamboos were quite cool. Of course, as it is one of the main tourist attractions, there were a lot of tourists completely blocking the pathways to try to take a cute photo.\n\nWe also entered one nice shrine with beautiful moss covered gardens and a lot of little stone statues. That was a really beautiful place called Hondo shrine. Later we made our way to Kinkaku-ji the temple with the famous golden pavillon. Again, flooded by tourists we tried to enjoy the stroll around. \n\nThen we tried to make our way back to the city with lunch on the way. Our first option was closed, but we went to a random ramen place where an old couple was serving a very simple ramen, which was extremely good. I took it with some kimchi and that was probably the best kimchi I've ever had. After the trip, the girls ranked this ramen as the best one they had in Japan.\n\nAfter we got back to the city, we made our way to the Kyoto's version of king's road in Prague - the area around Shimokawaracho, where many many little shops on a road connecting several ancient landmarks are. Overloaded by tourists again as expected, we just walked through trying not to fall on the slippery stones.\n\nAfter it got dark I went to visit one shrine, I believe it was the Yasaka shrine. The girls were tired so they went away and I was walking around Gion and also met with Vaness and Honza who were in the middle of their month in Japan. That was a refreshing meeting, we found also a nice water canal area in Gion and talked for a while.", "highlight": false, "tier": "A", "sort_order": 11, "points": [{"latitude": 35.017873, "longitude": 135.671087, "marker_label": "Arashiyama Bamboo forest", "marker_order": 1}, {"latitude": 35.039861, "longitude": 135.729372, "marker_label": "Kinkaku-ji", "marker_order": 2}, {"latitude": 35.000169, "longitude": 135.779504, "marker_label": "Ishibe Koji road", "marker_order": 3}, {"latitude": 35.005611, "longitude": 135.773645, "marker_label": "Gion shirakawa canal", "marker_order": 4}], "mediaItems": []}, {"id": "E012", "name": "Second full Kyoto day", "date": "01/05/2026", "date_ts": 20574, "category": "Town", "abstract": "TeamLab Kyoto visit, Imperial castle visit, lucky streetfood find, and mini izakaya visit with a lot of sake and cute grandpa owner", "media": "https://drive.google.com/drive/folders/1H45bmWBRaOUoi6KR7TYOA--D0dSyzV9b?usp=drive_link", "memo": "The second day in Kyoto started with the visit of TeamLab Kyoto. This branch of TeamLab is apparently the biggest in Japan and has some genuinely interesting displays. I had the most fun in the foam, which was impossible to make a good photo of, but it was really fun. Otherwise about a third of the displays is shared with Tokyo's TeamLab and if the ppl want to spend some time on different things it's quite hard to find yourself again.\n\nFor lunch we went to a place with multiple restaurants, where I chose a very underwhelming chop suey rice. But afterwards we went to visit the Kyoto imperial palace which is a nice Area. We met some group of dressed up locals doing a group photo and inside the palace area, apart from some indoor decorations visible for tourists, the most beautiful place was the garden of the palace.\n\nAfterwards we went for a nearby museum, where I spent more time than the girls so I also chose to go near the Heian-Jingu Shrine to see if it's opened. It wasn't, but there were some stands with food and I got some round gyoza which were probably the best gyoza I had in my life so far. \n\nIn the evening we went to an izakaya near our hotel, where we enjoyed some snackish food (I got a platter of fried stuff - starting with sweet potato, ending with shrimp, and including some sausage, meat, etc.) and also saké. We asked for both hot and cold one with Wendy, and were surprised to get like 0.3-0.4 liter jug for the cold one and like 0.2-0.3 liter vase for the hot one. The hot one is cheaper not because of the amount, but because the hot temperature hides its inferior quality. The cold one tasted quite similar to a kind of Slivovica, but the fruity tones were a bit hidden so the last cup was already a struggle.", "highlight": false, "tier": "B", "sort_order": 12, "points": [{"latitude": 34.984454, "longitude": 135.765023, "marker_label": "TeamLab Biovortex Kyoto", "marker_order": 1}, {"latitude": 35.024519, "longitude": 135.76253, "marker_label": "Kyoto Imperial Palace", "marker_order": 2}, {"latitude": 35.009368, "longitude": 135.762471, "marker_label": "Museum of Kyoto", "marker_order": 3}, {"latitude": 35.016333, "longitude": 135.782641, "marker_label": "Heian Jingu shrine", "marker_order": 4}], "mediaItems": []}, {"id": "E013", "name": "Nara visit and Osaka evening", "date": "02/05/2026", "date_ts": 20575, "category": "Town", "abstract": "Travelling from Kyoto to Osaka via Nara, where we met the bowing deer and visited some shrines", "media": "https://drive.google.com/drive/folders/1lUtoNbA79LWdNSYmrxrp1JxK2XjGYAto?usp=drive_link", "memo": "We figured out that it might be easier to get Nara trip during the transition between Kyoto and Ósaka as it is about the same distance from both the cities and we didn't have any other plans for the day. \n\nSo, initially, Nara was famous because of the shrines and forests around. The very well behaved deer became and attraction only way later in the history of Nara. Nowadays a big number of tourists come to Nara just for the deers, which is understandable, but also a bit sad. Especially as the deers are overloaded with the interactions and can become a bit aggressive. As was illustrated by one of the very first deers we met. We approached slowly and this guy just went straight for my plain white T-shirt and munched on it. After we flicked him, he just munched on the T-shirt more, so it took quite a tug and several flicks to the nose for him to let go and save my apparel.\n\nWe were just walking around trying to enjoy the less aggressive deer interactions, the forest, and smaller and bigger shrines around the area. In the end we walked up to what I believe is the Kasuga shrine. Inside the shrine there are many lantern ways and the dominant is a 1000 year old cedar tree, which looks gorgeous. On the way back to the station we saw also the big Todai-ji complex, where some building were quite impressive.\n\nAfter getting to Ósaka and to the place we stayed there, we were quite surprised of the worn-down look of the surroundings. Basically our hotel was at the edge of one of market streets that became roofed market streets closer to Dobutsen Mae and Ósaka tower. But our part was looking quite rough. A lot of small karaoke bars with older japanese men clientelle, lots and lots of closed shops, some very disturbing looking shops that were open.\n\nAnyways we found a gyoza/dumpling place near there that was quite nice. Aside from the dumplings I ordered also \"house speciality - knuckle licker chicken frames\" and what I got was a cold bowl of heavily marinated chicken parts from god knows which parts of chicken that was more bone than meat. The sauce was really good and my dumpling choice was also on point so I ended up being a little disturbed, but ultimately happy.\n\nThe area around the Ósaka tower is just all-year-long theme park. Many places where you can try to hit the target with various weapons to try to win some prize, even more places with crane games and lots of street food and lots of pachinko/casino places. Very overwhelming part of a town.\n\nTo take a rest from this we made our way to already closed Shitteno-ji Temple complex, where we found a lot of little stone Buddhas. And on the way back home I found the first Skyline GT-R in the wild.", "highlight": false, "tier": "A", "sort_order": 13, "points": [{"latitude": 34.685582, "longitude": 135.843646, "marker_label": "Nara park", "marker_order": 1}, {"latitude": 34.651774, "longitude": 135.506003, "marker_label": "Tsutenkaku", "marker_order": 2}], "mediaItems": []}, {"id": "E014", "name": "Osaka history day", "date": "03/05/2026", "date_ts": 20576, "category": "Museum", "abstract": "First full Osaka day where I split from the girls to visit big museums. In the evening we had the best food experience and eyebrow raising experience.", "media": "https://drive.google.com/drive/folders/11eql3g0ElvRz8x9TqPaNeZpZAbR0--2M?usp=drive_link", "memo": "A full day of Ósaka history. At least for me. The girls didn't want to spend the day, which was quite pretty, in museums, so we decided to split up for that day after reaching Ósaka castle together.\n\nÓsaka castle has one of the biggest moats in the world as it was the ultimate seat of military power of Japan until the end of the WW2. The castle grounds are now mostly parks and green areas. The castle itself is a huge building really showcasing why it became an emoji. The line to get inside was huge, so I did not join it and went to the war museum instead.\n\nThe war museum is a small museum dedicated to the reality of being bombed repeatedly and heavily during the climax of the WW2, as Ósaka castle area was the area with the biggest and the most significant ammo factories in Japan. The US army threw the biggest amount of bombs right here to Ósaka and the town population was reduced from around 6 million ppl pre-war to just 1 million after the war. Most of the ppl were evacuated or chose to go elsewhere of course, but thousands of ppl were killed during the air raids and several drawings and journal entries of the survivors were very graphic.\n\nThe Ósaka town museum was talking about the history of the town starting in 8th century, when the first Chinese-like castle was build there and gave the foundation for the style of buildings in the whole Japan. The expositions talked about how Ósaka was the seat of the Shogunate and by rice auctions the prices of all basic comodities were controlled by the rich right in the Ósaka port. The city layout did not change much since 10th century, except until the industrial revolution, when Ósaka became the \"Manchester of the East\". \n\nThe day ended with us going to get wagyu sukiyaki and it was the best meal of the trip. The kind lady owner was trying to take care of us so we could enjoy the meal as intended, the best photo of the trip was taken there (the cook with the huge chunk of wagyu beef), and overall we had a perfect experience there.\n\nAfter going out we saw some pretty lantern street on our left so we went there and suddenly found ourselves in an area, where each house had an open space where a young girl was sitting on a throne made of pillows, plushies, flowers and she was usually heavily glammed up and wearing anything from full size kimono to bikini. Next to the young girl there was usually an older woman in black who was using a round fan to cool the girl down and was looking out for customers. And also keeping her identity hidden against ppl who should not be there, as are other girls or children. So anytime they saw us, the face of the girl was immediately covered and we were quite loudly shooed away. For me the walk through there until we got back out of that area was very uncomfortable and I can't imagine going to such a place deliberately.", "highlight": false, "tier": "A", "sort_order": 14, "points": [{"latitude": 34.687821, "longitude": 135.525855, "marker_label": "Osaka castle", "marker_order": 1}, {"latitude": 34.683339, "longitude": 135.520533, "marker_label": "Osaka museum of history", "marker_order": 2}, {"latitude": 34.644053, "longitude": 135.503256, "marker_label": "Tobita Shinchi", "marker_order": 3}], "mediaItems": []}, {"id": "E015", "name": "Second Osaka day", "date": "04/05/2026", "date_ts": 20577, "category": "Town", "abstract": "Second full Osaka day, where the main event was visiting the Daruma origin shrine - Katsuo-ji temple", "media": "https://drive.google.com/drive/folders/16s5U0tu6bfx7CQSQ6PlN7CQI0zdSX24A?usp=drive_link", "memo": "On the second day in Ósaka we made our way to the Katsuo-ji Temple, which is famous mainly for it's Daruma icons. The little red figurines with various facial expressions. Those little guys have a fortune slip in their ass, which tells you one of the 64 yin-yang rune combinations that can then be alligned to the thing you were thinking about while choosing the little Daruma. The area of the Katsuo-ji Temple is also lovely and I enjoyed the area very much and the fortune slip I got sounds extremely applicable to my life.\n\nThen we made our way to downtown Ósaka to go look at the big new buildings and potentially try to find some more stamps. As the golden week holidays events were in full Force the amount of ppl around everywhere was becoming unbearable, so we were content with just seeing the buildings from below. On the way back to the hotel I wanted to go inside the Shitteno-ji temple, but arrived 15 minutes too late for both entrance and goshuin. At least we strolled through the antiques flea market and the girls bought some nice souvenirs there.\n\nIn the evening we went to get some ramen around the area of our hotel and our choice was good. It was the biggest portion of Ramen I had so far and with 1 big chicken egg and several small quail eggs, the food was plentiful. My body struggled with the sitting on the ground style of seats, but the food was great.", "highlight": false, "tier": "A", "sort_order": 15, "points": [{"latitude": 34.866479, "longitude": 135.491173, "marker_label": "Katsuo-ji temple", "marker_order": 1}, {"latitude": 34.70583644457979, "longitude": 135.4897156945344, "marker_label": "Umeda Sky building", "marker_order": 2}], "mediaItems": []}, {"id": "E016", "name": "Return to Tokyo", "date": "05/05/2026", "date_ts": 20578, "category": "Town", "abstract": "Journey back to Tokyo with an attempt to see nice things in Hakone and Odawara", "media": "https://drive.google.com/drive/folders/1wcpXhYQf2EZ5ILlLPdNM4XXI4BD1zH0o?usp=drive_link", "memo": "On the last day of our trip we just had to get from Ósaka to Tokyo. However we wanted to also see something pretty and do some part of the Hakone round. The plan was to get off in Odawara, get a bus to the lake Ashi, take a cable car up to the Owakudani active volcano and then get by train from Gora back to Odawara. In ideal case that would be like a 4 hour trip and we had 5.5 hours to spend.\n\nHowever when we wanted to board the bus, the lady told us that due to the Golden Week the traffic jams going to the lake Ashi may take up to 3 hours and sent us to take the train instead. So with a little bit of panic we got to the train towards Gora and googled if we can get to the volcano at least in the updated timeframe.\n\nWhen we got to Gora in the fully packed train, we were already very hungry and when we saw the line to the mountain train that should have taken us to the cablecar, we went for a food instead. The place was very accustomed to western ppl, but the curry I got was pretty nice. Then we climbed through the town to the cablecar station and when we saw the line it became obvious that if we wanted to go up to the volcano, we would have big trouble to catch our Shinkansen from Odawara later.\n\nThere should have been at least a viewpoint further along the road, but after a while the road was closed so the trip ended up being quite a fail. So we made our way back to Odawara, where we found ourselves witnessing the shrine carrying processions with some chants and songs and other stuff going on. That was a nice end to the week full of experiences.", "highlight": false, "tier": "B", "sort_order": 16, "points": [{"latitude": 35.252165208531345, "longitude": 139.1615607274733, "marker_label": "Odawara town", "marker_order": 1}, {"latitude": 35.24850709163191, "longitude": 139.03617261244707, "marker_label": "Gora village", "marker_order": 2}], "mediaItems": []}, {"id": "E017", "name": "First hike in Japan - Mitake yama", "date": "09/05/2026", "date_ts": 20582, "category": "Hike", "abstract": "The first Japanese hike to Mount Mitake and Mount Hinode through beautiful cedar trees forests", "media": "https://drive.google.com/drive/folders/1CtsErN6a7tNsj_-qAGhfcprJ7t3sOUFx?usp=drive_link", "memo": "What a glorious day. I asked Google Gemini to recommend a nice hiking area around Tokyo for me and it delivered one of the nicest days in Japan so far. The journey started with like 1:45 hour Journey to the west of Tokyo to area near Okutama. The journey was planned to take me up to mount Mitake to the Mitake shrine, then through an area called the Rock garden, and because I wanted to push myself a bit also to mount Hinode and then down to a valley to get back to Tokyo.\n\nThere was an option to go from the Mitake train station to the Mitake mountain summit by a combination of bus and a mountain train. I need to train so I went by foot. The climb was very tough. Along the trail the cedar trees were numbered so starting at number 660 from the bottom, I suspected the number 1 was somewhere near the top. What was nice was that along the trail several explanations were put to tell you about the history of the trail. A part about very sharp incline which was made easier by a very fast and sharp turns that some people started calling Rokuro after a ghost with a long neck that curves often.\n\nThe cedar tree 1 was still a few turns below the top, and the first nice view point was from the top station of the mountain train. However the top of the mountain was still some distance away. The Mitake shrine that's at the top is dedicated to wolves so ppl are taking their young puppies to be blessed there. That was one of the best rewards. To see all the puppies there. The views from the main shrine entrance were also very rewarding. \n\nAround that time I started feeling the pain from the hiking shoe vs my right outer ankle contact point which became a big problem towards the end, but did not stop me. \n\nI also visited a little museum with some samurai armor displayed along with some artworks and several katanas which was really nice. Then I made my way to the first waterfalls, where also a little shrine was. Very nice. Then along the river stream and a bit up to reach the stone that looks like a forest spirit's nose so they made 2 little statues of that spirit on the rock. Then down a rickety metal ladder/steps to reach the waterfall where local monks are meditating under. Then back up to by the stairs/ladders towards the Mitake shrine village.\n\nThen go towards mount Hinode, almost alone, except some super fitness japanese ppl running the trail and (of course) a group of like 8-10 german middle aged ppl on a spaziergang. When I reached the Hinode summit, I was rewarded with the nicest views of the day. The view of the Tokyo bay and surrounding hills was simply gorgeous. All that remained was a very painful way down to the bus that I couldn't really concentrate on the surroundings because of very careful stepping on my right foot.", "highlight": true, "tier": "S", "sort_order": 17, "points": [{"latitude": 35.785441, "longitude": 139.149159, "marker_label": "Mitake yama", "marker_order": 1}], "mediaItems": []}, {"id": "E018", "name": "Second hike - Jinba yama", "date": "16/05/2026", "date_ts": 20589, "category": "Hike", "abstract": "The second Japanese hike from mount Jimba across Toben-Shita to mount Takao. Joined by Mentor for this one.", "media": "https://drive.google.com/drive/folders/12iq3-szMp8nrR40ndKWCwtqsZzuGo28t?usp=drive_link", "memo": "For the second Japanese hike I was joined by my Swiss friend Mentor, which added some good talks along the way. We made our way towards the Jinba Toben-Shita bus station and started walking towards Mount Jinba. Instead of taking the road as suggested by the map app, we took a forest hiking trail which was of course shorter, but steeper. The trail was in some parts made almost only by roots of the cedar trees around, which looked cool and gave us an interesting climb.\n\nOf course Mentor's stamina was much better than mine, but he was patient enough to talk with me and wait for me to catch my breath when I needed. So we made our way to the top of mount Jinba, where a weird statue of a... Headless horse? New dinosaur species? Penis creature? stands. Also two bistro/shops were there and most importantly a really nice view of Fuji-san. We enjoyed the views for a while before heading along a ridge walk towards Mt. Takao.\n\nThe ridge walk led us through a couple of other peaks along the way, but the trail was mostly downwards, so we had time to talk and enjoy the views of forests and nature around us. On one of the peaks a closed shop was standing, where a framed quote from a song was hanging which was really uplifting (after I translated it with google).\n\nOn another peak we bought ice cream and met a cute couple of doggos. This was already me changing from the new hiking shoes to my old hiking shoes as I got rid of one problem, but introduced another one, which makes me give up on the shoes. The most random thing then happened when Mentor randomly met one of his friends from France on the trail.\n\nThe final climb to Mt. Takao was rewarded with nice views of Tokyo area and a lot of tourists who either took advantage of a cable car coming there, or climbed the mount from the train station in the valley. We then selected one of the trails coming down to the valley. Started with a lot of wooden steps, brought us through the river stream and shown us a little temple and shrines along the way. Overall, it was a nice hike that wasn't too hard.", "highlight": false, "tier": "A", "sort_order": 18, "points": [{"latitude": 35.652374846460376, "longitude": 139.16651782178724, "marker_label": "Jinba yama", "marker_order": 1}, {"latitude": 35.62614420821322, "longitude": 139.24399594445714, "marker_label": "Takao yama", "marker_order": 2}], "mediaItems": []}, {"id": "E019", "name": "Unicorn Gundam area visit", "date": "23/05/2026", "date_ts": 20596, "category": "Town", "abstract": "Low effort weekend where I visited the Unicorn Gundam statue and surrounding area with Tokyo statue of Liberty among others, and enjoyed full japanese shopping experience", "media": "https://drive.google.com/drive/folders/1IoLgss4inyCpI32V4JpO0jr4V5ygjfzx?usp=drive_link", "memo": "One day before the conference I had some lack of ideas for places to visit, so I took the easy way out and went to see the life-size Unicorn Gundam near Tokyo bay. And it turned out to be a really good decision.\n\nThe Gundam itself is impressive with various little details making it even more believable. But mainly, once every 2 hours it moves!! But less than one would expect... Basically his unicorn horn splits, the mask goes Down and he lights up his thighs and boobs. Still very fun to watch! (After Japan edit: Unicorn Gundam was moved into retirement at the end of August 2026 :( )\n\nThen I completed the Gundam stamp rally, which took me also to a different part of the area, where the Tokyo's Statue of Liberty stands. I'm not sure how much I was aware that this girl and the New York girl are that similar. Turns out Godzilla did not teleport between Tokyo and New York in the movies contrary to my childhood beliefs...\n\nSpeaking of Godzilla... In the mall next to the Gundam, there was an official Godzilla shop! I stocked up on some super cool T-shirts. My haul did not end there as I found an animated series pop-up store, where there was Hazbin Hotel merch! So I got a couple of Tshirts there too.\n\nBut the best part of the day was me encountering two random game challenges in the store. The first one was the reflex falling rod catching game, where you stand inside a half-circle with circa 10 rods hanging on the ring and falling randomly. Was very bad at this, fumbled like 3 catches, so with the final score of 2/10 I got the lowest prize - free drink coupon. The second game had the grip strength measurement machines and a big table of age and gender with the goal score to get a prize. For male 30-39 it was around 34.5 kg. My score was 68.2 kg, so the girl was like \"ooooooo sugoooooiii, today most-o, most-o!!! Sugooooooi!!!\" And handed me the prize - some crackers. A good day even just in a mall.", "highlight": false, "tier": "B", "sort_order": 19, "points": [{"latitude": 35.624649842191346, "longitude": 139.7755708465768, "marker_label": "Unicorn Gundam (former place)", "marker_order": 1}, {"latitude": 35.62798033961795, "longitude": 139.77178863803414, "marker_label": "Tokyo Statue of Liberty", "marker_order": 2}], "mediaItems": []}, {"id": "E020", "name": "JPGU and AGU meeting in Chiba", "date": "24/05/2026", "date_ts": 20597, "category": "Town", "abstract": "A week long conference in Chiba, where I felt quite out of place, but enjoyed some really nice food in various restaurants", "media": "https://drive.google.com/drive/folders/1B88hiaRpBrEtTWGff5yIphhnQn1hK5Jw?usp=drive_link", "memo": "In this week I've attended majority of one of the biggest conferences on Earth and Planetary science in the world. The scope of the meeting was so wide that I haven't been even able to grasp it. Even my \"home\" field of space was so wide, that I was quite lost at talks about hints about mechanisms in ionospheres of Earth or other planets in our Solar system. I won't even comment on all the other topics and sessions I didn't even attend. Throughout the whole conference I heard LIBS mentioned only 2.5 times, so my hopes of getting new collaborations was not cashed in. I'm including a photo of the list of sessions to give you an idea about the size of the conference.\n\nThe surrounding area was just a mixture of hotels and conference centers with a baseball stadium closer to the sea. Through the days some views were quite cool, but can't say I would like to re-visit the place again. \n\nBut the food... I've made the mistake of trying taco bell one day, because 1) it wasn't really good, and 2) the other options around were absolutely perfect. I've had almost perfect lunch every day and the food almost gives me the idea to re-visit the place again, but the 1:30+ h travel time is not worth it.\n\nOverall the week was super tiring, but also quite enjoyable.", "highlight": false, "tier": "C", "sort_order": 20, "points": [{"latitude": 35.64775531984248, "longitude": 140.03556078336285, "marker_label": "Makuhari messe conference center", "marker_order": 1}], "mediaItems": []}, {"id": "E021", "name": "Kamakura and Enoshima", "date": "30/05/2026", "date_ts": 20603, "category": "Town", "abstract": "A beautiful visit of Kamakura and Enoshima areas, where I wished for a bit more time and way less people", "media": "https://drive.google.com/drive/folders/1FykUeoDHA8upWs8jzA4OXDUwuvkTiEFF?usp=drive_link", "memo": "The day after the conference was again full of plans. I wanted to go to the Kamakura and Enoshima area even the previous week, but needed some more googling to figure out the right way to travel over there.\n\nI started with Kamakura and it's several shrines. The first one was Tsurugaoka Hachimangu, a nice shrine, which seemed like a local favourite for couples as there was a lot of couples either just walking around, having photoshoots of them, or of them and their little kid, or having a wedding. Glad I could see a little piece of Japanese wedding there.\n\nI followed by walking to Kotuko-in, where a big bronze buddha stands (sits) since 13th century and withstood all natural and human disasters going into major repairs just twice even when the surrounding buildings were destroyed several times over. The inside of the statue was accessible and it's current \"floating\" stand and reinforced neck were visible as the two major anti-earthquake measures.\n\nThe last temple I visited in Kamakura was the Hase-Dera temple complex. Its patron is a very cute little monk and its uniqueness is a Hydrangea flower walk. The flowers were not in full bloom, but at least some part here and there showed the potential. Another nice place inside the complex was a cave shrine with lots of mini buddhas.\n\nAfter finishing up in Kamakura I made my way towards the Enoshima island with quite overcrowded tram/small train. On the way I got a very nice garlic-y ramen, which was also recognizable by its perfect eggs. Followed with a curry bread, which was quite underwhelming, as it's just a fried Bland dough filled with mediocre curry and cream.\n\nNo wonder the tram was So crowded with the amount of ppl at Enoshima. It was almost impossible to choose your own tempo of exploration as the roads were narrow and very full. Again a lot of young couples. For lazy and disabled ppl there was a payable 4 level escalator to the top of the island, where the Sea Candle tower stands along some gardens next to it. On the way there, there were several shrines, but apart from one with a big Dragon guarding the entrance, nothing extraordinary when compared to the Kamakura ones.\n\nThe nicest part was getting to the top of the Sea Candle to see the surrounding sea and Tokyo from the top of the island. In good weather, there are apparently beautiful sunset views of Fuji-san. For that I was there too soon and Fuji-san was shy, hiding behind mist from the sea.\n\nThen getting all the way to the other end of the island brought me the chance to hear and see the waves crashing against the rocks of the island. There was also a big line towards some sea cave shrine, which I didn't have time to wait for. Another part of the experience were the big predator birds circling overhead. Sometimes pretty close to the people's heads. A signature snack from Enoshima is probably a HUGE shrimp cracker looking almost like a lázeňský oplatek, but bigger. Did not have time or desire to try it though...", "highlight": false, "tier": "A", "sort_order": 21, "points": [{"latitude": 35.31696540225409, "longitude": 139.53560769212723, "marker_label": "Kotoku-in", "marker_order": 1}, {"latitude": 35.29994514507322, "longitude": 139.47842752865614, "marker_label": "Enoshima Sea Candle tower", "marker_order": 2}], "mediaItems": []}, {"id": "E022", "name": "Nagoya", "date": "06/06/2026", "date_ts": 20610, "category": "Town", "abstract": "Visit of Nagoya, one of the largest japanese cities, where Toyota originated. Also they have one of the few castles still standing, although inaccessible.", "media": "https://drive.google.com/drive/folders/1MJ_2msgFFc7MpJ98iKlUi_hftGLNR9GB?usp=drive_link", "memo": "The random choice of Saturday trip this time fell on visiting Nagoya. Nagoya is the 4th biggest city in Japan and coming there I didn't know much about it as it's close to Kyoto and Ósaka, but it doesn't have as rich history as Kyoto, and as vibrant party spirit as Ósaka. The one place that got me interested in going there was the Toyota museum which looked nice from the reviews online.\n\nBut first I took a Shinkansen to go there at quite early hour and spend the time before lunch visiting the Nagoya castle. It was built in the same style as the Ósaka castle and it's currently undergoing a big renovation that's already more than 20 years in the making. So the castle keep is still closed for visitors. However they finished renovating the Honmaru palace, which is like a conference hotel of a Shogun. It was built for the Shogun to stay there during his travels and host local lords and important guests for meetings. The decorations match this importance, as majority of the walls are gold plated and decorated with paintings of wildlife and various scenes. The renovations were done really well so it was definitely worth seeing.\n\nAfterwards I made my way towards the Toyota museum area, where I stopped for lunch to get the recommended miso tonkatsu at a restaurant with such focus. It was a really good choice, the food was really good and I will do my best to learn how to do a \"schnitzel\" of the Japanese style when I'm back in Europe. Then I went through a park that was made in an area of originally huge porcelain factory. But with decrease in production and improvements of technology, the production now takes way less space, so the rest of the areal was transformed into park+community center for public.\n\nThen I entered the Toyota museum, where I found out that it's a free weekend, which means more visitors, more things to do and see, but restricted entry to the \"future pavillon\" decided on first come first serve policy, meaning that with my 2pm arrival all the tickets were already given away and I could not see that part of the exposition. That left me with cotton and other fabric power loom pavillon, and the automobile pavillon.\n\nThe origin of the Toyota company is at the edge between 19th and 20th century, when one very determinated inventor wanted to create an automatic power loom for cotton industry and through various setbacks he finally made it and revolutionized the textile industry in Japan. That made enough money, so his son was able to pursue the research and building of automobile factory. His first success was by reverse engineering US cars and improving the output of their engines, which landed him a contract from Japanese army to supply the army with trucks during WW2. This put his real passion - passenger cars - on hold until after the war, and ultimately the first purely Japanese Toyota passenger car was completed only after his death. By implementing a revolutionary independent wheel suspension system, Toyota cars were by far the most comfortable ones on the market and became a standard for all taxis in Japan. \n\nAnother notable strategy is the \"just in time\" supply chain, where all parts needed for the completion of the order are supplied on demand and not stockpiled endlessly thus reducing the costs of the production and increasing the effectivity or the construction line. \n\nIn the end after the museum I already felt super tired, but I explored a bit this Nagoya shopping arcade district, where several streets are roofed and shops with almost anything you could want are found there. Haven't found or bought anything notable as I didn't have the energy to deal with crowds and browsing.", "highlight": false, "tier": "B", "sort_order": 22, "points": [{"latitude": 35.18489037106475, "longitude": 136.8996882968396, "marker_label": "Nagoya castle", "marker_order": 1}, {"latitude": 35.182651661542494, "longitude": 136.87597386800525, "marker_label": "Toyota museum", "marker_order": 2}, {"latitude": 35.17620471596248, "longitude": 136.89254498806957, "marker_label": "Shotengai Shopping street", "marker_order": 3}], "mediaItems": []}, {"id": "E023", "name": "Third hike - mount Oyama", "date": "13/06/2026", "date_ts": 20617, "category": "Hike", "abstract": "Hike up to Oyama mountain, the rain mountain, that didn't bring rain. Only poor visibility from the top and a very sweaty Dan", "media": "https://drive.google.com/drive/folders/1IlOboO5FGx_iHSAmubAGBnmP8R27lq9A?usp=drive_link", "memo": "For another hike I chose the Oyama mountain. It is one of the most important mountains around Tokyo because it is believed to also be the rain mountain. It is called this way because when rain comes to Tokyo area, the clouds always gather first around this mountain. Because of this belief and the connected icons, there are very well known pilgrimage traditions connected to here.\n\nIn the Edo times, people would make a big wooden sword that needed to be carried by several people and bring it up the mountain to the temple built there to get blessings for their endeavors. Farmers would come to ask for good harvest in the season. Even warriors would come to get blessings for their missions. As such there were a lot of people coming there with me.\n\nThere is a cable car coming near the temple, but I walked the pilgrimage road that is split between the male and female roads, where male path is a bit shorter and steeper. This gender split is of course not honored these days and there were a lot of trail runners of all genders passing me on the path. After the steep climb the renovated temple looked really nice and waiting for the goshuin gave me some time to catch my breath.\n\nThing is, the temple is only in like 1/3 or 2/5 of the climb to the top of the mountain. To continue you should get a charm to purify yourself and regard the climb as sacred. It starts with super steep staircase and continues with narrow roads of gravel or random stones until the top. The road was quite crowded in both ways, but I caught on a Japanese couple, where the man was carrying a baby in a backpack chair and they just had the perfect steady tempo that I was able to follow without stopping and we passed many many hikers on the way, which made me quite proud. Another cool encounter during the climb was a Death Stranding irl guy, a porter carrying 70kgs (we asked) of cargo to the hut on the mountain peak. Crazy performance.\n\nThe top was very crowded, with almost no place to sit and the rain mountain was true to its name as the top was in a light cloud. So the view which should have contained all of Tokyo area, Enoshima island, and on the other side Mt. Fuji was all covered in mist. So I started my descent quite soon. Again about the first third of it was just a long queue of people, but after one intersection, where I chose a path leading to a different valley than I started from, I found myself completely alone on the path. If we don't count the real life pokémons! I encountered a small black lizard with a bright azure tail, a big red/yellow snake, a bright Black/blue bird, a couple of other birds, absolutely huge dragonflies near the bottom of the descent.\n\nThe valley I descended into used to be a big recreational place from the looks of it. But absolute majority of the places were now either completely abandoned, or at least very worn down by the time. Still quite a few families were catching fish in the river, having some barbecues, chilling around. There were also some important sites along the way, a big temple with multistory pagoda that was used as a shelter for criminals who were running from the law. They only refused entry to murderers and arsonists. A supposed burial site of an ancient prince who survived some massacre and lived the rest of his life as hermit (7th century). A botanical path believed to be taken by the imperial family as soon as 18th century or so for its variety of wild flowers. Which was supposed to be upkept by the local community ever since, but like a third of it was a river instead which gave me a very hard time traversing the path. The flowers were pretty and I saw a crane taking flight from a rice field, so all good. And there were also some more hermit cave shrines and a temple, which I did not have the motivation and energy to visit. So instead I got a local handmade strawberry ice cream from soy milk while waiting for a bus heading back home.\n\nOn the way home I also found a Star Wars pop up shop under the Shinjuku station, where I needed to really hold myself to not spend a lot of money.", "highlight": false, "tier": "A", "sort_order": 23, "points": [{"latitude": 35.44185454878669, "longitude": 139.2311456523066, "marker_label": "Oyama yama", "marker_order": 1}], "mediaItems": []}, {"id": "E024", "name": "Recharge battery weekend", "date": "20/06/2026", "date_ts": 20624, "category": "Museum", "abstract": "Relaxing weekend filled with visit of Tokyo museum of Nature and Science, where a lot of dinosaurs were", "media": "https://drive.google.com/drive/folders/1MjxhH-XbcoUYGDNSzb0Tc-9w-PfqKUn4?usp=drive_link", "memo": "On this weekend I needed a bit of relax as my batteries were drained. So to keep my promise to visit a new place or try a new thing every week while I'm in Japan, I took off to go see the Nature and Science museum of Tokyo. The museum is near the Ueno park with many other museums, so I could just walk over.\n\nThe museum has one older building where expositions related to just Japanese history are located. So there are rooms with comparison of human skeletons found on the Japanese islands from different times describing the differences between different epochs (especially before people from mainland China were able to build boats to come over). Also the differences between animals who were able to cross over in the deep ice ages and the ones that did not cross over from mainland Asia. \n\nVery interesting section was about the scientific instruments used for measuring various events, like seismographs, clocks, astronomical equipment, etc. Many of these things were brought over by the Europeans, but Japanese ppl just took the things apart and started making them better suited for Japan, or better overall. Prime example are the clocks, as Japan had a 13 section time system until the end of 19th century, where day and night had 6 sections each and the lengths differed across different seasons of course. So Japanese craftsman needed to figure out a way for the clocks to be usable in Japanese system too.\n\nIn the main, newer building, there were I think 6 floors in total and starting from the bottom, there were many interactive things for basic measurements of physical variables, a big section dedicated to short stories about the discoveries of Japanese Nobel prize recipients, but the most interesting floors were the ones with dinosaur skeletons. Because, the collection has e.g. one of the most complete plesiosaurus skeletons in the world, where more than 85% of all bones are from one specimen. Also plesiosaurus is not a dinosaur, as it is a different taxonomic group. In a different area they have the biggest sitting T Rex skeleton in the world. Which is a weird achievement in my eyes, surely if somebody with a bigger T Rex skeleton decided to build him up in a sitting position, Tokyo would lose this \"achievement\"... And many other skeletons. Also a kinda creepy huge room filled with taxidermy of many possible present animals. With some of the faces being maybe a little improved to be more cute? Weird room... \n\nOverall a very nice museum!", "highlight": false, "tier": "B", "sort_order": 24, "points": [{"latitude": 35.716514381569034, "longitude": 139.77636578336478, "marker_label": "National museum of Nature and Science", "marker_order": 1}], "mediaItems": []}, {"id": "E025", "name": "Kawagoe - Edo period Saturday", "date": "27/06/2026", "date_ts": 20631, "category": "Town", "abstract": "Visit to Kawagoe, a part of Tokyo, that should give you an idea how life looked like in the Edo period", "media": "https://drive.google.com/drive/folders/1YRivQD9WtuQU6BiZJrFp4SHS0rSzF9ND?usp=drive_link", "memo": "I'm slowly running out of the very obvious 1 day trips from my Tokyo area for not great weather. I am sure there are many more places to see in Tokyo itself, but I like to go out a bit too. So this week I found out about Kawagoe - a district of outer Tokyo where a visitor may feel like back in Edo period.\n\nMy first stop was the Kita-in Temple. This temple is quite important because in the times of shogunate (around 1600s), there was a very prominent monk living here. This monk was famous for his knowledge of both spiritual and earthly topics and the shogun of that time enjoyed their conversation so much that he asked for the monk's advice often. This relationship led to the Shogun entrusting the upbringing of his son to this monk and decided to give him a large land around the temple and a piece of his palace in Edo. Like literally, the shogun ordered several rooms from his Edo palace to be dismantled and brought to the Kita-In temple to construct it there again. \n\nIn these rooms a very prominent woman who also gave birth to the next Shogun in line lived and also gave birth there. So you can visit these rooms, but cannot take pictures of anything inside, just the garden, as it is considered \"holy\" due to the Shogun's birth there.\n\nThe whole visit was a little eerie as apart from me, maybe like 4 other tourists were inside the area. So I could really take in the experience. There were some items to see, some very nice painted doors and ceilings, a statue of the monk, and a collection of paintings of craftsmen of Edo period. \nOutside in the Kita-In area, there's also a garden of 500 buddhas. A little Area with 538 different Buddha statues, where each buddha is unique in his posture, items, and facial expressions. Some of them were quite funny and with the moss coverage it looked ancient. But realistically, the buddhas were sculpted in at the end of 18th century, so not as old as it might seem.\n\nThen I went over to Honmaru palace, which is one of the few original surviving Edo period palaces in Eastern Japan. Again, for a small fee you can go inside and this time you can even make photos. So I had a chance to see how could the Edo period nobles spend their time. Apparently, the particular nobleman who built the Honmaru palace wasn't super important, but the importance is enhanced by the palace to survive to this day. Again, there were several interesting items to see and a nice garden to enjoy. \n\nLastly, I've made my way to a street called Shotengai, which should be a street, where time stopped and you can feel like walking back in time to Edo period. That is, if you can ignore all the cars, buses and tourists flowing both ways. Nevertheless, some of the buildings are really pretty wooden villas, with shops of various crafts or restaurants inside. The Kawagoe was also known for it's production of sweets, which in one time at the end of 19th century made up more than 90% of Tokyo's sweets consumption. And their specialty was various sweets from Sweet potato. So I bought a Ikinari Dango, a steamed dumpling with a thick slice of sweet potato topped with red bean paste inside, and sweet potato chips with different types of butter. Both were tasty, less sweet than you would expect from a \"Sweet\".\n\nI ended up eating ramen at the local Ichiran. Ichiran should be the best ramen shop in Japan, but I am not convinced. Yes, it is very easy to really customize your ramen there, the noodles are super thin and the broth is nice, but for the same price, you can get much better ramen at almost any local proper restaurant, where you just buy a meal ticket and hope for the best.", "highl

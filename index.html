<head>

<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: "News Cycle", sans-serif;
        color: #202a35;
    }

    .folium-map {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 66.666vw !important;
        height: 100vh !important;
        transition: width 0.3s ease;
        z-index: 1;
    }

    #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 33.333vw;
        height: 100vh;
        box-sizing: border-box;
        overflow-y: auto;
        padding: 24px;
        background-color: #fbfaf7;
        background-image: radial-gradient(
            circle,
            rgba(20, 91, 115, 0.07) 1px,
            transparent 1px
        );
        background-size: 18px 18px;
        border-left: 1px solid #d7dee6;
        z-index: 1000;
        transition: width 0.3s ease;
    }

    body.expanded .folium-map {
        width: 33.333vw !important;
    }

    body.expanded #sidebar {
        width: 66.666vw;
    }

    h1 {
        margin: 0 0 12px;
        font-size: 25px;
        line-height: 1.2;
    }

    h2 {
        margin: 24px 0 10px;
        font-size: 18px;
    }

    .intro, .placeholder, .entry-button small,
    .media-section p {
        color: #526171;
        line-height: 1.5;
    }

    .entry-list {
        display: grid;
        gap: 15px;
    }

    .entry-button {
        display: block;
        width: 100%;
        padding: 10px;
        text-align: left;
        border: 1px solid #d7dee6;
        border-radius: 8px;
        background: var(--category-bg, #f3f4f6);
        cursor: pointer;
    }

    .entry-button:hover {
        filter: brightness(0.96);
        border-color: #145b73;
    }

    .entry-button strong,
    .entry-button span,
    .entry-button small {
        margin-top: 5px;
        display: block;
    }

    .entry-button span {
        margin-top: 4px;
        font-size: 13px;
        color: #526171;
    }

    .entry-button small {
        margin-top: 6px;
        font-size: 13px;
    }

    #back-button {
        margin-bottom: 20px;
        padding: 8px 12px;
        cursor: pointer;
    }

    .detail-date {
        color: #526171;
    }

    .detail-abstract {
        font-size: 18px;
        line-height: 1.5;
    }

    .memo-section,
    .media-section {
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid #e1e6e9;
        border-radius: 10px;
        padding: 16px;
    }

    #detail-memo {
        white-space: pre-wrap;
        line-height: 1.6;
    }

    #media-link {
        display: inline-block;
        margin: 6px 0 20px;
        color: #145b73;
        font-weight: bold;
    }

    @media (max-width: 800px) {
        .folium-map,
        body.expanded .folium-map {
            width: 50vw !important;
        }

        #sidebar,
        body.expanded #sidebar {
            width: 50vw;
            padding: 16px;
        }
    }
    .tier-group {
        margin: 12px 0 18px;
    }

    .tier-heading {
        margin: 0 0 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #eef2f5;
        font-size: 15px;
    }
    .category-label {
        display: block;
        margin: 18px 0 6px;
        font-weight: bold;
    }

    #category-filter {
        width: 100%;
        padding: 10px;
        border: 1px solid #d7dee6;
        border-radius: 6px;
        background: #fff;
        font: inherit;
    }

    .sidebar-section {
        margin-top: 30px;
        border-top: 1px solid #d7dee6;
        padding-top: 15px;
    }

    .sidebar-section > summary,
    .tier-group > summary {
        cursor: pointer;
        font-weight: bold;
        font-size: 18px;
        padding: 6px 0;
    }

    .sidebar-section > summary {
        font-size: 18px;
    }

    .tier-group {
        margin: 8px 0;
    }

    .tier-group > .entry-list {
        margin: 6px 0 12px;
    }

    .placeholder {
        color: #526171;
    }
    h1, h2, h3,
    .sidebar-section > summary,
    .tier-group > summary {
        font-family: "News Cycle", sans-serif;
        font-weight: 700;
    }
    /* More space between the category selector and Journal entries */
    #category-filter {
        margin-bottom: 14px;
    }

    /* More space between section headings and the cards below them */
    .sidebar-section > summary {
        margin-bottom: 12px;
    }

    /* Keep space between Journal entries heading and its cards */
    #category-entries {
        margin-top: 12px;
    }
    .entry-button.highlight-card {
        border: 3px solid #ff1f1f;
    }
    .leaflet-marker-icon.highlight-marker {
        filter:
            drop-shadow(0 0 2px #ff1f1f)
            drop-shadow(0 0 3px #ff1f1f) !important;
    }
    #back-button,
    .expand-entry {
        appearance: none;
        border: 1px solid #145b73;
        border-radius: 8px;
        background: #145b73;
        color: #fff;
        padding: 9px 14px;
        font: inherit;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
        transition: background-color 0.15s ease,
                    border-color 0.15s ease,
                    transform 0.15s ease;
    }

    #back-button:hover,
    .expand-entry:hover {
        background: #0e4659;
        border-color: #0e4659;
    }

    #back-button:active,
    .expand-entry:active {
        transform: translateY(1px);
    }

    #back-button:focus-visible,
    .expand-entry:focus-visible {
        outline: 3px solid #8ecad8;
        outline-offset: 2px;
    }
    }
    .leaflet-popup-content {
        margin: 0 !important;
    }

    .leaflet-popup-content-wrapper {
        padding: 0;
        overflow: hidden;
    }

    .journal-popup {
        width: 250px;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 8px;
        color: #202a35;
        background-color: var(--popup-bg, #f3f4f6);
        background-image: radial-gradient(
            circle,
            rgba(20, 91, 115, 0.07) 1px,
            transparent 1px
        );
        background-size: 16px 16px;
    }
    .media-viewer {
        display: grid;
        grid-template-columns: 42px minmax(0, 1fr) 42px;
        align-items: center;
        gap: 10px;
    }

    .media-stage {
        height: min(42vh, 460px);
        min-height: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        border: 1px solid #d7dee6;
        border-radius: 10px;
        background: #eef2f5;
        touch-action: pan-y;
    }

    .media-content {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #202a35;
    }

    .media-placeholder {
        padding: 24px;
        color: #526171;
        text-align: center;
    }

    .media-arrow {
        width: 40px;
        height: 40px;
        border: 1px solid #d7dee6;
        border-radius: 50%;
        background: #fff;
        color: #145b73;
        font: inherit;
        font-size: 20px;
        cursor: pointer;
    }

    .media-arrow:hover:not(:disabled) {
        background: #eef6f8;
    }

    .media-arrow:disabled {
        opacity: 0.4;
        cursor: default;
    }

    .media-caption-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin: 8px 2px;
        color: #526171;
        font-size: 14px;
    }
    .media-frame {
        width: 100%;
        height: 100%;
        border: 0;
        background: #202a35;}
</style>

    (function () {
        const map = map_25f48a118c4e783bde6a6fdee2dcec96;
        const entries = [{"id": "E001", "name": "Travel and first exploration", "date": "01/04/2026", "category": "Town", "abstract": "The journey and first impressions", "media": "https://drive.google.com/drive/folders/1eSK81GvL0bTEKP4tbbplqcJ9hgdaX4bQ?usp=sharing", "memo": "I was lucky to catch a flight from Lux to Helsinky on an anniversary of Lux-Fin connections - free Cinnamon rolls at the airport, free champagne in the plane \n\nThe long flight was quite uncomfortable, the economy seat was fine, but 13:30 h is a lot in full plane...\n\nArrival process took more than an hour, I got some panic throughout the process, but in the end getting a Suica card and getting to Hongo campus was quite smooth.\n\nHongo campus is really nice - almost european looking old buildings, park in the middle with a very nice lake and Japanese stories vibes at night", "highlight": false, "tier": "B", "sort_order": 1, "points": [{"latitude": 49.629157, "longitude": 6.212543, "marker_label": "Lux airport", "marker_order": 1}, {"latitude": 60.318464, "longitude": 24.968599, "marker_label": "Hel airport", "marker_order": 2}, {"latitude": 35.549912, "longitude": 139.778787, "marker_label": "Haneda airport", "marker_order": 3}, {"latitude": 35.711381, "longitude": 139.763187, "marker_label": "Hongo campus", "marker_order": 4}], "mediaItems": []}, {"id": "E002", "name": "Tokyo Dome and Ueno park", "date": "03/04/2026", "category": "Town", "abstract": "A stroll around Tokyo Dome and Ueno park to hunt some blooming sakura trees", "media": "https://drive.google.com/drive/folders/1OUUdvOopRZXDmT_eBocGxd7yBQD0MYYG?usp=sharing", "memo": "After unsuccessful registration attempt at the municipality, a walk through the streets of Tokyo and around Tokyo Dome. Didn't want to pay for a small garden entry as I had no cash at the time.\n\nUeno park is one of the spots for sakura trees, so the path was packed with ppl trying to get the best photo. The temple looks nice, but didn't spend too much time around as my main quest was to get sushi.\n\nSushiro is the franchise to go for to get fast sushi, I was told... But waiting to get a table took like 15-20 minutes... But man, it was worth it, everything (except crab paste) was super yummy!", "highlight": false, "tier": "B", "sort_order": 2, "points": [{"latitude": 35.706336, "longitude": 139.751763, "marker_label": "Tokyo Dome", "marker_order": 1}, {"latitude": 35.715348, "longitude": 139.773259, "marker_label": "Ueno park", "marker_order": 2}], "mediaItems": []}, {"id": "E003", "name": "First full energy day", "date": "04/04/2026", "category": "Museum", "abstract": "Dedicated sakura garden visit and Tokyo National museum visit", "media": "https://drive.google.com/drive/folders/1dlj7ZAytT_gZ76DI-eYt9DjFJ8Lo8BMw?usp=sharing", "memo": "The sakura season is on, so let's go see the Sakuras in some nice garden. My weather app is telling me Sunday will be horrible, so let's do it on Saturday! \n\nSo I went, Shinjuku gardens should have like gazzilion different types of Sakuras, so it seemed like a good place. In the end, the most beautiful part was the Japanese garden. For some parts it was too soon to be pretty, as the plants and trees were only waking up from the winter. After like the first 30 minutes it started raining...\n\nAkihabara is very famous anime spot, which is not something I am really into... So I didn't put much attention to it. During the day it probably doesn't feel like it should...\n\nBut oh boy the Curry place... Tiny, maybe 15 spots max, like 2 spots left, I got a beef curry and it was great! But no option to select your spice level, and the default was like 9/10 of my spice tolerance... I'll need to come back some day to try again!\n\nStill the whole afternoon to spend, so with the bad weather I went to the national museum of Tokyo. Consisting of like 4 buildings, it's a big place to explore. One exposition was about old wooden masks and the festivals they were used for, then general Japanese crafts and items from start of civilisation until like 1800s.\n\nOne building was for East Asia expedition of some Japanese explorer/archeologist who wanted to find the origins of the imported buddhism, so items from China/India/even Iran/Egypt were displayed.\n\nNice addition was a \"fortune telling\" section where goat/sheep bones dices gave me good fortune! And a super nice gift shop, where I will need to go back some day.", "highlight": true, "tier": "A", "sort_order": 3, "points": [{"latitude": 35.685768, "longitude": 139.71018, "marker_label": "Shinjuku Goyen Garden", "marker_order": 1}, {"latitude": 35.699957, "longitude": 139.771384, "marker_label": "Akihabara", "marker_order": 2}], "mediaItems": []}, {"id": "E004", "name": "First bouldering sunday", "date": "05/04/2026", "category": "Town", "abstract": "Start of my bouldering journey and hidden gem shrine", "media": "https://drive.google.com/drive/folders/1oBDGQsBHW-gd_mqnfUjj2PJ4iE2adjbC?usp=sharing", "memo": "Boulderiiiing! Yeah, chose the most european style looking place, where there are 4 floors of boulders of all levels. However the legends were true... Japanese grading system and climbers are on different level. From my V3-V4 in Lux I struggle to do at least some V2-V3s... In french grading the best I did was 5+, but it also shows that my level should be 6B in Lux, which I'm not sure about...\n\nThen I visited Matsuya for the first time and it was great! The food is yummy, the chopsticks are the right thickness, ordering screens are there, so perfect for me.\n\nIn the afternoon a small walk from campus away there is the Nezu shrine, which is super gorgeous. Just walking around and smiling and trying to not offend any deities.", "highlight": false, "tier": "B", "sort_order": 4, "points": [{"latitude": 35.700241, "longitude": 139.767988, "marker_label": "BPump Akihabara", "marker_order": 1}, {"latitude": 35.720624, "longitude": 139.760898, "marker_label": "Nezu Shrine", "marker_order": 2}], "mediaItems": []}, {"id": "E005", "name": "Nikkou with colleagues", "date": "11/04/2026", "category": "Town", "abstract": "Visit of Nikkou with colleagues. Place where first Shoguns are buried and enshrined, the most decorated buildings in Japan", "media": "https://drive.google.com/drive/folders/1Q5XbigLOzAoGrpqzzJlawsRl8JAiq_2b?usp=drive_link", "memo": "Sugita-san invited everyone to go to Nikkó as it should be beautiful this time of the year, so 7 students, Yuichiro with his wife, visiting professor from US and her son and me went to Nikkó. \n\nThe weather was super nice, the crowds were not big and both student girls and Hikaru were talking to me quite a lot, so that was super nice. The temples should be one of the most decorated temples in Japan as it is the final resting place of quite a few very important Shoguns. \n\nThere is the original no hear no see no speak monkey trio and also unique good luck catto above one gate. In the biggest temple, super amazing thing is a roaring dragon. There is a big painting of a dragon on the ceiling of the main room of the temple, and if you clap, or hit the praying sticks together under it's mouth, there's a very hearable echo \"the dragon roars\". If the sticks are hit together anywhere else in the room, there is no echo.\n\nIn another temple a little outside the main group, there is an original painting of a lion from 1600s, armor of the shogun who is buried there from when he was 15 with a fly head helmet (as it sees everywhere around), and very decorated ceiling with many little dragons with 2 varieties - going up to heaven with a wishing stone, and returning back already without wishing stone. \n\nOverall, the amount of lanterns and cute little things is super nice, the nature around with HUGE trees is great, but I hope to explore more with Kači and Walid next weekend.\n\nOn the way back we stopped near the Kita-Senju train station, where we found the MOST Japanese looking street I've seen so far. It really seems like that's the real place where young japanese ppl go out. We ended up in a taiwanese bar, where there was a little bit of karaoke and we had some drinks with Sugita-san and couple of the other students.", "highlight": false, "tier": "A", "sort_order": 5, "points": [{"latitude": 36.761784, "longitude": 139.599226, "marker_label": "Nikko area", "marker_order": 1}, {"latitude": 35.749472, "longitude": 139.804176, "marker_label": "Kita-Senju bar street", "marker_order": 2}], "mediaItems": []}, {"id": "E006", "name": "Seafront sunday", "date": "12/04/2026", "category": "Town", "abstract": "Seafront exploration with aquarium visit and walk around Tokyo station", "media": "https://drive.google.com/drive/folders/18J3wOF-L0LHgMCgv0Ed4_uO2VHm7cV-D?usp=drive_link", "memo": "I really wanted to see the sea, smell the salty air, so I asked Hikaru for suggestions and he suggested this park. It is apparently a very popular place for families and young lovera, because so many japanese children I've never seen in my life before. And a LOT of young couples on a date there.\n\nIt is also a bird watching place, so there were a lot of bird watching huts and old japanese ppl with huge cameras. It was nice to walk around and at least hear the different birds eventhough I haven't seen many of them. The beach area has a big BBQ place, where ppl were bringing tents and camping stuff to do their own BBQ party. \n\nAdditionally there is an aquarium with apparently one of the biggest tuna fishes in captivity. And boy they were HUGE. A lot of different displays of different kinds of sealife including hammerhead sharks and penguins. I bought a little sea pancake plushie and a little magnetic tuna. \n\nOn the way back I walked around the Tokyo main station area and the amount of ppl and the size of the place is scary. Will need to explore it better so I know where to go when the shinkansen time comes. On the way back home I stopped in random Izakaya, which was looking modern with tablet ordering system and got chicken skewer menu, which was nice.", "highlight": false, "tier": "B", "sort_order": 6, "points": [{"latitude": 35.642786, "longitude": 139.86002, "marker_label": "Kasai Rinkai park", "marker_order": 1}], "mediaItems": []}, {"id": "E007", "name": "TeamLab Planets with Kaci and Walid", "date": "17/04/2026", "category": "Museum", "abstract": "One of the most instagram friendly places visit with Kaci and Walid", "media": "https://drive.google.com/drive/folders/1arWdO23jSEYXa0hO5z5yYFvuCs64IMuf?usp=drive_link", "memo": "Kači and Walid arrived for a weekend in Tokyo and I joined their plans for Friday evening. First of all we met to get some food and we found a place with really good Ramen with beef. The owner spoke enough English to accommodate us and the gyoza were excellent!\n\nAfterwards we made our way to TeamLab Planets, which is the most instagram friendly place built to be instagram friendly place I've been to. Big lines of tourists from different areas around there. The experience inside was really good looking, but bizarre in many ways. In the Water part, the first corridor was to be walked barefoot uphill in a stream of water probably just to clean everyone's feet before the next parts... An employee whose only job was to hand little towel to everyone to dry their feet might have one of the worst jobs out there.\n\nThen a various combination of either sensory or aestheticly pleasing rooms followed with big lines towards anything notable.\n\nI'm not sure I would go there on my own, but with Kači and Walid it was a nice experience.", "highlight": false, "tier": "B", "sort_order": 7, "points": [{"latitude": 35.649608, "longitude": 139.790289, "marker_label": "TeamLab Planets", "marker_order": 1}], "mediaItems": []}, {"id": "E008", "name": "Kaci and Walid weekend", "date": "18/04/2026", "category": "Town", "abstract": "Weekend of timing blunders and substitute programs including meeting not only Kaci and Walid, but also Vaness and Honza", "media": "https://drive.google.com/drive/folders/1Vsk8fl2zpYmb_LFJzE_E1lDipoQ6CioB?usp=drive_link", "memo": "A weekend full of timing blunders (meeting up on Saturday, train miss on Sunday) still brought a lot to be remembered. \n\nOn Saturday we went through the fish market at Tsukiji, where we (mostly I) were overwhelmed with the amount of tourists and little shops selling all kinds of foods and goods. We tasted some local tuna sashimi, wagyu yakitori, fish cake corn dog, some mitarashi dango (sweet soy bean balls dipped in sweet soy sauce), some other sashimi kinds... Don't know if it was to appeal more to the tourists or if it's the default, but the amount of yelling vendors and customer hunters was too much for me.\n\nThen we moved to the Tsukishima street area, where we were able to find a teppanyaki restaurant called Kondō, where we had the luck of being served by the most kind girl yet. The food making is on you, as you'll get just a bowl of stuff and there's a hot plate in front of you. We were assisted by the kind girl to make 3 different kinds of foods, all very tasty. The worst choice of that place was a tomato beer... Which tasted just like when you wash your pasta sauce can with water and drink it. The restaurant is not to blame, I would not expect it to taste otherwise. To add to the cuteness, the girl ran out to wish us a nice day when we were leaving and we met a very old man with a very old and Věry big turtle with a little hat.\n\nIn the afternoon I met with Vaness and Honza and they very much matched my feelings about Japan so far, so we chilled in the Shinjuku Gyoen Gardens together and then went towards the tourist Area of Shinjuku with all the shops and bars and... Ppl...\n\nThe amount of ppl was just overwhelming but we were approached by a Young Japanese man who wants to improve his english and I might meet up with him one of these days. In the end we made our way to the Metropolitan Goverment building, where there was a video show projected on the building façade with Godzilla and Pokemon. Great time there!\n\nOn Sunday we ended up just meeting for sushiro with Kači and Walid after missing our train to Nikkó. Instead I finally bought a notebook for eki stamps and started collecting them! As well as dedicated Goshuin notebook to collect them.", "highlight": false, "tier": "C", "sort_order": 8, "points": [{"latitude": 35.665258, "longitude": 139.770423, "marker_label": "Tsukiji market", "marker_order": 1}, {"latitude": 35.690247, "longitude": 139.691429, "marker_label": "Tokyo Metropolitan Government building", "marker_order": 2}, {"latitude": 35.691005, "longitude": 139.704887, "marker_label": "Shinjuku", "marker_order": 3}], "mediaItems": []}, {"id": "E009", "name": "Nikko with Wendy and Luci", "date": "27/04/2026", "category": "Town", "abstract": "Wendy and Luci arrived to Japan and we went to see Nikko and the nature above it", "media": "https://drive.google.com/drive/folders/1TSK-U7WevoCU8ZprRvRUJ830jjcoeoFC?usp=drive_link", "memo": "The quest was clear - see the rest of what the Nikkó area has to offer. Mainly the nature above the city itself. After (this time) successfully boarding the train to Nikkó and getting there, we boarded a bus heading up to the Chuzenji lake. \n\nAfter a 45 minute bus ride which consisted of an intense 10+ hairpin climb we got to see the lake. It is a very nice lake. With the mountains around, it creates a very nice piece of nature. We chose to walk to the British and Italian embassy villas a bit further along the lake coast. Well, those guys can pick a nice place to build an embassy villa. The area is also very popular for fishermen as we met and saw a lot of them. \n\nAfter heading back to the bus path, we went to check the Kegon waterfalls, which were a bit underwhelming, but it just might be because of the sunny period. So we made our way back to the temples. We got off the bus a bit earlier than needed which allowed us to explore a little hidden shrine and a christian church closeby. \n\nThen the temple visit, where I got 3 separate Goshuin. One of them was made by an old lady on the spot, which is absolutely impressive. The calligraphy part takes her like 30 seconds and all movements and strokes are perfect. With enough time to spare we made our way slowly to the train station to get back. \n\nBut it wouldn't be a trip to Nikkó without a fuckup... So because of me misreading the info emails, we missed our intended train by 10 minutes... Needed to wait an hour for the next. To end the day we went to the super japanese street near Kita-senju station in Tokyo, where we ended up in Hidakaya to get some ramen. The girls accidently ordered breakfast cold ramen which really wasn't good... I ordered some other one which was at least hot, but not really good... So the day ended on a bit sour note. And this might have been the first unpleasant food place experience in Japan", "highlight": false, "tier": "A", "sort_order": 9, "points": [{"latitude": 36.739526, "longitude": 139.501831, "marker_label": "Nikko nature", "marker_order": 1}], "mediaItems": []}, {"id": "E010", "name": "Hiroshima and Itsukushima visit", "date": "29/04/2026", "category": "Town", "abstract": "The start of week with Wendy and Luci, first proper stop in Hiroshima and on Itsukushima island - the floating Torii gate shrine, and evening visit of Fushimi Inari Taisha", "media": "https://drive.google.com/drive/folders/1Lxu0xW7gyccTQITJX7AmshUWztwcPpWf?usp=drive_link", "memo": "After arriving to Kyoto to meet the girls, the next day we boarded another shinkansen in the morning to get to Hiroshima. The first thing on the list there was the floating temple at the Itsukushima island.\n\nYou need to get there by a small traject, which was fun with how excited were the Japanese kids about it. The whole island feels like it should be worth a full day trip. By visiting the floating gate and walking around the town near there we did not have time to properly explore the whole island, but the pieces we've seen were very nice. In addition to all the sights, there were some more or less polite deers just hanging around the place.\n\nOn the way back to the trajects I got at least grilled scallops, which were really good. Like way better than I expected, because they almost fell apart in the mouth as opposed to the slimy chewy form I expected. The hardcore seafood taste came only after a while, but did not spoil the experience.\n\nAfter leaving Itsukushima, we made our way to the middle of Hiroshima to see the famous atom dome. The story is as shivering as ever. Even just reading the info near the dome you can't help but feel some shame, because of the heritage. It is a beautiful place in its own way and I am not surprised they are trying to keep it there in the current state. Near there, there's also a tall building, where anybody can go to one of the top floors and do a origami crane and add it to the thousands and thousands others that are in a huge glass compartment spanning most of the floors. \n\nThen we wanted to get food at a famous ramen fastfood, but after waiting 20 minutes for our numbers to get called, we were allowed to go in, but asked to wait in another approx 20 minute line to order. Which was too much for us, so we left for another place. I got big pork schnitzel plate, which I was happy with, but girls were not happy with their chicken ones. We were not really lucky for the food places with the girls...\n\nAfter the food we went to the Hiroshima castle, which looks really nice, has some option to look inside the outer wall structures for free. A lot of koi carps in the moat. On the way back to the station we even met the peace origami crane monument. With still some time left, we could also explore several shrines near the train station out of which some were really nice and calming.\n\nAfter returning from Hiroshima, there was still one place to go to. The Fushimi Inari Taisha temple. It is famous for its seemingly neverending lines of red shrine gates. Apparently during the evening, some parts are even nicer as they are illuminated by lanterns. So we went to check it out.\n\nTo walk through the endless gates is really a nice experience. In the darkness it made me feel even more calm than it would in the day. By no small part thanks to the reduced number of people at that time. My phone camera is not good enough to really capture how pretty some of the parts are. \n\nThis place is definitely worth another visit as the temple site continues all the way to the top of the hill it's at. But as we had so much plans that day, we did not want to climb all the way to the top. I am quite curious if there's some nice view of Kyoto from the top.", "highlight": true, "tier": "S", "sort_order": 10, "points": [{"latitude": 34.275049, "longitude": 132.305763, "marker_label": "Itsukushima", "marker_order": 1}, {"latitude": 34.396334, "longitude": 132.453881, "marker_label": "Hiroshima Atomic Bomb Dome", "marker_order": 2}, {"latitude": 34.968186, "longitude": 135.779445, "marker_label": "Fushimi Inari Taisha", "marker_order": 3}], "mediaItems": []}, {"id": "E011", "name": "First full Kyoto day", "date": "30/04/2026", "category": "Town", "abstract": "Full Kyoto day of not good weather filled with bamboo, gold villa, and famous neighborhoods exploration", "media": "https://drive.google.com/drive/folders/1VsIoCmxZA__ENjIVJlIYMJAc4xwSgKie?usp=drive_link", "memo": "The first full day in Kyoto was dedicated to visiting the Bamboo forest area and surroundings in the North of Kyoto. The weather wasn't the best, but the big bamboos were quite cool. Of course, as it is one of the main tourist attractions, there were a lot of tourists completely blocking the pathways to try to take a cute photo.\n\nWe also entered one nice shrine with beautiful moss covered gardens and a lot of little stone statues. That was a really beautiful place called Hondo shrine. Later we made our way to Kinkaku-ji the temple with the famous golden pavillon. Again, flooded by tourists we tried to enjoy the stroll around. \n\nThen we tried to make our way back to the city with lunch on the way. Our first option was closed, but we went to a random ramen place where an old couple was serving a very simple ramen, which was extremely good. I took it with some kimchi and that was probably the best kimchi I've ever had. After the trip, the girls ranked this ramen as the best one they had in Japan.\n\nAfter we got back to the city, we made our way to the Kyoto's version of king's road in Prague - the area around Shimokawaracho, where many many little shops on a road connecting several ancient landmarks are. Overloaded by tourists again as expected, we just walked through trying not to fall on the slippery stones.\n\nAfter it got dark I went to visit one shrine, I believe it was the Yasaka shrine. The girls were tired so they went away and I was walking around Gion and also met with Vaness and Honza who were in the middle of their month in Japan. That was a refreshing meeting, we found also a nice water canal area in Gion and talked for a while.", "highlight": false, "tier": "A", "sort_order": 11, "points": [{"latitude": 35.017873, "longitude": 135.671087, "marker_label": "Arashiyama Bamboo forest", "marker_order": 1}, {"latitude": 35.039861, "longitude": 135.729372, "marker_label": "Kinkaku-ji", "marker_order": 2}, {"latitude": 35.000169, "longitude": 135.779504, "marker_label": "Ishibe Koji road", "marker_order": 3}, {"latitude": 35.005611, "longitude": 135.773645, "marker_label": "Gion shirakawa canal", "marker_order": 4}], "mediaItems": []}, {"id": "E012", "name": "Second full Kyoto day", "date": "01/05/2026", "category": "Town", "abstract": "TeamLab Kyoto visit, Imperial castle visit, lucky streetfood find, and mini izakaya visit with a lot of sake and cute grandpa owner", "media": "https://drive.google.com/drive/folders/1H45bmWBRaOUoi6KR7TYOA--D0dSyzV9b?usp=drive_link", "memo": "The second day in Kyoto started with the visit of TeamLab Kyoto. This branch of TeamLab is apparently the biggest in Japan and has some genuinely interesting displays. I had the most fun in the foam, which was impossible to make a good photo of, but it was really fun. Otherwise about a third of the displays is shared with Tokyo's TeamLab and if the ppl want to spend some time on different things it's quite hard to find yourself again.\n\nFor lunch we went to a place with multiple restaurants, where I chose a very underwhelming chop suey rice. But afterwards we went to visit the Kyoto imperial palace which is a nice Area. We met some group of dressed up locals doing a group photo and inside the palace area, apart from some indoor decorations visible for tourists, the most beautiful place was the garden of the palace.\n\nAfterwards we went for a nearby museum, where I spent more time than the girls so I also chose to go near the Heian-Jingu Shrine to see if it's opened. It wasn't, but there were some stands with food and I got some round gyoza which were probably the best gyoza I had in my life so far. \n\nIn the evening we went to an izakaya near our hotel, where we enjoyed some snackish food (I got a platter of fried stuff - starting with sweet potato, ending with shrimp, and including some sausage, meat, etc.) and also saké. We asked for both hot and cold one with Wendy, and were surprised to get like 0.3-0.4 liter jug for the cold one and like 0.2-0.3 liter vase for the hot one. The hot one is cheaper not because of the amount, but because the hot temperature hides its inferior quality. The cold one tasted quite similar to a kind of Slivovica, but the fruity tones were a bit hidden so the last cup was already a struggle.", "highlight": false, "tier": "B", "sort_order": 12, "points": [{"latitude": 34.984454, "longitude": 135.765023, "marker_label": "TeamLab Biovortex Kyoto", "marker_order": 1}, {"latitude": 35.024519, "longitude": 135.76253, "marker_label": "Kyoto Imperial Palace", "marker_order": 2}, {"latitude": 35.009368, "longitude": 135.762471, "marker_label": "Museum of Kyoto", "marker_order": 3}, {"latitude": 35.016333, "longitude": 135.782641, "marker_label": "Heian Jingu shrine", "marker_order": 4}], "mediaItems": []}, {"id": "E013", "name": "Nara visit and Osaka evening", "date": "02/05/2026", "category": "Town", "abstract": "Travelling from Kyoto to Osaka via Nara, where we met the bowing deer and visited some shrines", "media": "https://drive.google.com/drive/folders/1lUtoNbA79LWdNSYmrxrp1JxK2XjGYAto?usp=drive_link", "memo": "We figured out that it might be easier to get Nara trip during the transition between Kyoto and Ósaka as it is about the same distance from both the cities and we didn't have any other plans for the day. \n\nSo, initially, Nara was famous because of the shrines and forests around. The very well behaved deer became and attraction only way later in the history of Nara. Nowadays a big number of tourists come to Nara just for the deers, which is understandable, but also a bit sad. Especially as the deers are overloaded with the interactions and can become a bit aggressive. As was illustrated by one of the very first deers we met. We approached slowly and this guy just went straight for my plain white T-shirt and munched on it. After we flicked him, he just munched on the T-shirt more, so it took quite a tug and several flicks to the nose for him to let go and save my apparel.\n\nWe were just walking around trying to enjoy the less aggressive deer interactions, the forest, and smaller and bigger shrines around the area. In the end we walked up to what I believe is the Kasuga shrine. Inside the shrine there are many lantern ways and the dominant is a 1000 year old cedar tree, which looks gorgeous. On the way back to the station we saw also the big Todai-ji complex, where some building were quite impressive.\n\nAfter getting to Ósaka and to the place we stayed there, we were quite surprised of the worn-down look of the surroundings. Basically our hotel was at the edge of one of market streets that became roofed market streets closer to Dobutsen Mae and Ósaka tower. But our part was looking quite rough. A lot of small karaoke bars with older japanese men clientelle, lots and lots of closed shops, some very disturbing looking shops that were open.\n\nAnyways we found a gyoza/dumpling place near there that was quite nice. Aside from the dumplings I ordered also \"house speciality - knuckle licker chicken frames\" and what I got was a cold bowl of heavily marinated chicken parts from god knows which parts of chicken that was more bone than meat. The sauce was really good and my dumpling choice was also on point so I ended up being a little disturbed, but ultimately happy.\n\nThe area around the Ósaka tower is just all-year-long theme park. Many places where you can try to hit the target with various weapons to try to win some prize, even more places with crane games and lots of street food and lots of pachinko/casino places. Very overwhelming part of a town.\n\nTo take a rest from this we made our way to already closed Shitteno-ji Temple complex, where we found a lot of little stone Buddhas. And on the way back home I found the first Skyline GT-R in the wild.", "highlight": false, "tier": "A", "sort_order": 13, "points": [{"latitude": 34.685582, "longitude": 135.843646, "marker_label": "Nara park", "marker_order": 1}, {"latitude": 34.651774, "longitude": 135.506003, "marker_label": "Tsutenkaku", "marker_order": 2}], "mediaItems": []}, {"id": "E014", "name": "Osaka history day", "date": "03/05/2026", "category": "Museum", "abstract": "First full Osaka day where I split from the girls to visit big museums. In the evening we had the best food experience and eyebrow raising experience.", "media": "https://drive.google.com/drive/folders/11eql3g0ElvRz8x9TqPaNeZpZAbR0--2M?usp=drive_link", "memo": "A full day of Ósaka history. At least for me. The girls didn't want to spend the day, which was quite pretty, in museums, so we decided to split up for that day after reaching Ósaka castle together.\n\nÓsaka castle has one of the biggest moats in the world as it was the ultimate seat of military power of Japan until the end of the WW2. The castle grounds are now mostly parks and green areas. The castle itself is a huge building really showcasing why it became an emoji. The line to get inside was huge, so I did not join it and went to the war museum instead.\n\nThe war museum is a small museum dedicated to the reality of being bombed repeatedly and heavily during the climax of the WW2, as Ósaka castle area was the area with the biggest and the most significant ammo factories in Japan. The US army threw the biggest amount of bombs right here to Ósaka and the town population was reduced from around 6 million ppl pre-war to just 1 million after the war. Most of the ppl were evacuated or chose to go elsewhere of course, but thousands of ppl were killed during the air raids and several drawings and journal entries of the survivors were very graphic.\n\nThe Ósaka town museum was talking about the history of the town starting in 8th century, when the first Chinese-like castle was build there and gave the foundation for the style of buildings in the whole Japan. The expositions talked about how Ósaka was the seat of the Shogunate and by rice auctions the prices of all basic comodities were controlled by the rich right in the Ósaka port. The city layout did not change much since 10th century, except until the industrial revolution, when Ósaka became the \"Manchester of the East\". \n\nThe day ended with us going to get wagyu sukiyaki and it was the best meal of the trip. The kind lady owner was trying to take care of us so we could enjoy the meal as intended, the best photo of the trip was taken there (the cook with the huge chunk of wagyu beef), and overall we had a perfect experience there.\n\nAfter going out we saw some pretty lantern street on our left so we went there and suddenly found ourselves in an area, where each house had an open space where a young girl was sitting on a throne made of pillows, plushies, flowers and she was usually heavily glammed up and wearing anything from full size kimono to bikini. Next to the young girl there was usually an older woman in black who was using a round fan to cool the girl down and was looking out for customers. And also keeping her identity hidden against ppl who should not be there, as are other girls or children. So anytime they saw us, the face of the girl was immediately covered and we were quite loudly shooed away. For me the walk through there until we got back out of that area was very uncomfortable and I can't imagine going to such a place deliberately.", "highlight": false, "tier": "A", "sort_order": 14, "points": [{"latitude": 34.687821, "longitude": 135.525855, "marker_label": "Osaka castle", "marker_order": 1}, {"latitude": 34.683339, "longitude": 135.520533, "marker_label": "Osaka museum of history", "marker_order": 2}, {"latitude": 34.644053, "longitude": 135.503256, "marker_label": "Tobita Shinchi", "marker_order": 3}], "mediaItems": []}, {"id": "E015", "name": "Second Osaka day", "date": "04/05/2026", "category": "Town", "abstract": "Second full Osaka day, where the main event was visiting the Daruma origin shrine - Katsuo-ji temple", "media": "https://drive.google.com/drive/folders/16s5U0tu6bfx7CQSQ6PlN7CQI0zdSX24A?usp=drive_link", "memo": "On the second day in Ósaka we made our way to the Katsuo-ji Temple, which is famous mainly for it's Daruma icons. The little red figurines with various facial expressions. Those little guys have a fortune slip in their ass, which tells you one of the 64 yin-yang rune combinations that can then be alligned to the thing you were thinking about while choosing the little Daruma. The area of the Katsuo-ji Temple is also lovely and I enjoyed the area very much and the fortune slip I got sounds extremely applicable to my life.\n\nThen we made our way to downtown Ósaka to go look at the big new buildings and potentially try to find some more stamps. As the golden week holidays events were in full Force the amount of ppl around everywhere was becoming unbearable, so we were content with just seeing the buildings from below. On the way back to the hotel I wanted to go inside the Shitteno-ji temple, but arrived 15 minutes too late for both entrance and goshuin. At least we strolled through the antiques flea market and the girls bought some nice souvenirs there.\n\nIn the evening we went to get some ramen around the area of our hotel and our choice was good. It was the biggest portion of Ramen I had so far and with 1 big chicken egg and several small quail eggs, the food was plentiful. My body struggled with the sitting on the ground style of seats, but the food was great.", "highlight": false, "tier": "A", "sort_order": 15, "points": [{"latitude": 34.866479, "longitude": 135.491173, "marker_label": "Katsuo-ji temple", "marker_order": 1}, {"latitude": 34.70583644457979, "longitude": 135.4897156945344, "marker_label": "Umeda Sky building", "marker_order": 2}], "mediaItems": []}, {"id": "E016", "name": "Return to Tokyo", "date": "05/05/2026", "category": "Town", "abstract": "Journey back to Tokyo with an attempt to see nice things in Hakone and Odawara", "media": "https://drive.google.com/drive/folders/1wcpXhYQf2EZ5ILlLPdNM4XXI4BD1zH0o?usp=drive_link", "memo": "On the last day of our trip we just had to get from Ósaka to Tokyo. However we wanted to also see something pretty and do some part of the Hakone round. The plan was to get off in Odawara, get a bus to the lake Ashi, take a cable car up to the Owakudani active volcano and then get by train from Gora back to Odawara. In ideal case that would be like a 4 hour trip and we had 5.5 hours to spend.\n\nHowever when we wanted to board the bus, the lady told us that due to the Golden Week the traffic jams going to the lake Ashi may take up to 3 hours and sent us to take the train instead. So with a little bit of panic we got to the train towards Gora and googled if we can get to the volcano at least in the updated timeframe.\n\nWhen we got to Gora in the fully packed train, we were already very hungry and when we saw the line to the mountain train that should have taken us to the cablecar, we went for a food instead. The place was very accustomed to western ppl, but the curry I got was pretty nice. Then we climbed through the town to the cablecar station and when we saw the line it became obvious that if we wanted to go up to the volcano, we would have big trouble to catch our Shinkansen from Odawara later.\n\nThere should have been at least a viewpoint further along the road, but after a while the road was closed so the trip ended up being quite a fail. So we made our way back to Odawara, where we found ourselves witnessing the shrine carrying processions with some chants and songs and other stuff going on. That was a nice end to the week full of experiences.", "highlight": false, "tier": "B", "sort_order": 16, "points": [{"latitude": 35.252165208531345, "longitude": 139.1615607274733, "marker_label": "Odawara town", "marker_order": 1}, {"latitude": 35.24850709163191, "longitude": 139.03617261244707, "marker_label": "Gora village", "marker_order": 2}], "mediaItems": []}, {"id": "E017", "name": "First hike in Japan - Mitake yama", "date": "09/05/2026", "category": "Hike", "abstract": "The first Japanese hike to Mount Mitake and Mount Hinode through beautiful cedar trees forests", "media": "https://drive.google.com/drive/folders/1CtsErN6a7tNsj_-qAGhfcprJ7t3sOUFx?usp=drive_link", "memo": "What a glorious day. I asked Google Gemini to recommend a nice hiking area around Tokyo for me and it delivered one of the nicest days in Japan so far. The journey started with like 1:45 hour Journey to the west of Tokyo to area near Okutama. The journey was planned to take me up to mount Mitake to the Mitake shrine, then through an area called the Rock garden, and because I wanted to push myself a bit also to mount Hinode and then down to a valley to get back to Tokyo.\n\nThere was an option to go from the Mitake train station to the Mitake mountain summit by a combination of bus and a mountain train. I need to train so I went by foot. The climb was very tough. Along the trail the cedar trees were numbered so starting at number 660 from the bottom, I suspected the number 1 was somewhere near the top. What was nice was that along the trail several explanations were put to tell you about the history of the trail. A part about very sharp incline which was made easier by a very fast and sharp turns that some people started calling Rokuro after a ghost with a long neck that curves often.\n\nThe cedar tree 1 was still a few turns below the top, and the first nice view point was from the top station of the mountain train. However the top of the mountain was still some distance away. The Mitake shrine that's at the top is dedicated to wolves so ppl are taking their young puppies to be blessed there. That was one of the best rewards. To see all the puppies there. The views from the main shrine entrance were also very rewarding. \n\nAround that time I started feeling the pain from the hiking shoe vs my right outer ankle contact point which became a big problem towards the end, but did not stop me. \n\nI also visited a little museum with some samurai armor displayed along with some artworks and several katanas which was really nice. Then I made my way to the first waterfalls, where also a little shrine was. Very nice. Then along the river stream and a bit up to reach the stone that looks like a forest spirit's nose so they made 2 little statues of that spirit on the rock. Then down a rickety metal ladder/steps to reach the waterfall where local monks are meditating under. Then back up to by the stairs/ladders towards the Mitake shrine village.\n\nThen go towards mount Hinode, almost alone, except some super fitness japanese ppl running the trail and (of course) a group of like 8-10 german middle aged ppl on a spaziergang. When I reached the Hinode summit, I was rewarded with the nicest views of the day. The view of the Tokyo bay and surrounding hills was simply gorgeous. All that remained was a very painful way down to the bus that I couldn't really concentrate on the surroundings because of very careful stepping on my right foot.", "highlight": true, "tier": "S", "sort_order": 17, "points": [{"latitude": 35.785441, "longitude": 139.149159, "marker_label": "Mitake-san", "marker_order": 1}], "mediaItems": []}];

        const driveApiKey = "AIzaSyCzkGVyHXz-eejVzClRLLU9WEFl01tCLhw";
        const categoryStyles = {"Town": {"marker": "purple", "background": "#eee8f7"}, "Museum": {"marker": "orange", "background": "#fff0df"}, "Hike": {"marker": "blue", "background": "#e6eef9"}};

        function refreshMap(fitEntryId) {
            window.setTimeout(function () {
                map.invalidateSize();

                if (fitEntryId && markerNamesByEntry[fitEntryId]) {
                    const latLngs = [];

                    for (const markerName of markerNamesByEntry[fitEntryId]) {
                        const marker = window[markerName];
                        if (marker) {
                            latLngs.push(marker.getLatLng());
                        }
                    }

                    if (latLngs.length === 1) {
                        map.setView(latLngs[0], Math.max(map.getZoom(), 13));
                    } else if (latLngs.length > 1) {
                        map.fitBounds(L.latLngBounds(latLngs), {
                            padding: [35, 35],
                            maxZoom: 14
                        });
                    }
                }
            }, 350);
        }

        function makeEntryButton(entry) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "entry-button";
            if (entry.highlight === true) {
                button.classList.add("highlight-card");
            }
            const style = categoryStyles[entry.category] || {
                background: "#f3f4f6"
            };

            button.style.setProperty("--category-bg", style.background);

            button.dataset.entryId = entry.id;

            const name = document.createElement("strong");
            name.textContent = entry.name || "Untitled place";

            const date = document.createElement("span");
            date.textContent = entry.date || "";

            const abstract = document.createElement("small");
            abstract.textContent = entry.abstract || "";

            button.append(name, date, abstract);
            return button;
        }

        function fillEntryList(container, matchingEntries, emptyMessage) {
            container.replaceChildren();

            if (matchingEntries.length === 0) {
                const message = document.createElement("p");
                message.className = "placeholder";
                message.textContent = emptyMessage;
                container.appendChild(message);
                return;
            }

            for (const entry of matchingEntries) {
                container.appendChild(makeEntryButton(entry));
            }
        }

        function renderSidebar() {
            const categoryFilter = document.getElementById("category-filter");
            const selectedCategory = categoryFilter.value;

            const categoryEntries = selectedCategory === "__all__"
                ? entries
                : entries.filter(entry =>
                    (entry.category || "Uncategorized") === selectedCategory
                );

            fillEntryList(
                document.getElementById("category-entries"),
                categoryEntries,
                "No entries in this category."
            );

            // Highlights stay independent of the selected category.
            const highlightedEntries = entries.filter(
                entry => entry.highlight === true
            );

            fillEntryList(
                document.getElementById("highlight-entries"),
                highlightedEntries,
                "No highlighted entries yet."
            );

            // Tier groups follow the selected category.
            const tierContainer = document.getElementById("tier-groups");
            tierContainer.replaceChildren();

            const entriesWithTiers = categoryEntries.filter(
                entry => entry.tier && entry.tier.trim() !== ""
            );

            if (entriesWithTiers.length === 0) {
                const message = document.createElement("p");
                message.className = "placeholder";
                message.textContent = "No tiered entries in this category.";
                tierContainer.appendChild(message);
                return;
            }

            const preferredOrder = ["S", "A", "B", "C", "D"];
            const tierNames = [...new Set(
                entriesWithTiers.map(entry => entry.tier.trim())
            )].sort((a, b) => {
                const aIndex = preferredOrder.indexOf(a);
                const bIndex = preferredOrder.indexOf(b);

                if (aIndex !== -1 || bIndex !== -1) {
                    if (aIndex === -1) return 1;
                    if (bIndex === -1) return -1;
                    return aIndex - bIndex;
                }

                return a.localeCompare(b);
            });

            for (const tier of tierNames) {
                const groupEntries = entriesWithTiers.filter(
                    entry => entry.tier.trim() === tier
                );

                const group = document.createElement("details");
                group.className = "tier-group";

                const heading = document.createElement("summary");
                heading.textContent = `Tier ${tier} (${groupEntries.length})`;

                const list = document.createElement("div");
                list.className = "entry-list";

                for (const entry of groupEntries) {
                    list.appendChild(makeEntryButton(entry));
                }

                group.append(heading, list);
                tierContainer.appendChild(group);
            }
        }
        let activeMediaItems = [];
        let activeMediaIndex = 0;
        let mediaLoadNumber = 0;
        let currentMediaFolderUrl = '';

        function renderMediaItem() {
            const stage = document.getElementById("media-stage");
            const caption = document.getElementById("media-caption");
            const counter = document.getElementById("media-counter");
            const previousButton = document.getElementById("media-prev");
            const nextButton = document.getElementById("media-next");

            stage.replaceChildren();

            if (activeMediaItems.length === 0) {
                const empty = document.createElement("div");
                empty.className = "media-placeholder";
                empty.textContent = "No media items added yet.";
                stage.appendChild(empty);

                caption.textContent = "";
                counter.textContent = "0 / 0";
                previousButton.disabled = true;
                nextButton.disabled = true;
                return;
            }

            const item = activeMediaItems[activeMediaIndex];

            const frame = document.createElement('iframe');
            frame.className = 'media-frame';
            frame.src = item.previewUrl;
            frame.title = item.title || 'Drive media preview';
            frame.allow = 'autoplay; encrypted-media';
            frame.allowFullscreen = true;
            stage.appendChild(frame);
            caption.textContent = item.caption || item.title || "";
            counter.textContent =
                `${activeMediaIndex + 1} / ${activeMediaItems.length}`;

            const hasMultiple = activeMediaItems.length > 1;
            previousButton.disabled = !hasMultiple;
            nextButton.disabled = !hasMultiple;
            }

            function moveMedia(direction) {
                if (activeMediaItems.length < 2) {
                    return;
                }

                activeMediaIndex =
                    (activeMediaIndex + direction + activeMediaItems.length)
                    % activeMediaItems.length;

                renderMediaItem();
            }

            document.getElementById("media-prev").addEventListener("click", function () {
                moveMedia(-1);
            });

            document.getElementById("media-next").addEventListener("click", function () {
                moveMedia(1);
            });

            // Swipe/drag navigation. Skip this for videos so it doesn't interfere
            // with the video player's controls.
            let swipeStartX = null;

            document.getElementById("media-stage").addEventListener("pointerdown", function (event) {
                const currentItem = activeMediaItems[activeMediaIndex];

                if (currentItem && currentItem.type !== "video") {
                    swipeStartX = event.clientX;
                }
            });

            document.getElementById("media-stage").addEventListener("pointerup", function (event) {
                if (swipeStartX === null) {
                    return;
                }

                const distance = event.clientX - swipeStartX;
                swipeStartX = null;

                if (Math.abs(distance) > 50) {
                    moveMedia(distance < 0 ? 1 : -1);
                }
            });
        async function listDriveMedia(folderUrlString) {
            const folderUrl = new URL(folderUrlString);

            const folderMatch = folderUrl.pathname.match(/\/folders\/([^/]+)/);
            const folderId = folderMatch
                ? folderMatch[1]
                : folderUrl.searchParams.get("id");

            if (!folderId) {
                throw new Error("Could not find a folder ID in this entry's Drive link.");
            }

            // Some Drive sharing links include a resource key.
            const resourceKey =
                folderUrl.searchParams.get("resourcekey") ||
                folderUrl.searchParams.get("resourceKey");

            let pageToken = "";
            const files = [];

            do {
                const params = new URLSearchParams({
                    q: `'${folderId}' in parents and trashed = false`,
                    pageSize: "1000",
                    orderBy: "name",
                    fields: "nextPageToken,files(id,name,mimeType,thumbnailLink,webViewLink,resourceKey)",
                    key: driveApiKey,
                    supportsAllDrives: "true",
                    includeItemsFromAllDrives: "true"
                });

                if (pageToken) {
                    params.set("pageToken", pageToken);
                }

                const headers = resourceKey
                    ? { "X-Goog-Drive-Resource-Keys": `${folderId}/${resourceKey}` }
                    : {};

                const response = await fetch(
                    `https://www.googleapis.com/drive/v3/files?${params}`,
                    { headers }
                );

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Drive API error (${response.status}): ${errorText}`);
                }

                const result = await response.json();
                files.push(...(result.files || []));
                pageToken = result.nextPageToken || "";
            } while (pageToken);

            return files
                .filter(file =>
                    file.mimeType &&
                    (file.mimeType.startsWith("image/") ||
                     file.mimeType.startsWith("video/"))
                )
                .map(file => ({
                    id: file.id,
                    title: file.name,
                    type: file.mimeType.startsWith("video/") ? "video" : "image",
                    src: file.thumbnailLink || "",
                    previewUrl: `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/preview`,
                    fileUrl: file.webViewLink ||
                        `https://drive.google.com/file/d/${encodeURIComponent(file.id)}/view`
                }));
        }
        async function loadEntryMedia(entry) {
            const thisLoad = ++mediaLoadNumber;
            const stage = document.getElementById("media-stage");

            activeMediaItems = [];
            activeMediaIndex = 0;
            currentMediaFolderUrl = entry.media || "";

            stage.textContent = "Loading media…";
            renderMediaItem();

            if (!currentMediaFolderUrl) {
                stage.textContent = "No Drive folder link is set for this entry.";
                renderMediaItem();
                return;
            }

            try {
                const files = await listDriveMedia(currentMediaFolderUrl);

                // Ignore an earlier request if the user opened another entry meanwhile.
                if (thisLoad !== mediaLoadNumber) return;

                activeMediaItems = files;
                activeMediaIndex = 0;

                if (files.length === 0) {
                    stage.textContent = "No viewable photos or videos found in this folder.";
                }

                renderMediaItem();
            } catch (error) {
                if (thisLoad !== mediaLoadNumber) return;

                console.error("Could not load Drive media:", error);
                stage.textContent =
                    "Could not load this folder’s media. Check the folder access and browser Console.";
                renderMediaItem();
            }
        }
        window.showEntry = function (entryId) {

ediaItems": []}, {"id": "E025", "name": "Kawagoe - Edo period Saturday", "date": "27/06/2026", "date_ts": 20631, "category": "Town", "abstract": "Visit to Kawagoe, a part of Tokyo, that should give you an idea how life looked like in the Edo period", "media": "https://drive.google.com/drive/folders/1YRivQD9WtuQU6BiZJrFp4SHS0rSzF9ND?usp=drive_link", "memo": "I'm slowly running out of the very obvious 1 day trips from my Tokyo area for not great weather. I am sure there are many more places to see in Tokyo itself, but I like to go out a bit too. So this week I found out about Kawagoe - a district of outer Tokyo where a visitor may feel like back in Edo period.\n\nMy first stop was the Kita-in Temple. This temple is quite important because in the times of shogunate (around 1600s), there was a very prominent monk living here. This monk was famous for his knowledge of both spiritual and earthly topics and the shogun of that time enjoyed their conversation so much that he asked for the monk's advice often. This relationship led to the Shogun entrusting the upbringing of his son to this monk and decided to give him a large land around the temple and a piece of his palace in Edo. Like literally, the shogun ordered several rooms from his Edo palace to be dismantled and brought to the Kita-In temple to construct it there again. \n\nIn these rooms a very prominent woman who also gave birth to the next Shogun in line lived and also gave birth there. So you can visit these rooms, but cannot take pictures of anything inside, just the garden, as it is considered \"holy\" due to the Shogun's birth there.\n\nThe whole visit was a little eerie as apart from me, maybe like 4 other tourists were inside the area. So I could really take in the experience. There were some items to see, some very nice painted doors and ceilings, a statue of the monk, and a collection of paintings of craftsmen of Edo period. \nOutside in the Kita-In area, there's also a garden of 500 buddhas. A little Area with 538 different Buddha statues, where each buddha is unique in his posture, items, and facial expressions. Some of them were quite funny and with the moss coverage it looked ancient. But realistically, the buddhas were sculpted in at the end of 18th century, so not as old as it might seem.\n\nThen I went over to Honmaru palace, which is one of the few original surviving Edo period palaces in Eastern Japan. Again, for a small fee you can go inside and this time you can even make photos. So I had a chance to see how could the Edo period nobles spend their time. Apparently, the particular nobleman who built the Honmaru palace wasn't super important, but the importance is enhanced by the palace to survive to this day. Again, there were several interesting items to see and a nice garden to enjoy. \n\nLastly, I've made my way to a street called Shotengai, which should be a street, where time stopped and you can feel like walking back in time to Edo period. That is, if you can ignore all the cars, buses and tourists flowing both ways. Nevertheless, some of the buildings are really pretty wooden villas, with shops of various crafts or restaurants inside. The Kawagoe was also known for it's production of sweets, which in one time at the end of 19th century made up more than 90% of Tokyo's sweets consumption. And their specialty was various sweets from Sweet potato. So I bought a Ikinari Dango, a steamed dumpling with a thick slice of sweet potato topped with red bean paste inside, and sweet potato chips with different types of butter. Both were tasty, less sweet than you would expect from a \"Sweet\".\n\nI ended up eating ramen at the local Ichiran. Ichiran should be the best ramen shop in Japan, but I am not convinced. Yes, it is very easy to really customize your ramen there, the noodles are super thin and the broth is nice, but for the same price, you can get much better ramen at almost any local proper restaurant, where you just buy a meal ticket and hope for the best.", "highlight": false, "tier": "B", "sort_order": 25, "points": [{"latitude": 35.917616618240004, "longitude": 139.48897425044225, "marker_label": "Kawagoe Kita-in temple", "marker_order": 1}, {"latitude": 35.923617278559675, "longitude": 139.4829166493321, "marker_label": "Kawagoe Shotengai", "marker_order": 2}], "mediaItems": []}, {"id": "E026", "name": "Mito and surroundings", "date": "04/07/2026", "date_ts": 20638, "category": "Town", "abstract": "Travel to one of the most beautiful gardens of Japan and an anime related surprise experience in nearby village", "media": "https://drive.google.com/drive/folders/1xJ85AxHRhpSndETRuIOX_CyBsrbRXPGk?usp=drive_link", "memo": "Another week, another random half rainy day suggestion for a day trip from AI. This time I was sent to one of the \"Three Great Gardens of Japan\" - the Kairaku-en in Mito. It is supposedly very pretty garden with also some carefully planned yin-yang transitions and a big peach tree grove. As it is the start of July and the weather shouldn't have been very nice, I was a little hesitant, but went there in the end anyways.\n\nThe walk through the city before getting to the garden was a bit weird because it was a big street with many many shops and restaurants and at around 11 am, almost nobody was there either on the street or inside the shops. Anyways, I made my way to the original entry gate of the garden to enter with the \"yang\" aesthetic which should be these shadows made by the dark gate and a grove of tall bamboos on one side and even taller cedar trees on the other side. This was really nice to walk through as it also absorbed the sounds a bit, so the walk was very calm. Then I was supposed to enter the villa and as it has 3 stories, experience the \"yin\" by going to the top and seeing the bright lake and peach tree grove underneath the villa. This was quite successful, as both the insides of the villa, where the lord of the area who built this place was organizing poetry readings and tea ceremonies for old and important people back in the day, and the views from the top balcony were super nice. \nAs expected, the rest of the garden wasn't too nice in this time of year, but I walked through it and got a goshuin stamp at the nearby temple. Then I went to the lake, where in a nice renovated free time area, there was a Brewery+grill restaurant, where I had the best lemon tartar sauce of my life.\n\nAfter the food I walked past the lake back to the town and to the train station, as I wanted to also go to the shore, which was about 20kms away and had a torii gate on cliffs in the sea. My train was coming in more than 30 minutes so I made my way to the crane game center and in 8 tries I won a big Dragonite plushie!! Then it was time to take the train.\n\nOh boy, what an experience this ended up being. The train had a carriage dedicated to Girls and Panzer anime. Weird, but ok... Then I took of at a train station with no Suica readers being handed a slip of paper after paying the train fee. Then I was supposed to walk about 40 minutes through the town to reach the coast. I reached an area with shops and believe me, majority of the shops had life-size carton cutouts of the \"nazi style\" anime girls and big stickers of different tanks in their windows or inside. Butchers, hairdressers, cafés, supermarkets, seafood shops, massage studios... Girls and Panzer everywhere. And not a single soul to be seen outside. I met maybe 3 people on the street, and it seemed like at least 2 of them hurried away from me. It was SO weird I didn't even make photos of the weird stuff. \n\nOnly later I googled and found out that the Girls and Panzer anime takes place in this little coastal town. That it aired in 2012, one year after the town was mostly destroyed by the big earthquake and tsunami that damaged Fukushima nuclear plant. That the fact that some buildings were destroyed in the anime by the tanks made anime fans come there and visit those houses. The owners noticed this parallel and collaborated with the anime creators to show particular shops destroyed by the tanks in further episodes and then the shop would print out the tank and the girl riding the tank and welcome the anime - tourists like that. That it kinda saved the whole town's businesses. And the town just leaned in, made a big party for the anime finale in 2015 (including making the themed train vagon) and to this day still holds events for the fans of the anime. \n\nWell anyways, I made my way to the shrine which has a torii gate on a cliff in the sea and finally there were some other people there. The people did a kind of ritual with a big wooden circle, where you need to walk through and around it in a special way, but I didn't study it further than that. The gate in the sea was beautiful, but the waves were not big enough for the view to be absolutely awesome. With some luck and good preparation I managed to resolve all the Suica problems on the way back and even catch a train back to Tokyo just in time.", "highlight": false, "tier": "A", "sort_order": 26, "points": [{"latitude": 36.375594976443224, "longitude": 140.45384062571836, "marker_label": "Mito Kairaku-en", "marker_order": 1}, {"latitude": 36.315056159934265, "longitude": 140.58954440907888, "marker_label": "Torii gate on the cliffs", "marker_order": 2}], "mediaItems": []}, {"id": "E027", "name": "Fourth hike - Nokogiriyama", "date": "11/07/2026", "date_ts": 20645, "category": "Hike", "abstract": "Fourth hike in Japan to prepare my body for Fuji climb. Aesthetically gorgeous, but made some poor pathing decisions and missed a very important sight", "media": "https://drive.google.com/drive/folders/1WK-9Be24fQ1gIsEwtRDzk_SDIkymWDr3?usp=drive_link", "memo": "The hot summer days appeared to Japan around this time. However due to Fuji climb in the next week I wanted to do some easy-medium hike to like get the blood flowing and so on. Well after some back and forth with the AI friends I selected the area of Nokogiriyama. This mountain (more like a hill) is on the east peninsula forming the Tokyo bay and it promised nice views and some spectacular monuments of human labor as the mountain was mined for stone.\n\nAfter I got to the place, which took several train changes, I could choose if I want to hike towards the top, or take a cable car. Naturally, I chose the hiking. The hike was quite pleasant, after a start, which was just a very very long staircase in a forest. When I got to the area of the stone quarry, info tables started to appear and they had english text too! So I could read about stone slides for the big blocks of stone that were separated from the mountain and then sent on their way down the hill on these slides. The quarry was active for just about 100-150 years, but the chunks of mountain that were taken away were HUGE and made for a very nice views. In one of the areas, concerts are being held due to accidently creating almost perfect acoustic location.\n\nThe trails around the quarry were a bit of a maze, but I decided to just see everything around the top, so I've seen the main quarry area, a viewpoint from which the curvature of the Earth should be visible on a good day (wasn't a good day for that due to haze), the summit of the hill, and some other viewpoint overlooking the southern area of the peninsula before heading towards the part, which was accessible from the cablecar and held a temple with some nice Buddha statues.\n\nWell, I entered the complex near a big relief Buddha (don't know the english word for the shape cut in stone so it's like half-3D) which measured like 10 meters. Then I climbed another loooong staircase towards a viewpoint that was absolutely clogged with people. And with it being so hot I just wanted to get back home since I also was supposed to receive the rental hike equipment for Fuji that evening.\n\nI didn't want to miss anything so I followed signs towards the temple, but at one intersection the name of the temple disappeared from the options. So out of 2 options I chose the direction heading towards the cable car, which was lined with many many small Buddha statues, so it looked also more official. After eating something, I took the cable car down, then decided to take a ferry across the Tokyo bay, and head home from the other side.\n\nYeah, on the Ferry I opened my backpack and by looking at the map I got at the entrance of the temple area near the relief Buddha, I realized that I completely missed the main temple area with the biggest stone Buddha statue of Japan. The biggest of boys missed due to my laziness and a cascade of wrong choices... Well that kinda hurt the otherwise very very nice day. I guess I'll need to come back one day to pay the big boy a visit.\n\nThe ferry ride was nice and calm, views pretty, nothing special happened on the way home I would say.", "highlight": false, "tier": "B", "sort_order": 27, "points": [{"latitude": 35.160737101410476, "longitude": 139.8409854212043, "marker_label": "Nokogiriyama", "marker_order": 1}], "mediaItems": []}, {"id": "E028", "name": "Mount Fuji", "date": "14/07/2026", "date_ts": 20648, "category": "Hike", "abstract": "The Mount Fuji climb. A two-day endeavor with perfect weather, some Charlie struggles, and very well deserved tiredness afterwards", "media": "https://drive.google.com/drive/folders/1ugo1qklMMR5nWq6l_GyHYm3WqAaCleXw?usp=drive_link", "memo": "The day has come to go for the potentially best or worst hike of at least my Japan trip. I was nervous A LOT during a couple of days/weeks before, because you see news like \"tourists were not ready and were needed to be rescued from Fuji\", \"tourists were denied entry to Fuji trails because of bad equipment\", \"a tourist died on Fuji due to heart attack/fall into crevise\" quite often. Along with dangers like altitude sickness, big temperature difference and so on.\n\nThe preparation included several instruction videos, some chats with AI chatbots, renting additional equipment from a service that Charlie found (we got proper boots, rainwear, poles, headlamp, and gaiters), and buying proper hiking backpack and gloves. Also overthinking which route out of 4 to take and when to get there and booking a night in one of the mountain huts. In the end we selected the Subashiri route, and I booked a night in Goraiko-kan - the last mountain hut under the top of Fuji. And we got a train from Shinjuku heading towards there at 7:45 and got to the start of the route just before 11:00.\n\nWhat awaited us was \"the easiest of the 4 routes\", which still climbed from 2000 meters and should take us to Goraiko-kan at 3450 meters in about 6 hours of walking. So after a short snack at the 2000 m station where the bus left us, we started walking. The best part about Subashiri route was that the first around 400 height meters were hidden in a forest. So we enjoyed quite a few changes of scenery during the climb. What surprised us a lot was that some European/American families started the hike with just shorts and T-shirts, running shoes and no backpacks. It turned out these ppl were just speedrunning the path towards the first mountain hut and then returned back? I still don't really understand the benefits of that. Yes, the souvenirs that you can get, which I took too, are quite nice. The souvenir in question is a simple wooden stick, on which the mountain hut staff would burn their badge. So by climbing the mountain, you can collect several badges like this and have the progress you did immortalized by this stick.\n\nSo yeah, our progress. The views. The excitiment about what scenery will come next. Getting above clouds. I was really enjoying myself. My stamina/strength was better than I expected, so I was happier and happier. Unfortunately, Charlie couldn't say the same. His tempo got slower and slower and before long it was obvious that he got hit by the altitude sickness. The first crisis came at around 3000 m mark. This one was still possible to get through with more waiting, but at the next hut around 3150 m, it got scary for me. Charlie ticked off almost all the symptoms and was VERY pale. Thankfully the hut we were sitting at was selling oxygen bombs, so I forced Charlie to start inhaling one. And then I did my best to keep positive mind and hype him up just enough to get to the hut where we stayed for the night. So with very slow tempo and frequent breaks for some pure oxygen inhalation, we got to the Goraiko-kan just after sunset. \n\nApart from Charlie's bad luck struggle, the views were absolutely perfect. The scenery where you see tops of clouds, lakes in the valleys and mt. Fuji's shadow in the setting sun all in one field of view will be something I'll carry with me for a long time. The sunset cloud colors and more and more alien looking rocks around the trail made it almost too good to be true.\n\nThe sleepover was provided in a very cramped loft, where I couldn't even sit upright, but the futon, pillow, and sleeping bags were comfy. After chilling in the common area, and chatting with some people we tried to sleep still with a plan to wake up and climb the rest of the Fuji to see sunrise from the top. That meant alarm at 2:30, but I couldn't sleep too much, I had always a feeling that I'm not getting enough oxygen in my breathing when lying on my side, so I accummulated only about 2 hours of sleep during the night. If even that. \n\nThe alarm rang, I checked on Charlie, he said he couldn't and we're not going for the sunrise climb. So I at least got out to go to the toilet. What I saw under me was just a long line of people trying to reach the top in darkness. The wind was very strong, temperature very low, and there were tens, maybe hundreds of ppl in one long line trying to reach the top. I was quite glad that we chose to not join them...\n\nThen we got up to watch the sunrise at least from the porch of the mountain hut. It was very nice. But I think I liked the sunset more, eventhough it was on the other side of the mountain. Then the time for Charlie's decision came. In the end, he decided to stay behind and slowly descend and wait for me. During the night he did not get better, couldn't sleep, and we agreed that it would not probably end in other way that him turning around and heading down anyways.\n\nSo I headed up to the summit alone. I zoomed past many slower climbers on the way to the top. Again, the views on the way were glorious. More and more naked rock were to be seen, the view of the world got this sparkly feel to it, like everything was suddenly more high resolution. When I reached the rim area, I was greeted by a big crowd of people and about 3-4 shops with various drinks/foods/souvenirs. I bought a badge, couple of postcards, and waited in a queue to get stamps to my stamp book. Then I headed towards the highest point of Fuji - the highest point of Japan you can reach on foot. The hike around the rim gave me more views and perspectives on both the Fuji crater with last remains of snow inside it, and surrounding area, the ocean, more mountains, cities, lakes... \n\nAt the highest point, there's a meteorological station and, of course, a line for the photo spot with a pillar and a plaque highlighting the highest point. The behavior of some people, and their selfishness never fails to surprise me. How can you decide, that it's okay to ask a random person to re-take your photo 5 times, when there are tens of ppl waiting in line behind you. And after making everyone wait you realize that you're gonna do more after you left already, and without saying a word just walking back to the photo spot absolutely ignoring people's pleads to \"please no, don't do that lady, no\"? I will never understand.\n\nAnyways I got the best photo of my life from there and then I tried to make up some time and walk back towards the way down quite quickly. By chance a found a small metal cast of Fuji in front of one small torii gate. Did some photos of very interesting clouds that formed in the meantime and headed down towards Charlie. Poor guy was already waiting for me for like 3 hours. \n\nThe road down was SO SO monotonnous. We took the Yoshida route which merges/splits with Subashiri route at around 3100 meters. The first part before I caught up with Charlie was still quite fine, because the temperature wasn't so high and the ground was a mixture of different textures. But after I linked up with Charlie it was like 1000+ height meters of the same. Volcanic gravel/ash with steady incline, that was sliding under you, making clouds of dust, and relentless sun that was getting stronger and stronger. We've seen several ppl fall repeatedly, one of them even needed to be taken away by medics. Charlie couldn't walk too fast due to his fatigue and slightly ill-fitting shoes that hurt his toes. My woes were a very sore right shoulder and continuously increasing pain of right foot. Mixed with the physical strain of previous 20 hours, the descent really wasn't fun. Especially as the signs with distance and time estimates were clearly lying to us half of the times. Or the intended tempo was running down. The last 200 height meters were at least interesting in the fact that we entered the clouds, and combined with shelter tunnels against falling rocks it created some eerie views. For like last 1/20 of the way it was possible to rent a horse, which we saw several ppl do. And from the looks of the Yoshida route, which is the closest to Tokyo, thus the main for tourists, we did not envy the people going up. What we saw was asphalt road going up with fences around it. When compared to our forest road with trees and flowers, and also way less people, I think we made the right choice. \n\nLast part of the descent was actually a straight wide road that was about 1 km long without a single shade and that was absolutely horrible, even though we just powered through it. Then at the hub we just bought more drinking water, some snack and found the quickest way to Tokyo, which was a direct bus to Shinjuku. That was a blessing and the sleep on the night after returning home was one of the best sleeps I've gotten in LONG long years. Overall, this has been really a highlight of my Japan stay, the descent feelings will be soon forgotten and all that will remain will be the absolutely gorgeous views and my happiness from how I handled it both physically and mentally.", "highlight": true, "tier": "S", "sort_order": 28, "points": [{"latitude": 35.363778299739735, "longitude": 138.72753927845565, "marker_label": "Mount Fuji", "marker_order": 1}], "mediaItems": []}, {"id": "E029", "name": "Mainstream Tokyo weekend", "date": "18/07/2026", "date_ts": 20652, "category": "Museum", "abstract": "Longer weekend with opportunities to do more stuff, so filling out the rests of mainstream places to visit, some shopping, art gallery and arcade games", "media": "https://drive.google.com/drive/folders/15gUiSum-pqx-d0BlIPsFWYHWiePxiEQB?usp=drive_link", "memo": "On the weekend after Fuji, I wanted to do something calmer. It was also longer weekend as 20/07 was a public holiday, so I could do more stuff during the weekend. So I decided to catch up on the mainstream places in Tokyo and try to visit some fun places in between.\n\nOn Saturday I finally got around to go to the Imperial Palace of Tokyo. There are some parts that are closed to public, but as a tourist you can still walk around the gardens and areas of the former main keep. It has classic Japanese castle elements like huge walls made of huge stones inscribed by families donating them, big moats filled with water with lotus plants on them and koi fish inside them. Some buildings survived or were kept in their original, or Edo period location and appearence including several former guard houses. Of course, the more inside of the castle you are, the more noble/prominent samurais were stationed there. From the main keep tower, which was once the biggest in Japan, only foundation stone platform remains. The keep tower wasn't rebuilt after a fire in Edo period, because it was already peace time after many wars between different families. There are some buildings which are named after Fuji, as during the Edo period, in excellent visibility (without trees and later skyscrapers), Fuji might have been seen from there. \n\nAfter that I went to meet with Mentor and his girlfriend to go browse the Tokyo Flea Market together. It was a very classic flea market with many many weird pieces of clothing, more or less interesting artifacts and many trading cards/old nintendo game stands. In the end we haven't bought anything, because the pieces that actually caught our attention seemed very expensive for the quality that was shown. \n\nAfter that I made my way to the Mikado game center. It is a place that has arcade games going back to 80s and it is absolutely great. It is 2 floors of arcades, with everything from old Sega racing simulators, original House of the Dead, and other shooters up to a huge collection of different bullet hells and fighter games. Everything is playable with a 100 yen coin and it's very easy to spend thousands across several games and hours. A funny bonus was that there was a tournament in Street Fighter II when I was there, so guys between like 15 and 60 years old were playing against each other with also live commentary from the tournament announcer. A couple of weeks later we went back there with Mentor and had an absolute blast playing some bullet hell game and one shooter game.\n\nOn sunday I did the classic bouldering + nice lunch combo \n\nAnd on Monday I went first to Asakusa, which was absolutely horribly overcrowded. It was also one of the days above 35 deg C, which really did not make it better. The temple is quite majestic, it has very nice statues and lanterns around, but the huge crowds made it impossible for me to enjoy my stay there.\n\nSo I went to a modern art Museum called Artizon. It was in a very fancy building in a very fancy part of Tokyo, but it was a very nice art museum. The first floor was dedicated to one italian artist who made many different things, but mainly tried to do very modern furniture and photography. The displays were put together in a very nice way so it was fun to go around. One of the pieces were modern artists' attempt to build \"pillars that make your mind to be at peace\" as he theorized that many cultures have totem-like structures and these usually banish bad entities and so we can do them in a modern way inspired by like telephone poles, but also the original totems, and purify our souls. Other floors were a selection of paintings of different kinds, but mostly impressionism, where some European works were shown, but also works by Japanese artists who went to Europe to learn and see the styles that are modern in western world. \n\nOn this floor I repeatedly met the prettiest Japanese girl I've seen so far. I couldn't help but look at her almost the same as the works, so in the end I accummulated enough courage to tell her that I'm sorry for looking at her that much, but that she is very beautiful and yeah... I got the \"ooooo, Tenk juuuu\" react and then she walked away and never looked back.\n\nThe last floor of the museum was dedicated to works of one writer-turned-painter of Japanese scene who was originally a critic of art, but later started experimenting with ways how to transform written words into paintings, which was quite interesting, but I couldn't focus that much anymore at that stage...\n\nAfter the museum I went shopping to this one street with mostly small craftsmen shops with kitchenware. So cups, tea sets, knives, chopstick workshops, etc. That was nice, but as it was public holiday half of the shops were closed. But no matter, I got some nice gifts there!", "highlight": false, "tier": "B", "sort_order": 29, "points": [{"latitude": 35.68524468708497, "longitude": 139.75283168336387, "marker_label": "Tokyo Imperial Palace", "marker_order": 1}, {"latitude": 35.59532876611079, "longitude": 139.74301994065698, "marker_label": "Tokyo Flea market", "marker_order": 2}, {"latitude": 35.71502709548684, "longitude": 139.79677907349907, "marker_label": "Asakusa Senso-ji", "marker_order": 3}, {"latitude": 35.7128221856054, "longitude": 139.70347625452908, "marker_label": "Mikado game center", "marker_order": 4}, {"latitude": 35.67887666779354, "longitude": 139.77192408336325, "marker_label": "Artizon art museum", "marker_order": 5}], "mediaItems": []}, {"id": "E030", "name": "Adventure park visit", "date": "25/07/2026", "date_ts": 20659, "category": "Town", "abstract": "Visit of one of Tokyo's adventure parks with Mentor and Charlie. My first proper rollercoaster ride and mini bungee jump.", "media": "https://drive.google.com/drive/folders/1HSGrQ0naOMnTloRenC2Q1G7hRwRcpPDs?usp=drive_link", "memo": "Adventure tiiiimeeee! I really wanted to visit some rollercoasters while in Japan. And the closest one - attractions around Tokyo Dome - are closed due to a tragic accident of a maintenance person in April, the other closest rollercoaster park with decent rides was the Yomiuri land. I've been able to persuade Mentor and Charlie to go with me, so we went quite soon after opening at 10 am towards there. It was a hot day again, so of course the water attractions were closed as they were a part of a pool area in the summer. \n\nAnyways, we made our way to the park using a cable car and got a all ride ticket to get in. After a hiccup, where I lost the paper ticket I used to get in and it took 6 members of staff of the park to put together a sentence that as long as I don't lose the wristband they gave me at the entrance, I'm good, we set up to go ride all the rides.\n\nFirst we queued up for the headline ride - a long rollercoaster called the Bandit. That. Was. Fun. The max Speed was around 100 km/h, some turns came were fast and me and Charlie sat in the front cart, so the water splashes that were a part of it were felt quite hard on our faces. \n\nAfter that we did a go-kart circuit which was very chill as the go-kart had a capped speed at quite low value. Then we did a spaceship thing that did 360 degrees vertical spins, that was fun as there was a considerably less resistant japanese guy behind me who yelled a lot. Then we went to a place with the fast drop and fast rise towers, but those were closed, so we at least did this weird rotating see-saw and I queued up for bungee jump. It took a lot of time, because there was a group of like 8 japanese guys in front of me, but Mentor and Charlie were nice enough to wait for me and do a video of my flight. The tower was 20 m tall, so the view from the top was nice! Including a direct view to the nearest cemetery. The scariest part about the bungee was to stand up at the edge and not fall too soon, one of the japanese guys in front of me was really scared, but after taking up courage by letting 5 of his friends go before him, he was also able to do it. Me personally, I would like the flight to be longer as here it felt like a very short time before the rope started slowing you down again. If I look back at it now, it felt maybe shorter than jumping from like 5 m high tower to a swimming pool. But it might be just subjective feeling.\n\nAfter this we got a ride at a very classic merry-go-round and then it was time for food. We found a all-you-can-eat pizza place in the park and we spent like an hour and something in the AC'd building as the weather was very very hot. Then we didn't have too much time left, so we went to see the last part of the park we haven't explored yet. In there we found 2 more interesting rides, one was space-themed hanging chairs rollercoaster which was quite fun, the second was a spinning chair rollercoaster with some dark/mirror section that got fun only after quite boring first half. In the end I think it was a successful day, and we haven't missed anything too important. If we had the full day, we would add the haunted house and some other stuff like that to the list, but that isn't anything too exciting.", "highlight": false, "tier": "A", "sort_order": 30, "points": [{"latitude": 35.632470826797295, "longitude": 139.51745696404123, "marker_label": "Yomiuri land", "marker_order": 1}], "mediaItems": []}, {"id": "E031", "name": "Kyoto Osaka culture weekend", "date": "31/07/2026", "date_ts": 20665, "category": "Museum", "abstract": "Stay for a weekend in Kyoto and Osaka to visit bunraku performance. To fill up the time around, taiko drum show and sumo show was added.", "media": "https://drive.google.com/drive/folders/1HGpNHNCI_h6mLFf1OXimlMyutJqyaQpq?usp=drive_link", "memo": "What a weekend that has been. Already more than a month ago, I booked a ticket for a Bunraku performance at Summer Bunraku festival, which is the only option to see real authentic bunraku performance in the summer. Bunraku is the Japanese form of puppet theater, but there are some caveats to it, I'll explain them later.\n\nBecause first I need to talk about the different events and things I've seen before that! As I wanted to experience some more Japanese fun, I looked at what kind of things I might do on the rest of the weekend and for Friday night I chose a Tao Drum Show in Kyoto. Tao drums are the huge drums that look like big barrels and this performance is supposedly going around the whole world and its home is there in Kyoto. So, I rushed to be there on time, and I got a free drink at the start and an option to chill at a rooftop garden overlooking Kyoto skyline, which was nice. The show itself was sometimes a bit too much for me in terms of stereotype... Different sizes of drums had a bit less time than I expected from a \"Drum show\", with the rest being ladies with flutes (biwas) and guys doing acrobatic dance moves and other musical instruments like koto, and shamisen. The performances of the people were awesome, many of the people played the drums And also one of the other instruments, and some of the guys also addes the acrobatics. What was a bit putting off was this AI generated animation slideshow behind the ppl with lasers shooting overhead. At the end, we got another free drink and were asked to leave a review like 5 times. What was nice was that a couple of the performers went to mingle with the audience in the bar area so we had a chance to ask around and pay respects from up close.\n\nThe Saturday started by a nice hotel breakfast and then I made my way to the Kyoto national museum. It was a big building in a very wide open space, and that day it was maybe the hottest weather of my time in Japan, so the outside was almost unbearable even under my sun-blocking umbrella. Inside there were a lot less expositions than I expected and the whole museum had a ban on making photos. The main exposition of the time I visited was about ritual jars of Japan from different time eras. Starting from like 8th century, when the first jars were brought from Korea, the form and appearance was mostly kept the same with some very little improvents in time. Then there were some ritual masks and big buddha statues. There it was interesting, that many of these bigger buddha statues had some treasure boxes hidden inside them with various relics.\n\nI cut it close and arrived only 15 minutes before the start of the performance, so I was guided by like 6 ppl in total to get my ticket, get through the ticket check, get a questionnare, get an audio guide, throw my stuff into a locker, and make it to my seat in time for the start. The performance was made of 2 different works - one dramatic, and one comedic - both showed 2 acts of the whole play, the dramatic covered a coherent 2 acts that made a whole part of the story, the comedic covered 2 out of 6 acts of the whole story, but with the audio guide, I was able to follow what was happening. And this is what was happening:\n\nOn the main stage a simple, but nice setting was set for the characters to do their stuff at. On the right of the stage there was a smaller, slightly elevated stage with rotating floor. At the start a guy completely covered in black clothes including a hood so we couldn't see his face came on stage. He announced what will be played, the smaller stage rotated so 2 guys sitting on it appeared. These were introduced by the hooded announcer with an applause for them. One had a japanese guitar - shimasen - and the other had a book. Both were dressed in nice white kimonos with shoulder pads. After the introductions were done the announcer left the stage by continuously calling out \"Tozai, tozaaaaaaaaaa-iiiiiiiiii....\" Which means East and West, East and West, but is used in Japanese theaters as \"Hear ye, hear Ye\" or similar announcements. Then the shimasen guy began with an introductory solo, and then the guy with the book (tayu) started narrating the play with almost opera like performance. The most interesting thing is, that this single narrator narrated all different characters on stage and even the general narration. Each character in his performance had a different voice pitch, and the intonation is very deliberately overexaggerated.\n\nEnter puppets and puppeteers. Each main character puppet has 3 people controlling it and is about 50-100 cm big. The main puppeteer wears a white kimono with a coloured apron and controls the right hand, upper torso and head including facial expressions of the puppets. Some puppets had movable eyebrows, some mouths could be opened, some winked and a different combination of these movements were all unique to each puppet. The two other puppeteers were covered completely in black in the same sense as the announcer, so even with a hood and mask on so they remained anonymous. One of them controlled the left arm and prepared some items that would be needed, the other one controlled both legs. In some parts of both plays some minor characters appeared on stage and these were controlled by one of the anonymous puppeteers only. Of course these were smaller and didn't have as many moving parts.\n\nOverall the plays were super nice and very lively, the narrator performances were absolutely unbelievable. Each act had a new duo of Shimasen player and narrator, which I am not surprised by because it must be a tough performance. The first play was about an aftermath of some battle between 2 feudal lord families. This aftermath played out in a fisherman's hut, where pregnant lady of the defeated lord took refuge. In the end 2 samurai who were tasked with killing or capturing the newborn were in the hut too. It didn't end well for one of the samurai, but it ended well for the lady and her newborn. The second play was about a daughter of one shop keeper, who wanted to be with her love, but was supposed to be wed to someone she didn't know instead. This also had a happy ending. Sometimes, the puppets being controlled by 3 men each, created quite funny situations. The daughter had a romantic melancholic moment with her lover including a lot of hugging, crying, touching and kissing, but the main puppeteers were just stone cold, absolutely poker face facing each other with no facial expression at all while their puppets were all over the place with overexaggerated movements of all limbs and head.\n\nSo yeah, after the plays ended, I visited also a small exposition showing the different stages and history of the bunraku puppet head carving. Turns out about 90% of today's puppet heads were made by a single person during 50-70s of 20th century. Originally some puppet heads were used for more than 150 years, but 99% of all materials were destroyed during Ósaka bombing in the WW2. So today's bunraku was really ressurected by a very small amount of people.\n\nAfter bunraku I headed back to Kyoto, where I got ramen at a place Mentor recommended to me, but it was probably a bit too touristy for me and I had better ramen in different places around Tokyo. It was nice, just not the best. After that I figured out it might be worth it to try to find some whiskey bar which would serve a larger range of Japanese whiskeys. Which lucky enough I found on my way to the hotel. In the end I got 3 different whisky shots. First one was \"The Chita\", which was supposed to be nutty and woody, but being the cheapest of the three I selected, the main positive was, that it was quite mild. Otherwise not particularly distinct. The second one was \"Kaku reprint edition\" which was supposed to be smoky. It was smoky alright, but again, nothing super special. The smokiness level was higher than I expected, but nothing other than that was noticeable for me. The most expensive one was \"Hakushu 12y\", which was supposed to be botanic/herb. And man, it was probably the best smelling whisky I've ever had. The fruity tones were very apparent, but also with the groundy whisky smell carrying it. Unfortunately the taste didn't match the smell. It was nice, mild, tasty, but the fruity tones were not apparent in the taste for me. Very nice thing was also an infinite glass of various nuts that came with the drinking bar fee.\n\nOn the last day of this weekend, first I visited the Nijō-ji castle. The Nijō-ji castle was the seat of the Shoguns, when they visited Kyoto for business during the Edo period, when the seat of power was already in Edo. Thus, a lot of effort was put into the Nijō-ji castle grounds and buildings. Inside the castle I could visit the Ninomaru-goten palace, which was renovated not long ago to highlight the arts and crafts of the original wall and sliding door paintings. A very nice bonus was that they used the original method of building the floors that was used in the old japanese palace buildings that makes the floors sound like singing birds. It was explained that the sound comes from creaking of little nails holding the planks of the floor in the right position. There was however no mention about this being used as a warning system against uninvited guests. Either this was a different thing than the singing floorboards used as anti-thief/ninja precaution, or it wasn't deliberately used like that in this palace.\n\nAnyways, the walls and doors of the palace had some really beautiful paintings, usually with golden background and nature topics. Interesting room was the one decorated with images of tigers. As tigers are not native to Japan, probably none of the original painters saw a living tiger in their life. They could only work with rare imported furs, or existing chinese tiger paintings. That is why Japanese tiger paintings of that age usually look a bit funny. What was also believed was that every 10th tiger cub is born a panther, as old chinese ppl didn't recognize these two cattos as different species. Overall the inside of the palace was very pretty, but so so very hot.\n\nOutsides of the palace were typically beautiful and calm spaces with sparse trees, a zen garden, a remain of the original main castle keep (again just the stone base was left) and a tea house here and there. It was also possible to visit a smaller palace in the main keep complex, but I didn't have time for that already, as I needed to make my way for the next Japanese experience.\n\nMy next Japanese experience was a Sumo + Geisha show in a top floor of one shopping street of Kyoto. I arrived among the first and got a sofa right next to the rink. The announcer of the show was a spanish born man, so his spanish accent was very noticeable in his english, but it was fun to follow anyways. First he explained some short history of Sumō, that it was originally one of the fine martial arts for samurai, only reaching common ppl properly during the Edo period. Then some rules in terms of spectating the Sumō match were explained (probably made a bit more fun for tourist ppl) and the two main fighters - Kyoroman and Kyohikari were introduced. Then, also a short geisha show dance with handfans was shown. That was nice, but a bit awkward as I was very close to them and it felt weird to stare at them too much from such close distance. Then the two fighters showed us (with a lot of semi-verbal comedic gags including some small pp jokes) different aspects of sumo fighter training, the equipment, also told us about the daily life and so on.\n\nThe belt they have is actually really long, it has 6 meters and weighs more than 10 kilos. They need to have a bro to help them secure it properly, so it can also be grabbed and used to help you in the fight. The sumo fighters during the season stay 24/7 in their \"stable\" with other fighters and their coach. No other ppl are allowed there (of course no women), so the coach needs to also cook for his boyyos. Traditionally it's a huge hotpot for breakfast and dinner and they consume up to 10000 calories during these two meals. So they get nice and big, up to 200 kgs, as there are no weight categories in sumo and it kinda helps when you can't be carried away from the rink. Also, before the match, sumo fighters eat fried chicken because out of the common meat sources, only chicken run on 2 legs and the other animals run on 4 legs. And if you touch the ground with anything else than your 2 feet, you lose in the sumo match. So you want to be like chicken, and not like a pig.\n\nIn the showmatches, Kyoroman had a clear advantage as he was 170 kgs, and Kyohikari had maybe around 120... So majority of their matches just ended with Kyoroman lifting Kyohikari from the ground and carrying him away. Of course they asked for volunteers to try a match, and of course I stood up to try it out...\n\nThey gave us a sumo party suit so we don't get dirty, also a hat that had a shape of the traditional hairdo of sumo warriors and let us choose the fighter we want to fight. Of course I chose Kyoroman... I was assigned team Kyohikari at the very start, so I couldn't break the team... But man... I gave it my all, but I don't think Kyoroman moved because of me. I grabbed his belt, trying to lift his leg, but he had me locked in some way on the other side and when he got bored, he just used the arm lock to pull me down and slapped me to the ground. But I tried!\n\nAfter the sumo match, I visited one more pretty place in Kyoto, a little garden called Shosei-en garden, which was typically japanese garden-y, with a cute tea house on a little hill above lake with a nice wooden bridge going towards it. And at the end I spent some time partially being lost and partially exploring the Kyoto train station building. It is quite marvelous with some super nice views from the top, and some impressing works on the way.", "highlight": true, "tier": "S", "sort_order": 31, "points": [{"latitude": 34.66734416933865, "longitude": 135.50870642565692, "marker_label": "National Bunraku Theater", "marker_order": 1}, {"latitude": 34.990067779272735, "longitude": 135.77313745450363, "marker_label": "Kyoto national museum", "marker_order": 2}, {"latitude": 35.01416089116167, "longitude": 135.7483936103281, "marker_label": "Kyoto Nijo-ji castle", "marker_order": 3}], "mediaItems": []}, {"id": "E032", "name": "Festival and archery weekend", "date": "08/08/2026", "date_ts": 20673, "category": "Town", "abstract": "Visit of Hachioji float festival, paper lantern in shapes of popular character display and attempt to see firework festival. The second day I enjoyed a lot a Japanese archery lesson.", "media": "https://drive.google.com/drive/folders/1Vs-urtvqv43p5QlfLivPBIqKISZY69hh?usp=drive_link", "memo": "During the summer, there are several festivals in and around Tokyo. When looking for some interesting ones, I found out about 2 that I could combine into one day. First, I went to Hachio-ji just after lunchtime. The Hachio-ji festival of that weekend is dedicated to mobile shrines (floats), which are a very elaborately carved wooden carriages that are enshrining some icon of a god. People belonging to that shrine can be on board or on the roof and play flutes and drums and dance in costumes of the enshrined deities. \n\nA wide street is closed for cars during the festival, there are many many food stands, drink stands, and various stands with festival games for children (like fishing plastic fishes, digging for gems in sand, etc.). According to the program of the event, the floats are processed in the evening, but during the afternoon there should have been a drum battle/marathon between the different shrine groups. I managed to walk the full length of the festival street before the start of the drumming. On the way I got a matcha beer which was literally just a scoop of matcha powder mixed with a can of beer. That wasn't my favourite beer of Japan... The ladies selling me the matcha beer have been very surprised that a random guy from Czech Rep found his way to their stand though, which was quite cute. I improved my taste with a mango IPA on the other side of the street, but it was quite strong so in the about 35 deg heat, it was noticeable already. \n\nThen the drumming started, and yeah, many different groups of people spanning the age from like 10 to like 80 were trying to do original performances. Some were aimed to showcase the teamwork of different ppl, some were showcasing the power of their drums, some the neverending repetitive beat without pausing for ppl to switch. Overall it was sometimes super fun to compare these mostly amateurs with some degree of practicing to the drum show I've seen the previous week. In terms of food on the way I had a sausage on a stick, some dumpling filled with a mix of vegetables, and sugar glazed kiwi. On the way I could also see several of the floats and ppl dancing and being dressed up in the god costumes. Some mothers were handing their little babies to a dragon deity to seemingly let the dragon chew on the babies' head. I really hope there is some significance of this being done for good luck, and not as a human sacrifice...\n\nAfter like 2 hours the drummers were slowly ending their performances and I've rushed to the Asagaya Pearl center shopping street to meet up with Mentor. This place should have had some impressive festival in the form of big paper lantern figurines. But the first noticeable thing was the absolutely enormous number of ppl crammed into the shopping street. But fair enough, the lanterns mixed with long paper stripes and calm lights made for a very nice walk under. We joked around with Mentor about some of the lanterns and enjoyed a corn cob before heading back to central Tokyo.\nWe hoped to chill in some park around Meiji Jingu Gaien to enjoy a fireworks evening that were launched from the stadium in the area. However this same idea was shared among thousands of other ppl and we were arriving only like 30 minutes before the start of the show, so instead of chill park sit-down we were herded by the police to various neighboring streets with everpresent signs \"This Is not viewing Area\" around us. In the end we caught only a very small glance at the fireworks before we gave up and went home after the long day.\n\nAfter seeing people of various age carry big containers with bows inside around the university campus, I really wanted to try it out too. Unfortunately, there's no really easy way to do this regularly, as you would need to be a member of some dojo, or university team, and these things are usually not open to english-speaking outsiders.\n\nBut there were several events on one event app that offered such experience. Out of all the different options I chose one of the more expensive ones, because from the photo and description, it seemed like probably the only proper one. A full length shooting range was promised as well as many tries and even dressing up in the proper traditional clothing. \n\nI met the guide at one subway station and then we made our way to the sports center. It was me, a couple from Australia of around my age, and a random 40-50 year old Japanese guy. First we were given the traditional clothes, it consisted of a kimono-like top, and very wide trousers with a belt with a flap at the back. Then we helped string the bows, which was quite hard to do without help. The bows are assmetrical and about 2-2.5 meters high, originally made of a mixture of wood and bamboo. The strings are made usually by hemp or something synthetic.\n\nThe first phase was to learn the proper stance sideways to the target with a bow proxy. The bow proxy was just a rubber band on a piece of wood. On the proxy we practiced also the correct technique of releasing the bow. The right hand (for me) was the one holding the string, by making a trigger with a thumb. By rotating the hand upwards, the string was released and at the same time the left hand was supposed to twist outwards so the string movement can go straight without colliding with the bow or your hand. \n\nThen we moved on to practice with bows and arrows. First we tried a proper way of notching the arrows as there are no assistance tools except a little plastic claw on the end of the arrow that fits the string. The arrow should rest lightly on the topside of your thumb holding the bow, and pressed against the bow firmly by the point finger of right hand and secured in place by the middle finger of the right hand. There are some slight variations of this depending on the area, but this is how it was taught to us. Then we got some three finger glove to protect our fingers and started shooting. \nFirst we went about 5 meters closer to the target than the full length. The full length of the shooting practice is 28 meters and the target is a 30 cm diameter circle. From the closer range the goal was to figure out the correct movements and let the arrow fly as straight as possible. There is also an upward movement when pulling the string that is noticeable when looking at the archery practice. This is done because it was found out that it is less tiring than just simply pulling at the shoulder's height. From the shorter distance it didn't take super long for me and the Australian guy to hit the target, but the spread of our arrows was quite big... The girl was quite small so her maximum pull wasn't really strong. From the shorter distance it was just enough and I think she hit the target at least once. Unfortunately, the japanese guy was a serious anti-talent for this synchronization of movements. It seemed like at least half of his arrows were not shot properly, because he had hard time even notching and securing the arrow in place.\n\nWhen we moved to the full length, even close misses were celebrated by the instructor, because it really was far. In the end my arrows flew either in more or less the right direction, but too high, or more or less right height, and completely off to one or other side. So out of about 50-60 tries, I've hit the target 2 times at full length. The Australian guy once, the girl's arrows did not fly straight far enough, so she had it even harder because she needed to account for the balistic curve as well, and thus she didn't hit the target at all. The poor japanese guy got close maybe 2 or 3 times, but still, majority of his arrows went to completely random places. To put it into perspective, the event description said, that about 50% participants even hit the target! So 2 hits are quite nice. \n\nI can't share the photos publicly, so please enjoy at least my illustration, and ask me directly for photos in dms.", "highlight": false, "tier": "A", "sort_order": 32, "points": [{"latitude": 35.65984067767478, "longitude": 139.33744999568853, "marker_label": "Hachioji festival street", "marker_order": 1}, {"latitude": 35.70473438224584, "longitude": 139.63675751035322, "marker_label": "Asagaya Pearl Shopping street", "marker_order": 2}], "mediaItems": []}, {"id": "E033", "name": "Hachio-ji area hike", "date": "11/08/2026", "date_ts": 20676, "category": "Hike", "abstract": "What was supposed to be a short visit of temple ruins ended up being a nice proper hike", "media": "https://drive.google.com/drive/folders/13kH6bV-mCu2NblfBfAVnPk596QBEPbx2?usp=drive_link", "memo": "On the 11th August, there is a national holiday in Japan called the \"mountain day\". I tried to figure out a nice place to visit that day, and I converged to visit castle ruins of Hachio-ji. The Hachio-ji castle was built as purely war refuge of one samurai lord during the warring period in 17th century. Unfortunately only after 10 years it was sieged and captured by an enemy and burned and destroyed. Since then the people didn't come back to build something in that area until only about 150-100 years ago, and thanks to this, the castle remains were quite well preserved as well as various artifacts of that period.\n\nRecently the area was renovated and some structures were built to introduce the area to wider public. But when I visited the tourist center in front of the castle area entrance, I didn't understand a thing and there was no reception on my Japanese eSim, so I couldn't even translate the texts. But I've found a big plastic map of the area and it seemed like a good idea to go climb the surrounding hills to see the site of the temple that gave the name to the whole area, and ultimately reach a summit of a hill called Fujimidai (as maybe it would give me Fuji - understandable for my czech speaking buddies).\n\nThe walk in the forest was really nice, some parts seemed a bit abandoned, and I haven't met too many people. The places where some buildings should have been had quite recently renovated buildings but almost zero people and a bit overgrown greenery around. There were a lot of stone tablets on the way up the hill and some beardy man statues. \n\nFinally I arrived to the summit, which didn't feel like a summit at all, but! The Fuji was really visible! So I chilled at nearby bench for a while before heading back down. My czech map app showed me there should be a path leading back to the castle complex, so I didn't have to go back the same way and make a nice circle around. The first of the 2 possible paths I completely missed, but the second I found, eventhough there were only older and not official arrows pointing towards it. And it really felt like I'm the first person to walk through there since start of the season. I had so many cobwebs in my face, I had to use some old slippery ropes to help me down some rocks, there was shin-high grass in many places. And wow, so many different bugs and birdsongs. There are big screaming insects chilling under the bark of trees. And as I was the first person to go through there in a long while, I disturbed them, so they flew from under the bark with a thunderous sound of impacts of their wings to the tree, which was really scary, as well as their close flybys to my head. Further along the path, there were some more weird sounds either from insects or birds that made me stop and try to find them. But in the end I arrived back to the castle complex without more alien encounters. \n\nThe main attraction of the castle complex is a big wooden bridge crossing the valley between a path on one side and the area of the main keep on the other. The bridge looks really nice, the main keep area is just a big grass Area with a couple of stone squares and other more or less random assortments of stones with signs showing the excavation photos and talking about the original purpose of the area. To go out the \"main\" gate of the keep, you need to go down big stairs that were made by repairing the steps found originally in the area during the excavations. Under the bridge, there's a waterfall with a little lake underneath it, and it is said that at the lake all the servants and ladies of the castle who survived the seige commited suicide so they wouldn't be serving the new lord. And because of this, the river ran red with blood for 3 days after the seige. There were some other nice areas and I ended the trip by getting a nice ice tea from an old lady in a little shop near the area entrance.", "highlight": false, "tier": "A", "sort_order": 33, "points": [{"latitude": 35.65290629222439, "longitude": 139.25653985756512, "marker_label": "Hachioji castle ruins", "marker_order": 1}], "mediaItems": []}, {"id": "E034", "name": "Beach and Fun day", "date": "15/08/2026", "date_ts": 20680, "category": "Town", "abstract": "Day when I finally swam in the Japan sea and enjoyed also the Yokohama adventure park", "media": "https://drive.google.com/drive/folders/11YjI-3aUExIdkxfiCyoQ6liUfZDQTWhk?usp=drive_link", "memo": "The Japanese trip wouldn't be complete without dipping myself into the ocean at least once. My hope was that it would include some surfing and other fun with friends, but in the end due to time and money running low, as well as very shady online offers of english-led surfing schools, I just went to the beach on my own. After some research I selected the Zushi beach, as it is probably the second-closest to main part of Tokyo with also some hope of not being completely overcrowded.\n\nThe beach was in like a bay almost completely protected by a peninsula on each side, so the waves were very small. The water had just good enough temperature to be refreshing and also it was reasonably clear. The beach was from dark coarse sand with so so many little shells in it. That meant that I spent a good half an hour just sieving through the sand near my towel to enjoy the different shapes and colors of the shells. The rest of the time I spent swimming, reading a book, and just chilling. In the water I dug out some very pretty shells from the sand and one of them even had a resident! He slowly emerged, mainly with his claw, very dramatically knocked on the shell with the claw and looked at me. I understood and submerged him again to leave him on his own.\n\nAfter I had enough of this, I got a mango smoothie (which was in fact a big mango ice cream slowly melting in my glass) at a bar ran by some of the prettiest Japanese girls I've seen during my trip. Got a nice interaction with one of them thanks to my little friend Totoro on my backpack, a couple of smiles and I went away. Then I found a latin american bistro where I got a choripan (chorizo in a bun - hotdog like) and an empanada, and then I left for the next stage of my day. \n\nThe next stage was to visit the Yokohama's cosmo world, which is an amusement park with some pretty nice rides. On my way there I accidently found the base of Nissan and its gallery, so I also looked at some new Nissan cars in a pretty space. And finally, I was able to find some weird statues on my walk towards the amusement park! Including my favourite type of statues: middle-aged man watching the skies! After I got to the amusement park, I figured out how to pay for the rides and then I spent A LONG TIME in queues and some nice time on the rides. First I got this big upgraded carousel, which was super fun, then a 90 minute queue for the trademark rollercoaster which was very fun, but quite short. Then a shorter queue for a weird small rollercoaster with rotating seats that wasn't done for single people, and then I tried to go on a VR rollercoaster. But for some reason, there was a weight limit of 100kg, and I got measured by the staff and got 102 on the scale, so they kicked me out. To spend the last couple of hundreds I had on my ticket I needed to go somewhere else and I chose a ride in a scary house with Japanese folklore thematic. I laughed at majority of the scares, but some of them were pretty nicely made and 1 or 2 surprised me. \n\nWhen I was looking for a place to have dinner, I stumbled upon Pokémon sleeping world display, which looked more like ritual sacriface of Snorlax. And then I got finally some dipping udon, and I really hope I didn't embarass myself with how I ate it. After returning home I confirmed my fear of having sunburn on my back, as I can't reach all the parts of my back with my hands, so those were burned.", "highlight": false, "tier": "C", "sort_order": 34, "points": [{"latitude": 35.29263158159693, "longitude": 139.57277339824077, "marker_label": "Zushi beach", "marker_order": 1}, {"latitude": 35.45526972386199, "longitude": 139.63699775452076, "marker_label": "Yokohama Cosmo world", "marker_order": 2}], "mediaItems": []}, {"id": "E035", "name": "Old and New Tokyo day", "date": "22/08/2026", "date_ts": 20687, "category": "Town", "abstract": "First a visit to Meiji Jingu and then getting driven around in a tuned Nissan GTR from the 80s during a rainpour", "media": "https://drive.google.com/drive/folders/16iIuxj1lx8mSLww_gOYDBk1GrRX4Q3GR?usp=drive_link", "memo": "Slowly reaching the end of my Tokyo stay, I still had some major places I haven't visited yet. The main one was the Meiji Jingu park and shrine. It is a big park with a large shrine that was built and then dedicated to the emperor Meiji and his wife. On the approach, there is the biggest Torii gate in Japan, and everything is inside a forest in the middle of Tokyo. The shrine itself is pretty, the major things for me personally were the big ginkgo trees. Two of them grow right next to each other and are nicknamed husband and wife and tied together using a huge rope. \n\nWhile in the area I also visited the garden belonging to the shrine, which has a nice lake and teahouse area, and some very important water spring, which is described as especially clean, but drinking it is prohibited. Washed my face in it at least, but didn't notice any changes or improvements. Otherwise the garden area is not as exceptionally well-kept as other gardens I visited. It's more deliberately left for the nature to govern itself at some places and only some areas are given order. After leaving the garden I passed the display of many consecrated sake (and wine) barrels that were offered to the emperor. The sake barrels are decorated with paintings, so they make for a nice thing to look at, as easily recognizable by the amount of tourists doing photos of them and of themselves in front of them.\n\nIn the evening I had another paid experience event called Tokyo Drift Experience. We were supposed to meet at one place in Harajuku, where we would be split into several more or less tuned cars and be driven around Tokyo to the most important places for car and car tuning enthusiasts. The only problem was, that right at that time A HUGE rain started. Me, and two french teenagers (siblings - girl and a guy) were sent to one car to meet the driver and jump in. The car was was a beige Nissan Skyline GT-R 1980s version. Slightly lowered, wheels with nice rims, slightly tilted. Improved bumpers. I am deeply sorry, but the driver's name I forgot almost immediately after hearing it from him.\n\nDue to the heavy rain we skipped the first stop and went to Daikoku PA right away. It's a big parking lot near Yokohama, where it's impossible to get without a car, but it's the major spot for tuned cars to meet up at. And there were SO many of them. The heavy rain almost flooded the parking lot and I went through 10 cm deep water many times on the parking lot, but the cars kept arriving, some had neons, some had decals, some had just fancy paint, many skylines GTR, some mazda RXs, some Subarus, some European brands, couple of Supras, some Lancers evo of various ages. We spent like 1.5 hours with various levels of rain just going through the lot making photos of the cars and watching them drive around. After the Daikoku, we went towards the biggest and most known car accessories shop called Autobacs. But to get there we needed to go through several long tunnels and bridges including the Rainbow bridge, and as we left the Daikoku PA with a couple of other cars at the same time, the drivers kept zooming past each other to show off their sounds in the tunnel and show their accelleration. Very nice experience. At the shop, there were SO many different things from basic clothes, specialized clothes, across models and little things, up to various cosmetic things for car, performance things, or even new components like turbos or racing seats.\n\nAfter leaving there we went to the Tokyo Tower, for the last photo spot and then we were taken to our accommodations. During the conversation I found out that getting such a classic car is not that expensive in Japan, as there are many on the market, but it's hard to export them. The modifications are legal as long as you don't change the performance too much, or you somehow modify the chasis that could lead to some safety problems. The driver was a bit sad that the time of petrol cars is reaching its end, as also in Japan, many people are now buying hybrid cars, especially in the big cities. Getting a pure electric car doesn't make sense yet, as Japanese electric car recharge network is not good. During the ride we also got an announcement that the rain caused some wards in Yokohama to be evacuated due to flooding. But in the end it was a really nice day.", "highlight": false, "tier": "A", "sort_order": 35, "points": [{"latitude": 35.676467294757444, "longitude": 139.69930443918724, "marker_label": "Meiji Jingu shrine", "marker_order": 1}, {"latitude": 35.46187885658371, "longitude": 139.6804906391794, "marker_label": "Daikoku PA", "marker_order": 2}, {"latitude": 35.53435285422659, "longitude": 139.71503032634183, "marker_label": "Super Autobacs", "marker_order": 3}], "mediaItems": []}, {"id": "E036", "name": "Museum Saturday", "date": "29/08/2026", "date_ts": 20694, "category": "Museum", "abstract": "Last weekend in Tokyo, low energy, two museums to visit - Edo museum and War museum", "media": "https://drive.google.com/drive/folders/1UiLpWRoq41KlLhyiOL1Y9IckNJiGahpG?usp=drive_link", "memo": "To fulfill my quest of visiting a new place or doing something new every week, I needed to figure out something new and chill enough for the last weekend spent in Tokyo. In the end I selected 2 museums on quite rainy day. \n\nThe first museum I visited was the Tokyo-Edo museum, where the visitor gets a chance to see how the life looked like in Edo and later Tokyo since about 17th century until today. The museum was renovated not long ago and it was also recommended to me by Yuichiro. The first thing a person sees when entering the exposition area is a big wooden bridge, that shows a part of 1:1 reconstruction of the most important bridge in Edo. Then many different little artefacts and many different info boards can be seen. When Edo was selected as the seat of the Shogun, a big castle for the shogun was built there, and around it many big villas and castles for the most important lords. But not long after, almost everything was destroyed by fire, so it was an opportunity to make the city a bit different. This time the castle was rebuilt, but instead of many villas around it, smaller buildings forming classic streets were built. Still about 75% of the Edo area was owned and dedicated to the warrior class, then about 15% were temples and shrines, and the rest for normal ordinary ppl. To let the city grow, many different waterworks and land reclaiming activities were done, so the land area of today's Tokyo looks completely different than the Tokyo bay before the humans came. And already at the start of the Edo era, there was more than 1 000 000 people living in Edo.\n\nAfter I read through these basic information, I could move into ground floor, where life of ordinary people was illustrated by life-size stalls, houses, items, etc. As I knew from the science museum, pre-modern Japan had the day split into time sections that divided the day and night to 6 sections each. To tell the time, each district had a big bell, and the bell-keeper was a very respected person living from bell tax collected from the people of the district. Each district was also split into several blocks and each block had a randomly chosen mayor for 3 months (if I remember correctly), who was supposed to take care of the gate of the district and make sure that all fire prevention measures are up to date and report to higher-ups. \n\nEach block was split into several layers of wealth by the distance from the main street. Right next to the street shop owners, good artisans, and wealthier people lived, and in the furthest part, only long halls split into very small living spaces for poor people were found. Usually there was a public toilet (split to pooping/peeing parts) and a well, where people gathered their water and washed their clothes and exchanged info. One interesting fact that I remember is, that their kind of police was usually the lowest job you could do, and it was one of very few jobs the lowest and poorest people could do who were otherwise banned from any other job.\n\nThere was also quite a rich section about books, libraries, and travelling librarians, because the Edo people perfected the wood printing and it was very accessible to get a book, and comic books were quite popular. The travelling librarians were usually able to also share some works that were frowned upon and people could get the real honest information like that. \n\nIn the more modern part of the exposition, there was a temporary exposition of paintings of beautiful ladies. Also a big shrine float and some showcases of how theater could look like, how first riksha looked like (a Japanese invention), how the insides of people's homes changed with the time and influences from abroad after the Meiji era. One more funny quote from there was, that many households started saying that as king needs his crown, his throne, and his sceptre, every household needs a washing machine, a refrigerator, and a TV. \n\nAfter I finished in this museum, I went over to the Yushukan museum, which is a museum of Japanese army. It is in a complex with a shrine, that is dedicated to fallen soldiers, and every year there's a procession to remember fallen soldiers. The museum houses the only full original Zero fighter plane in Japan, and some other very nice army technology like cannons, a tank, submarines, some models of warships, trains, etc. The exposition itself was very detailed and I tried to read a lot, but I spent a lot of time already at the part talking about skirmishes leading to re-establishment of the Emperor and getting rid of the Shogunate, about first wars between Japanese and Chinese about Korea and Manchuria, later war with Russia about Manchuria. But for the most interesting part, the direct causes of Japanese stance in the second world war I ran out of time. So I just scanned through some texts I could find, and mainly it seems that Japanese empire expanded so much, that they needed a lot of natural resources to maintain their territories. These resources were not found on the Japanese homeland, or at the territories they controlled in big enough amounts, so they needed to import from various other locations that were falling under control of mainly USA-led forces. Germany promised some resources to Japan, so they made the pact, and Japan continued to demand free shipping of those resources from the US controlled territories, but US made an embargo on Japan that wasn't resolved through many many meetings and Japan just decided to get the territories by force after crippling the US navy at Pearl Harbor. I might be a bit off, because I really skimmed through the texts, but it was probably like that. There were also some more detailed texts about different phases of the war supported by copies of letters of real soldiers from the war. Would have been interested to stay an hour longer to really read through all of that, but the museum closed at 16:30 already...", "highlight": false, "tier": "A", "sort_order": 36, "points": [{"latitude": 35.69669301632003, "longitude": 139.79575505452928, "marker_label": "Tokyo-Edo museum", "marker_order": 1}, {"latitude": 35.69501219898223, "longitude": 139.74358411035328, "marker_label": "Yushukan museum", "marker_order": 2}], "mediaItems": []}, {"id": "E037", "name": "Yokohama exploration", "date": "02/09/2026", "date_ts": 20698, "category": "Town", "abstract": "Last full day in Tokyo, exploration of the Yokohama area and visit of its huge chinatown, where I had a hard time with the heat", "media": "https://drive.google.com/drive/folders/1__RGGO7SmMUSkSMiOqyLgxArNf842Eag?usp=drive_link", "memo": "On the last full day in Tokyo before heading over to Hokkaido, I decided to explore Yokohama a bit. I'm not sure how exactly it works, but I've read some signs, that Yokohama is the second largest city of Japan. I thought it was a part of Tokyo as the travel between these two goes seamlessly without decrease in the density of buildings. Anyways, Yokohama got important, because it was the first harbor near Tokyo that could receive the big European and American ships, so it became the ultimate goods transfer hub. There are still some remains of that era that can be visited, like the biggest crane (Hammerhead crane) of prewar times, or red brick warehouse buildings, which are now a shopping mall and event hall.\n\nContinuing along the bay, I walked through some parks, but also I went to see this ship terminal that looked like a Tony Stark's ship with grass on it from afar. There were two couples doing wedding photos on there and there was a nice ship parked next to it, but it was so very hot up there that I needed to kinda run away. After walking through another park with a big fountain with a bronze lady in the middle of it, I headed over to the chinatown.\n\nMy biggest quest for the chinatown was to get good food, good drinks, and enjoy the chinese details. For the food I started with fried cheese balls on a stick (very very good), some grilled dumplings on a stick (also very good), and then I couldn't resist a \"thaiwanese fried chicken\" which looked like a schnitzel. That turned up to be quite a bad idea, because I got the schnitzels straight from the oven, and when you add that it was already quite a hot day, and the taste was medium spicy, it increased my inner temperature to very unhealthy levels. I thought I would get a heatstroke for sure if I don't find a cold drink soon. Then a window with teas, bubble teas, juices, and other stuff saved me. I got a chinatown version of Mango lassi and that enabled me to survive. By navigating the small streets with many lanterns, many old statues and architectonic details not found outside chinatowns, I was able to get a bit better. There were also some very richly colored and decorated gates at the main streets leading to the chinatown. In the end I bought a set of sesame sweet balls on a stick to end my gastronomy exploration.", "highlight": false, "tier": "B", "sort_order": 37, "points": [{"latitude": 35.452736948393586, "longitude": 139.64289439684978, "marker_label": "Yokohama red brick warehouse", "marker_order": 1}, {"latitude": 35.44319908233933, "longitude": 139.64406085341793, "marker_label": "Yokohama Chinatown", "marker_order": 2}], "mediaItems": []}, {"id": "E038", "name": "Sapporo", "date": "03/09/2026", "date_ts": 20699, "category": "Town", "abstract": "Start of my Hokkaido journey. Sapporo's museums, art places, and random exploration (for food and otherwise)", "media": "https://drive.google.com/drive/folders/19G62H90FFfN8k053-dP2EtlQHCBV6ZbF?usp=drive_link", "memo": "Okay my vacation starts! First step was to get to Sapporo by plane from Tokyo. I used a JetStar company, which was very cheap, but it's like Ryanair in Europe. What surprised me was that they weighted every single onboard luggage, so I had to pay the fee for overweight carry-on luggage. Otherwise the trip was quite smooth, eventhough we had like 45 min delay at the start. Sapporo's public transport was smooth so I got to my accommodation quite easily, but that was worse than I expected. It was more an airbnb than anything else as it was the whole flat which was refurnished a bit, but otherwise left in its original state. So e.g. the bathroom was quite bad for the money I paid. But after a while my hunger sent me outside to find some food despite a big rain. One of the first restaurants that looked nice was a soup

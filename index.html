<style>
    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        color: #202a35;
    }

    .folium-map {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 66.666vw !important;
        height: 100vh !important;
        transition: width 0.3s ease;
        z-index: 1;
    }

    #sidebar {
        position: fixed;
        top: 0;
        right: 0;
        width: 33.333vw;
        height: 100vh;
        box-sizing: border-box;
        overflow-y: auto;
        padding: 24px;
        background: #ffffff;
        border-left: 1px solid #d7dee6;
        z-index: 1000;
        transition: width 0.3s ease;
    }

    body.expanded .folium-map {
        width: 33.333vw !important;
    }

    body.expanded #sidebar {
        width: 66.666vw;
    }

    h1 {
        margin: 0 0 12px;
        font-size: 25px;
        line-height: 1.2;
    }

    h2 {
        margin: 24px 0 10px;
        font-size: 18px;
    }

    .intro, .placeholder, .entry-button small,
    .media-section p {
        color: #526171;
        line-height: 1.5;
    }

    .entry-list {
        display: grid;
        gap: 10px;
    }

    .entry-button {
        display: block;
        width: 100%;
        padding: 13px;
        text-align: left;
        border: 1px solid #d7dee6;
        border-radius: 8px;
        background: #f8fafb;
        cursor: pointer;
    }

    .entry-button:hover {
        background: #eef6f8;
        border-color: #145b73;
    }

    .entry-button strong,
    .entry-button span,
    .entry-button small {
        display: block;
    }

    .entry-button span {
        margin-top: 4px;
        font-size: 13px;
        color: #526171;
    }

    .entry-button small {
        margin-top: 6px;
        font-size: 13px;
    }

    #back-button {
        margin-bottom: 20px;
        padding: 8px 12px;
        cursor: pointer;
    }

    .detail-date {
        color: #526171;
    }

    .detail-abstract {
        font-size: 18px;
        line-height: 1.5;
    }

    .memo-section, .media-section {
        margin-top: 22px;
        padding-top: 10px;
        border-top: 1px solid #d7dee6;
    }

    #detail-memo {
        white-space: pre-wrap;
        line-height: 1.6;
    }

    #media-link {
        display: inline-block;
        margin: 6px 0 20px;
        color: #145b73;
        font-weight: bold;
    }

    @media (max-width: 800px) {
        .folium-map,
        body.expanded .folium-map {
            width: 50vw !important;
        }

        #sidebar,
        body.expanded #sidebar {
            width: 50vw;
            padding: 16px;
        }
    }
    .tier-group {
        margin: 12px 0 18px;
    }

    .tier-heading {
        margin: 0 0 8px;
        padding: 8px 10px;
        border-radius: 6px;
        background: #eef2f5;
        font-size: 15px;
    }
    .category-label {
        display: block;
        margin: 18px 0 6px;
        font-weight: bold;
    }

    #category-filter {
        width: 100%;
        padding: 10px;
        border: 1px solid #d7dee6;
        border-radius: 6px;
        background: #fff;
        font: inherit;
    }

    .sidebar-section {
        margin-top: 22px;
        border-top: 1px solid #d7dee6;
        padding-top: 12px;
    }

    .sidebar-section > summary,
    .tier-group > summary {
        cursor: pointer;
        font-weight: bold;
        padding: 6px 0;
    }

    .tier-group {
        margin: 8px 0;
    }

    .tier-group > .entry-list {
        margin: 6px 0 12px;
    }

    .placeholder {
        color: #526171;
    }
</style>

    (function () {
        const map = map_402e0a79a4a4119da47a4e2e7f67dc18;
        const entries = [{"id": "entry-001", "name": "Old Town Walk", "date": "2025-06-01", "abstract": "A walk through the historic centre, with a few favourite stops.", "media": "https://drive.google.com/drive/folders/REPLACE_WITH_YOUR_FOLDER_ID", "memo": "This is the longer journal entry for the Old Town Walk. It appears in the expanded panel. Later, we can add individual photo and video previews here.", "tier": "S", "highlight": true, "category": "City", "points": [{"latitude": 49.6116, "longitude": 6.1319}, {"latitude": 49.6098, "longitude": 6.1292}]}, {"id": "entry-002", "name": "Sample Day Trip", "date": "2025-06-15", "abstract": "A short visit to another city with a few places of interest.", "media": "https://drive.google.com/drive/folders/REPLACE_WITH_ANOTHER_FOLDER_ID", "memo": "This is a second sample memo. The expanded panel will show the full text and, in a later step, the associated media.", "tier": "A", "highlight": false, "category": "Hike", "points": [{"latitude": 50.6292, "longitude": 3.0573}]}];
        const markerNamesByEntry = {"entry-001": ["marker_3b9e3ec8083b2b16fc55bca0d6f2e48d", "marker_73cfc6c8e76f1e8deafc1b60986f95f7"], "entry-002": ["marker_44335afc2979212e5a0fdb906079c3dd"]};

        const entriesById = {};
        for (const entry of entries) {
            entriesById[entry.id] = entry;
        }

        function refreshMap(fitEntryId) {
            window.setTimeout(function () {
                map.invalidateSize();

                if (fitEntryId && markerNamesByEntry[fitEntryId]) {
                    const latLngs = [];

                    for (const markerName of markerNamesByEntry[fitEntryId]) {
                        const marker = window[markerName];
                        if (marker) {
                            latLngs.push(marker.getLatLng());
                        }
                    }

                    if (latLngs.length === 1) {
                        map.setView(latLngs[0], Math.max(map.getZoom(), 13));
                    } else if (latLngs.length > 1) {
                        map.fitBounds(L.latLngBounds(latLngs), {
                            padding: [35, 35],
                            maxZoom: 14
                        });
                    }
                }
            }, 350);
        }

        function makeEntryButton(entry) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "entry-button";
            button.dataset.entryId = entry.id;

            const name = document.createElement("strong");
            name.textContent = entry.name || "Untitled place";

            const date = document.createElement("span");
            date.textContent = entry.date || "";

            const abstract = document.createElement("small");
            abstract.textContent = entry.abstract || "";

            button.append(name, date, abstract);
            return button;
        }

        function fillEntryList(container, matchingEntries, emptyMessage) {
            container.replaceChildren();

            if (matchingEntries.length === 0) {
                const message = document.createElement("p");
                message.className = "placeholder";
                message.textContent = emptyMessage;
                container.appendChild(message);
                return;
            }

            for (const entry of matchingEntries) {
                container.appendChild(makeEntryButton(entry));
            }
        }

        function renderSidebar() {
            const categoryFilter = document.getElementById("category-filter");
            const selectedCategory = categoryFilter.value;

            const categoryEntries = selectedCategory === "__all__"
                ? entries
                : entries.filter(entry =>
                    (entry.category || "Uncategorized") === selectedCategory
                );

            fillEntryList(
                document.getElementById("category-entries"),
                categoryEntries,
                "No entries in this category."
            );

            // Highlights stay independent of the selected category.
            const highlightedEntries = entries.filter(
                entry => entry.highlight === true
            );

            fillEntryList(
                document.getElementById("highlight-entries"),
                highlightedEntries,
                "No highlighted entries yet."
            );

            // Tier groups follow the selected category.
            const tierContainer = document.getElementById("tier-groups");
            tierContainer.replaceChildren();

            const entriesWithTiers = categoryEntries.filter(
                entry => entry.tier && entry.tier.trim() !== ""
            );

            if (entriesWithTiers.length === 0) {
                const message = document.createElement("p");
                message.className = "placeholder";
                message.textContent = "No tiered entries in this category.";
                tierContainer.appendChild(message);
                return;
            }

            const preferredOrder = ["S", "A", "B", "C", "D"];
            const tierNames = [...new Set(
                entriesWithTiers.map(entry => entry.tier.trim())
            )].sort((a, b) => {
                const aIndex = preferredOrder.indexOf(a);
                const bIndex = preferredOrder.indexOf(b);

                if (aIndex !== -1 || bIndex !== -1) {
                    if (aIndex === -1) return 1;
                    if (bIndex === -1) return -1;
                    return aIndex - bIndex;
                }

                return a.localeCompare(b);
            });

            for (const tier of tierNames) {
                const groupEntries = entriesWithTiers.filter(
                    entry => entry.tier.trim() === tier
                );

                const group = document.createElement("details");
                group.className = "tier-group";

                const heading = document.createElement("summary");
                heading.textContent = `Tier ${tier} (${groupEntries.length})`;

                const list = document.createElement("div");
                list.className = "entry-list";

                for (const entry of groupEntries) {
                    list.appendChild(makeEntryButton(entry));
                }

                group.append(heading, list);
                tierContainer.appendChild(group);
            }
        }

        window.showEntry = function (entryId) {
            const entry = entriesById[entryId];
            if (!entry) {
                return;
            }

            document.body.classList.add("expanded");
            document.getElementById("overview").hidden = true;
            document.getElementById("details").hidden = false;

            document.getElementById("detail-name").textContent = entry.name || "";
            document.getElementById("detail-date").textContent = entry.date || "";
            document.getElementById("detail-abstract").textContent =
                entry.abstract || "";
            document.getElementById("detail-memo").textContent = entry.memo || "";

            const mediaLink = document.getElementById("media-link");
            mediaLink.href = entry.media || "#";
            mediaLink.textContent = "Open media folder in Google Drive";

            refreshMap(entryId);
        };

        window.showOverview = function () {
            document.body.classList.remove("expanded");
            document.getElementById("details").hidden = true;
            document.getElementById("overview").hidden = false;

            refreshMap(null);
        };

        const categoryFilter = document.getElementById("category-filter");
        const categories = [...new Set(
            entries.map(entry => entry.category || "Uncategorized")
        )].sort((a, b) => a.localeCompare(b));

        const allOption = document.createElement("option");
        allOption.value = "__all__";
        allOption.textContent = "All categories";
        categoryFilter.appendChild(allOption);

        for (const category of categories) {
            const option = document.createElement("option");
            option.value = category;
            option.textContent = category;
            categoryFilter.appendChild(option);
        }

        categoryFilter.addEventListener("change", renderSidebar);

        // One handler supports sidebar entries and marker pop-up buttons.
        document.addEventListener("click", function (event) {
            const target = event.target;
            if (!(target instanceof Element)) {
                return;
            }

            const button = target.closest("[data-entry-id]");
            if (button) {
                window.showEntry(button.dataset.entryId);
            }
        });

        // Populate the lists when the page loads.
        renderSidebar();
    })();
    
</script>
